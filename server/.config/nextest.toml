# The heavy server integration tests each spin up a multi-node Raft cluster on a
# `worker_threads = 4` runtime (the `cluster_e2e` binary) or drive snapshot+tail
# journal recovery (`seglog::tests`, which live in the `nano-server-storage`
# crate's lib test binary since the ADR 0064 Phase 1 extraction — the `test()`
# predicate below matches them by name regardless of which test binary they are
# in), or launch a real out-of-process JS-runtime trigger driver/worker and
# assert its events reach the durable inbox over the real ingress within a
# wall-clock poll budget (`triggers::tests::pack_driver_*` /
# `pack_worker_*` in the `nano-server-console` crate). They are timing
# sensitive: their fixed
# replication/failover readiness budgets (e.g. "the create ships to node 1"
# within 8s) — and, for the pack driver/worker tests, the ~10s budget for a
# spawned child runtime to boot and deliver its events — assume the tokio
# runtime and the child process make steady progress, which only holds if
# the process isn't starved of CPU.
#
# `max-threads = 1` (below) already stops these heavy tests from running
# concurrently with EACH OTHER, but nextest still schedules up to `test-threads`
# (= num-cpus) *other* tests alongside them. On a small CI runner that ambient
# parallel load oversubscribes the cores and starves a cluster test's 4-worker
# runtime, so its wall-clock budgets elapse before replication is scheduled — the
# create never appears to "ship" and the test fails if the runner stays saturated.
#
# `threads-required = 'num-test-threads'` fixes the root cause: each heavy test
# reserves the ENTIRE test-thread pool, so it runs with NO other test executing
# concurrently — the same uncontended condition under which these tests are
# deterministic locally. No retries: tests must pass on the first run (see
# AGENTS.md, "No Test Retries"); a retry only masks a real defect. The whole
# suite stays strict (zero retries) and, apart from these serial-heavy tests,
# fully parallel.
#
# The filter must name the ACTUAL heavy binaries: `binary(cluster_e2e)` covers
# every multi-node cluster test (they all boot a 2-node cluster), not a stale
# test name. A filter that matches nothing silently leaves those tests running
# under ambient parallel load — the exact starvation flake this override exists
# to prevent. The `pack_driver_`/`pack_worker_` predicates are scoped to
# `triggers::tests::` so they match only those four out-of-process-launch tests,
# not the many fast `*pack_*` logic tests elsewhere in the crate.
[test-groups]
serial-heavy = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(cluster_e2e) or test(seglog::tests) or test(triggers::tests::pack_driver_) or test(triggers::tests::pack_worker_)'
test-group = 'serial-heavy'
threads-required = 'num-test-threads'

# A test whose process exits while something still holds its stdout/stderr open
# (a leaked child process or inherited handle) is a defect, not a warning (#1474).
# Fail it instead of reporting LEAK, so the defect class cannot creep back into
# any test. CI's `server (clippy + test)` job runs this default profile.
[profile.default]
leak-timeout = { period = "500ms", result = "fail" }
