[package]
name = "nanobpm-gateway-rest-server"
version = "0.0.25"
edition = "2024"
publish = false
description = "NanoBPM gateway: stub server for the generated Camunda 8 Orchestration Cluster v2 REST layer, wired to the embedded nanobpmn engine."

# Workspace rooted here (ADR 0064) so `server/target`, `server/Cargo.lock`,
# `server/.config/nextest.toml`, the `[patch.crates-io]` section and the
# profiles below all stay exactly where the Makefile, scripts and CI expect
# them. The storage layer lives in the member crate
# `crates/nano-server-storage`; this package stays the binary.
[workspace]
members = ["crates/*"]

[dependencies]
nanobpm-gateway-rest = { path = "../generated" }
# Generated console API layer (models + axum router + per-tag Api traits) from
# spec-console/console-api.yaml. Only needed with the `console` feature.
nanobpm-console-api = { path = "../generated-console", optional = true }
nanobpmn-engine-core = { path = "../engine-core", features = ["serde"] }
# The shared SQLite read model (CQRS query side), extracted so the same
# projection + read queries compile both here (native/bundled C SQLite) and for
# the in-browser WASM test engine. The gateway consumes the `native` backend.
nanobpmn-read-model = { path = "../read-model", features = ["native"] }
# The storage layer (metrics, memory/allocator, journal, seglog, var stores,
# read-model facade, remote export sink), extracted under ADR 0064 Phase 1.
# `main.rs` re-exports its modules at the crate root so existing
# `crate::journal::…` paths keep resolving.
nano-server-storage = { path = "crates/nano-server-storage" }
# Falcon protocol wire types (ADR 0064 Phase 2). The falcon handlers/dispatcher
# stay in this binary (`src/falcon.rs`), which re-exports the frames at that
# module's root so its handler code is unchanged.
nano-falcon-protocol = { path = "crates/nano-falcon-protocol" }
# Runtime/engine-glue layer (ADR 0064 Phase 2): backpressure, drain guard,
# recovery throttle, runtime config, placement, cluster topology, the deepthi
# engine actor, the partition router, and cmd_profile. Re-exported at the crate
# root so existing `crate::deepthi::…` etc. paths keep resolving.
nano-server-runtime = { path = "crates/nano-server-runtime" }
# Raft/consensus layer (ADR 0064 Phase 2): the openraft state machine, log
# store, falcon-backed transport, and peer uplink. Re-exported at the crate root
# so existing `crate::raft::…` etc. paths keep resolving.
nano-server-raft = { path = "crates/nano-server-raft" }
# Shared in-memory instance-trace store (ADR 0064 Phase 3). Extracted from the
# console module's `trace.rs` into a leaf crate so that both this crate (which
# owns the `ServerImpl.trace_store` field) and the console layer can depend on
# it without the console↔core import cycle the field/import edge used to form.
# Console-only: gated on the `console` feature, so the default gateway build
# never compiles it.
nano-trace-store = { path = "crates/nano-trace-store", optional = true }
# Low-level serve/listener primitives (ADR 0064 Phase 3): the `TCP_NODELAY`
# listener wrapper and the `PeerAddr` connect-info newtype. Extracted so the
# console crate can name the exact `ConnectInfo<PeerAddr>` type this binary
# registers; used unconditionally by the serve path (a console-free build still
# wires the connect-info newtype), so it is a plain (non-optional) dependency.
nano-server-net = { path = "crates/nano-server-net" }
nano-server-console = { path = "crates/nano-server-console", optional = true }
# Worker-scaling / provisioning advisor (issue #1294): the single source of truth
# for the per-job-type starved / under-provisioned / server-bound classification
# and Little's-Law worker sizing. Consumed by the console `/console/api/provisioning`
# endpoint via `src/provisioning.rs`, so it is console-only and optional. The same
# leaf crate is re-exported by ProcessOS's cockpit advisor — the shared logic lives
# on the Nano side because Nano never links ProcessOS.
nano-provisioning-advisor = { path = "crates/nano-provisioning-advisor", optional = true }
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart", "ws"] }
axum-extra = { version = "0.12", features = ["cookie", "query", "typed-header"] }
bytes = "1"
chrono = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["sink", "alloc"] }
headers = "0.4"
http = "1"
# Windows-safe canonicalize. `std::fs::canonicalize` returns a `\\?\` verbatim
# path on Windows that Node's ESM loader and some CLI tools reject; `dunce`
# strips it when possible and is a transparent passthrough to std on Unix.
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# YAML for the optional runtime config file (ADR 0035). Chosen over TOML to match
# the Kubernetes ecosystem operators deploy into. Only used to parse a small,
# flat observability config at startup — no hot-path involvement.
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util"] }
# WebSocket *client* for the intra-cluster peer uplink: a node speaks the same
# Falcon protocol it serves (axum's `ws` feature is server-only). Pinned
# to the same tungstenite the server already pulls in via axum. No TLS — the
# cluster mesh is a trusted private network; `ws://` only.
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls", "http2", "stream"] }
tokio-tungstenite = "0.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
openraft = { version = "0.9.24", features = ["serde", "storage-v2"] }
anyhow = "1.0.102"

base64 = "0.22.1"
tower-http = { version = "0.7.0", features = ["cors"] }
# Unix filesystem stats (statvfs) for the disk-relative adaptive read-model
# retention watermark. Unix-only; the feature falls back to a fixed default off
# Unix (e.g. MSVC).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# jemalloc mallctl access for `cmd_profile.rs` (per-thread allocation
# profiling). The global allocator itself — and the purge/resident-stats knobs
# — lives in `nano-server-storage`'s `memory` module (see that crate's
# manifest for the vendored-allocator rationale). Not available on MSVC; the
# system allocator is used there.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemalloc-ctl = { version = "0.6", features = ["use_std", "stats"] }

[dev-dependencies]
serde_json = "1"
# Drives the response-contract guard end-to-end in unit tests: `ServiceExt::oneshot`
# feeds a crafted request through a real axum Router + the guard layer so the
# middleware's routing (MatchedPath), status/schema lookup, and 500-on-violation
# rewrite are exercised exactly as in production.
tower = { version = "0.5", features = ["util"] }
# Test builds link the storage crate as a normal (non-test) library, so the
# `#[cfg(test)]` hooks this binary's inline tests used to call in-crate (e.g.
# `Journal::cold_spill_configured`) would vanish. `test-hooks` recompiles them
# in for test builds only; production builds never see the feature.
nano-server-storage = { path = "crates/nano-server-storage", features = ["test-hooks"] }

# The self-contained single-node distribution: bundle the web console (cluster
# console, BPMN modeler, process-instance explorer, embedded workers) into the
# gateway binary. Off by default — the production gateway build is unaffected and
# does not require a built frontend under ../console/dist.
[features]
console = ["dep:nanobpm-console-api", "dep:nano-trace-store", "dep:nano-provisioning-advisor", "tokio/process", "tokio/io-util", "nano-server-storage/console", "nano-server-runtime/console", "dep:nano-server-console"]
# ADR 0034: build the console with the lean "observe" operator profile instead of
# the full "studio" IDE. Additive over `console` — it only swaps the embedded
# bundle from `console/dist` to `console/dist-observe` (~158KB gzip vs ~4.7MB),
# so build that folder first with `npm run build:observe` in `console/`.
console-observe = ["console", "nano-server-console/console-observe"]
# Diagnostic-only: builds jemalloc with heap profiling (--enable-prof) and turns
# on sampled allocation-backtrace capture at startup. Adds per-allocation
# sampling overhead, so it is NEVER enabled in a production build — it exists to
# pin the structure behind a live-heap growth via `/debug/heap/prof` + jeprof.
# The allocator lives in the storage crate, so this forwards there.
heapprof = ["nano-server-storage/heapprof"]

# Optimized for a small production binary. `strip` removes ~8 MB of symbols;
# fat LTO + a single codegen unit let the linker drop dead code across crate
# boundaries. opt-level stays at 3 so request handling keeps its speed.
#
# `panic = "unwind"` (NOT abort): this is a *clustered* server — each node hosts
# many partitions, each an independent openraft group running on its own task.
# A panic in one partition's Raft task (e.g. openraft 0.9.24's degenerate
# apply-range edge case during a rejoin) must unwind *that task* only, never
# abort the process and take the other partitions — and the cluster's quorum —
# down with it. Genuine unrecoverable corruption still fails fast via the
# explicit `std::process::abort()` guards in `journal.rs`, which are unaffected
# by the panic strategy. (The unwinding tables cost a little binary size; node
# availability during a single-partition fault is worth it.)
[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "unwind"

# Profile for running the test suite with release-level optimizations. Inherits
# `release` (already `panic = "unwind"`, which `#[test]`'s `catch_unwind`
# requires); kept as a named profile so `cargo test --profile release-test`
# stays a stable entry point in the Makefile/CI.
[profile.release-test]
inherits = "release"
panic = "unwind"

# Fast-iteration profile for building deploy/soak binaries (NOT for shipping).
# Keeps opt-level 3 (runtime throughput must stay realistic — the debug build is
# ~3.5x slower), but trades the production-binary polish for build speed:
#   * `lto = "thin"` instead of fat LTO — recovers ~all cross-crate inlining wins
#     at a fraction of the whole-program link cost, and (unlike fat LTO) does NOT
#     serialize codegen or nullify incremental.
#   * `codegen-units = 16` re-enables intra-crate codegen parallelism (the server
#     is a single ~48k-line crate, so this matters a lot).
#   * `incremental = true` — small edits to one file (e.g. falcon.rs/main.rs, our
#     hot loop) recompile only the changed codegen units.
#   * `strip = false` skips the strip pass (symbols are fine for a soak binary).
# Build with: cargo build --profile deploy-fast --features console
[profile.deploy-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
strip = false


# Vendored openraft 0.9.24 with a one-line correctness fix. Upstream 0.9.24 (the
# latest 0.9.x) panics in `RaftCore::apply_to_state_machine` when a node rejoins a
# loaded cluster: it guards only the `since == end` apply window, so a transient
# degenerate `since > end` window indexes `entries[len - 1]` on an empty slice
# (usize underflow) and permanently wedges that partition's Raft (leaderless).
# The patch changes that guard to `since >= end`. See third_party/openraft-0.9.24
# (only src/core/raft_core.rs differs from the crates.io release).
[patch.crates-io]
openraft = { path = "../third_party/openraft-0.9.24" }

[lints.rust]
# Project policy: warnings are banned. `cargo build`/`check` fail on any rustc
# warning (unused code, deprecations, future-incompat lints, etc.).
warnings = "deny"
# The one documented exception: on macOS Apple `ld` emits a benign
# `linker_messages` warning because the gateway bin's `__eh_frame` unwind section
# (release keeps `panic = "unwind"`) is too large to encode into the Mach-O
# compact-unwind table, so `ld` falls back to the full DWARF `__eh_frame` (valid,
# just not compacted). The only real fix — dropping unwind tables — would break
# `panic = "unwind"` (the test harness needs it; `-Wl,-no_compact_unwind` breaks
# macOS unwinding outright). It's a platform-local artifact the deployed
# x86_64-linux binary never emits, so we allow just this lint.
linker_messages = "allow"

[build-dependencies]
# Shared version-stamp derivation (ADR 0064), also used by nano-server-console.
nano-version-stamp = { path = "crates/nano-version-stamp" }
