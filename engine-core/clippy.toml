allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Purity lint (#1663, ADR 0066 audit #2/#7/#11). engine-core is the replicated
# apply crate: every Raft replica applies the same command independently, so
# nothing it runs may read the host clock, host entropy or the process
# environment, nor use the platform libm (which can differ by one ulp across
# OS/arch). FEEL clock/RNG come from `feel::env` (replicated); transcendentals
# go through the pinned pure-Rust `libm` crate. The ONLY sanctioned exceptions
# carry a narrow `#[allow(clippy::disallowed_methods, reason = …)]`:
# `feel::env::host_env` (the explicit off-apply `with_host_env` seam) and
# non-production targets (`tests/`, `examples/`). `tests/purity_lint.rs` proves
# the lint fires on a seeded violation.
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "apply-path purity (#1663): use the replicated command clock" },
    { path = "std::time::Instant::now", reason = "apply-path purity (#1663): use the replicated command clock" },
    { path = "std::env::var", reason = "apply-path purity (#1663): no process environment on the apply path" },
    { path = "std::env::var_os", reason = "apply-path purity (#1663): no process environment on the apply path" },
    { path = "std::env::vars", reason = "apply-path purity (#1663): no process environment on the apply path" },
    { path = "std::env::vars_os", reason = "apply-path purity (#1663): no process environment on the apply path" },
    { path = "std::env::args", reason = "apply-path purity (#1663): no process environment on the apply path" },
    { path = "std::env::args_os", reason = "apply-path purity (#1663): no process environment on the apply path" },
    { path = "std::env::current_dir", reason = "apply-path purity (#1663): no process environment on the apply path" },
    { path = "std::env::temp_dir", reason = "apply-path purity (#1663): no process environment on the apply path" },
    { path = "std::collections::hash_map::RandomState::new", reason = "apply-path purity (#1663): no host entropy" },
    { path = "f64::ln", reason = "platform libm (#1663): use libm::log" },
