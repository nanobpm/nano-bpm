[package]
name = "nanobpmn-engine-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Minimal, embeddable BPMN execution core: a deterministic single-writer command/event/applier state machine (Camunda 8 / Zeebe-style), with zero dependencies so it builds for server, mobile (iOS/Android via FFI) and wasm targets."
license = "Apache-2.0"

# Intentionally dependency-free by default: std-only so the same crate compiles
# for aarch64-apple-ios, aarch64-linux-android and wasm32 without pulling a DB,
# async runtime or networking. Persistence is a caller concern (replay the log).
# The optional `serde` feature derives (de)serialization on the event log and
# model so a host can persist and replay it; it is off by default.
[dependencies]
# `rc` lets the optional control-state snapshot (cold spill) (de)serialize the
# `Arc`-shared `variables` payload on `ProcessInstance`; it has no effect when
# the `serde` feature is off.
serde = { version = "1", optional = true, features = ["derive", "rc"] }
# Only pulled in under the `serde` feature (the JSON boundary a host opts into for
# persistence/replay). It backs the canonical `form_id_of` helper so the server
# and the wasm entry point derive a form's identity from one source of truth
# rather than duplicating the parse rule. The default, feature-off build stays
# dependency-free (std-only).
serde_json = { version = "1", optional = true }

[dev-dependencies]
# Used by the golden serde-drift guard test (`tests/golden_serde_drift.rs`,
# issue #1069) to (de)serialize the checked-in golden fixtures. The guard only
# compiles/runs under `--features serde` (the `Event`/`EngineSnapshot` derives
# are feature-gated), but a dev-dependency is unconditional, so the test crate
# can name `serde_json` regardless. This does NOT affect the dependency-free
# default build of the library itself.
serde_json = "1"

[features]
serde = ["dep:serde", "dep:serde_json"]
# Exposes the coarse C-ABI surface in `ffi.rs` (paired with the `cdylib`
# crate-type below) so a non-Rust host can embed the engine via FFI/wasm.
ffi = []

[lib]
name = "nanobpmn_engine_core"
path = "src/lib.rs"
# `lib` for Rust consumers and the test/bench harness; `cdylib` so a C/Swift/
# Kotlin host or the `wasm32-unknown-unknown` target gets a loadable artifact
# exporting the `ffi` functions (built with `--features ffi`).
crate-type = ["lib", "cdylib"]

# The FEEL differential-fuzz checker (issue #1230). `test = true` so its inline
# `#[cfg(test)]` unit tests — including the empty/truncated-corpus guard — run
# under `cargo test`, not just when the example is executed against a live
# corpus.
[[example]]
name = "feel_diff"
test = true

[lints.rust]
# Project policy: warnings are banned. `cargo build`/`check` fail on any rustc
# warning (unused code, deprecations, future-incompat lints, linker_messages,
# etc.). See .cargo/config.toml for the macOS `__eh_frame` linker-warning fix.
warnings = "deny"

[lints.clippy]
# Epic #1357: production code must not panic via `.unwrap()`/`.expect()`.
# Runtime-fallible sites propagate a typed error; genuinely infallible ones
# carry a narrow `#[allow(..., reason = "…")]`. Test code is exempt via
# `clippy.toml` (`allow-unwrap-in-tests` / `allow-expect-in-tests`).
unwrap_used = "deny"
expect_used = "deny"
