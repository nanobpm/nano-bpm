[package]
name = "nanobpmn-engine-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "wasm-bindgen wrapper around nanobpmn-engine-core for in-browser (modeler) test execution."
repository = "https://github.com/nanobpm/nano-bpm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nanobpmn-engine-core = { path = "../engine-core", features = ["serde"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The shared SQLite read model (CQRS query side) so the in-browser test engine can
# serve the gateway's REST read channel (forms, user tasks, process instances,
# resources, variables) from the SAME projection the server uses — letting
# downstream consumers drop their shadow stores. OFF BY DEFAULT and fully optional:
# with the `read-model` feature disabled this dependency is not linked and the
# engine build keeps its lean baseline size (see the `read-model` feature below).
#
# The backend is selected PER TARGET so each build is hermetic:
#   * `wasm32` (the real in-browser target) uses the `wasm` backend — an in-memory
#     MemoryVFS SQLite supplied by `sqlite-wasm-rs` (no C toolchain, no bundled C).
#   * any host target (used by `cargo test --features read-model`) uses the
#     `native`/bundled backend — the same real C SQLite the server ships. Bundling
#     it keeps host tests self-contained: they do NOT link a system `libsqlite3`,
#     so they build in any CI/dev environment without SQLite dev libs installed.
# Both backends expose the identical `open_connection` seam and back `open(None)`
# with an ephemeral `:memory:` database, so the read channel behaves the same way
# on both — only how SQLite itself is provided differs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
nanobpmn-read-model = { path = "../read-model", default-features = false, features = ["wasm"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nanobpmn-read-model = { path = "../read-model", default-features = false, features = ["native"], optional = true }

[dev-dependencies]
# Test-only: parses the vendored Camunda REST spec (`spec/*.yaml`) so the
# read-model DTOs the facade hand-builds are checked against the spec's
# `required` lists (the source the published `readmodel-types` derive from).
serde_yaml = "0.9"

[features]
# Off-by-default. When enabled, `TestEngine` holds an in-memory `ReadStore` fed
# from the same event log and exposes the REST read methods (`getFormByKey`,
# `searchUserTasks`, `searchProcessInstances`, `getResourceByKey`,
# `searchVariables`). Every field, import and method it adds is gated behind
# `#[cfg(feature = "read-model")]`, so the feature-OFF build links no new
# dependency and keeps its lean baseline size.
read-model = ["dep:nanobpmn-read-model"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz', '--enable-bulk-memory', '--enable-nontrapping-float-to-int', '--enable-sign-ext', '--enable-mutable-globals', '--enable-multivalue', '--enable-reference-types']

[lints.rust]
# Project policy: warnings are banned. `cargo build`/`check` fail on any rustc
# warning (unused code, deprecations, future-incompat lints, linker_messages,
# etc.). See .cargo/config.toml for the macOS `__eh_frame` linker-warning fix.
warnings = "deny"
