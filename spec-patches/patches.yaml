# Local overlays applied to the build copy of the OpenAPI spec.
#
# The upstream spec under spec/ is kept byte-for-byte identical to the Camunda
# Orchestration Cluster release it tracks, so it can be updated by simply
# replacing those files. Any project-specific additions live here and are
# applied by scripts/preprocess-spec.py while it sanitizes spec/ into build/spec.
#
# Each entry targets a file (path relative to spec/) and a dotted path inside the
# parsed YAML, then either:
#   merge:  <mapping>   deep-merges a mapping additively (e.g. add a property)
#   append: <list>      appends items to a list node (e.g. a `required` array),
#                       de-duplicated.

# --- updateAgentInstance: upstream runtime conflict response ---------------
#
# Camunda 04530c058589e3ea3f7873bb469ae2c0d7cc6003's
# AgentInstanceUpdateProcessor rejects an active-writer conflict with
# INVALID_STATE, mapped to HTTP 409 by GatewayErrorMapper. Its REST response
# table omits that status. Keep the vendored specification unchanged, but let
# the generated server represent the actual upstream error without converting
# it into a misleading 400, 404, or 500.
- file: agent-instances.yaml
  target: paths./agent-instances/{agentInstanceKey}.patch.responses
  merge:
    "409":
      description: The agent instance has a conflicting active writer.
      content:
        application/problem+json:
          schema:
            $ref: 'problem-detail.yaml#/components/schemas/ProblemDetail'

# --- createProcessInstance: processCompleted -------------------------------
#
# nanobpmn extends CreateProcessInstanceResult with `processCompleted`. With the
# await-completion flag, the create request can block until the instance either
# completes (variables are then authoritative) or the request times out. Unlike
# Camunda 8 (which returns 504 on timeout), nanobpmn always returns 200 with the
# processInstanceKey; `processCompleted` tells the caller whether the returned
# variables are the final result or whether they should poll by key.
#
# Marking it `required` makes the generated Rust field a plain `bool` (not an
# Option), so the server must always populate it.
- file: process-instances.yaml
  target: components.schemas.CreateProcessInstanceResult.properties
  merge:
    processCompleted:
      type: boolean
      description: |
        Whether the process instance had completed by the time this response was
        produced. When true, the returned variables are the authoritative final
        result. When false, the instance is still running (e.g. the await timed
        out or completion was not awaited); poll for the outcome using
        processInstanceKey.
      example: true

- file: process-instances.yaml
  target: components.schemas.CreateProcessInstanceResult.required
  append:
    - processCompleted

# --- topology: advertise the nanobpmn engine -------------------------------
#
# nanobpmn is a superset of the Camunda Orchestration Cluster API. The topology
# response gains an OPTIONAL `nano` object so SDK clients can detect, from a
# single unauthenticated /v2/topology call, that they are talking to a nanobpmn
# gateway (not stock Camunda) and may upgrade to the bidirectional Falcon
# protocol (workers/producers over a single WebSocket) instead of REST long-poll.
#
# `nano` is deliberately NOT marked `required`: its ABSENCE means a stock Camunda
# gateway, its PRESENCE means nanobpmn. Generated as `Option<NanoEngineInfo>` in
# Rust, so a nano-aware SDK can deserialize either engine's topology unchanged.
- file: cluster.yaml
  target: components.schemas
  merge:
    NanoEngineInfo:
      description: |
        Present only on nanobpmn gateways. Signals that this engine implements a
        superset of the Camunda Orchestration Cluster API and advertises the
        streaming Falcon endpoint that clients may upgrade to.
      type: object
      required:
        - engine
        - falconPath
      properties:
        engine:
          description: Engine identifier. Always "nanobpmn".
          type: string
          example: nanobpmn
        version:
          description: The nanobpmn gateway version.
          type: string
          example: 0.1.0
        falconPath:
          description: |
            Path of the bidirectional Falcon WebSocket. Clients may
            upgrade to this endpoint to create instances and drain jobs over a
            single connection instead of REST long-poll.
          type: string
          example: /falcon

- file: cluster.yaml
  target: components.schemas.TopologyResponse.properties
  merge:
    nano:
      $ref: '#/components/schemas/NanoEngineInfo'

# --- job lease token rename (#1283): legacy-name deprecation window --------
#
# Camunda 8.10 renamed the job lease token at the API boundary to `jobLeaseToken`
# everywhere (leaseToken on job commands/activation; jobLease on agent-instance
# requests/history). The vendored spec/ now carries the new `jobLeaseToken` name,
# matching upstream. To avoid a hard cutover that would break workers still on the
# pre-rename names (notably c8ctl-plugin-nano on the running fleets), these
# overlays re-add the OLD names as OPTIONAL, deprecated aliases for a transition
# window. The server accepts either name on requests (both supplied and differing
# => 400) and emits both on responses so old clients keep receiving their token.
# Remove these overlays once every deployed worker has moved to jobLeaseToken.
- file: jobs.yaml
  target: components.schemas.ActivatedJobResult.properties
  merge:
    leaseToken:
      type: string
      nullable: true
      deprecated: true
      description: >
        Deprecated legacy alias for `jobLeaseToken` (the pre-8.10 name). Emitted
        alongside `jobLeaseToken` during the rename transition window so workers
        that still read `leaseToken` keep functioning. Read `jobLeaseToken`
        instead.
- file: jobs.yaml
  target: components.schemas.JobCompletionRequest.properties
  merge:
    leaseToken:
      type: string
      nullable: true
      deprecated: true
      description: >
        Deprecated legacy alias for `jobLeaseToken` (the pre-8.10 name). Accepted
        during the rename transition window. Supply `jobLeaseToken` instead. If
        both are supplied and differ, the request is rejected with 400.
- file: jobs.yaml
  target: components.schemas.JobFailRequest.properties
  merge:
    leaseToken:
      type: string
      nullable: true
      deprecated: true
      description: >
        Deprecated legacy alias for `jobLeaseToken` (the pre-8.10 name). Accepted
        during the rename transition window. Supply `jobLeaseToken` instead. If
        both are supplied and differ, the request is rejected with 400.
- file: jobs.yaml
  target: components.schemas.JobErrorRequest.properties
  merge:
    leaseToken:
      type: string
      nullable: true
      deprecated: true
      description: >
        Deprecated legacy alias for `jobLeaseToken` (the pre-8.10 name). Accepted
        during the rename transition window. Supply `jobLeaseToken` instead. If
        both are supplied and differ, the request is rejected with 400.
- file: jobs.yaml
  target: components.schemas.JobUpdateRequest.properties
  merge:
    leaseToken:
      type: string
      nullable: true
      deprecated: true
      description: >
        Deprecated legacy alias for `jobLeaseToken` (the pre-8.10 name). Accepted
        during the rename transition window. Supply `jobLeaseToken` instead. If
        both are supplied and differ, the request is rejected with 400.
- file: agent-instances.yaml
  target: components.schemas.AgentInstanceCreationRequest.properties
  merge:
    jobLease:
      type: string
      deprecated: true
      description: >
        Deprecated legacy alias for `jobLeaseToken` (the pre-8.10 name). Accepted
        during the rename transition window. Supply `jobLeaseToken` instead.
        At least one of `jobLeaseToken` or `jobLease` must be present; both may
        be supplied when their values match, and if both are supplied and differ
        the request is rejected with 400.
- file: agent-instances.yaml
  target: components.schemas.AgentInstanceUpdateRequest.properties
  merge:
    jobLease:
      type: string
      deprecated: true
      description: >
        Deprecated legacy alias for `jobLeaseToken` (the pre-8.10 name). Accepted
        during the rename transition window. Supply `jobLeaseToken` instead.
        At least one of `jobLeaseToken` or `jobLease` must be present; both may
        be supplied when their values match, and if both are supplied and differ
        the request is rejected with 400.
# Upstream (50d5d404) makes `jobLeaseToken` REQUIRED on the agent-instance
# requests. During the alias window a legacy client sends only `jobLease`, which
# a required field would reject at deserialization, before the handler's
# "at least one of jobLeaseToken/jobLease" check. Relax it for as long as the
# alias lives; remove these two entries together with the aliases above.
- file: agent-instances.yaml
  target: components.schemas.AgentInstanceCreationRequest.required
  remove:
    - jobLeaseToken
- file: agent-instances.yaml
  target: components.schemas.AgentInstanceUpdateRequest.required
  remove:
    - jobLeaseToken
- file: agent-instances.yaml
  target: components.schemas.AgentInstanceHistoryItemResult.properties
  merge:
    jobLease:
      type: string
      deprecated: true
      description: >
        Deprecated legacy alias for `jobLeaseToken` (the pre-8.10 name). Emitted
        alongside `jobLeaseToken` during the rename transition window. Read
        `jobLeaseToken` instead.

# --- pagination disambiguation (684c4583): codegen correctness ---------------
#
# SearchQueryPageRequest is an untagged oneOf of four all-optional pagination
# shapes. Without additionalProperties: false (which postprocess-generated.py
# turns into #[serde(deny_unknown_fields)]), serde matches the first variant
# (limit) for any object containing `limit`, silently dropping after/before/from.
# Originally a hand edit to spec/search-models.yaml; kept here since #1291 so
# spec/ stays byte-identical to the pinned upstream commit.
- file: search-models.yaml
  target: components.schemas.LimitPagination
  merge:
    additionalProperties: false
- file: search-models.yaml
  target: components.schemas.OffsetPagination
  merge:
    additionalProperties: false
- file: search-models.yaml
  target: components.schemas.CursorForwardPagination
  merge:
    additionalProperties: false
- file: search-models.yaml
  target: components.schemas.CursorBackwardPagination
  merge:
    additionalProperties: false

# --- fetch-declared read-set on job search (#986) -----------------------------
- file: jobs.yaml
  target: components.schemas.JobSearchResult.properties
  merge:
    fetchedVariables:
      description: >
        nano extension (not part of the Camunda 8 API). The declared read-set —
        the `fetchVariables` names the worker asked for on the most recent
        durable activation of this job that declared a non-empty set — recorded
        on the `JobActivated` event as engine-native read provenance for post-hoc
        reification / data-dependency analysis. It is not cleared by a subsequent
        fetch-all re-activation. `null`/absent when no durable activation has
        declared a set (fetch-all / undeclared reads) or the activation was not
        durably recorded (e.g. leader-local activation, which does not export
        `JobActivated`).
      nullable: true
      type: array
      items:
        type: string
