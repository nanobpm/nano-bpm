openapi: 3.0.3
info:
  title: Nano Console API
  description: >-
    Internal HTTP API backing the Nano web console (served by the gateway under
    /console/api, separate from the generated Camunda REST surface). This spec is
    the single source of truth for both the Rust (rust-axum) server trait and the
    TypeScript client used by the console SPA. Streaming (SSE) endpoints, the
    gateway reverse-proxy, binary file/zip downloads and static SPA assets are
    intentionally omitted here and remain hand-wired in the server.
  version: 0.1.0
servers:
  - url: /console/api
    description: Console API mounted on the gateway
tags:
  - name: cluster
    description: Topology, health and metrics
  - name: instances
    description: Process-instance explorer
  - name: traces
    description: Execution traces
  - name: models
    description: Workspace-backed BPMN models (modeler)
  - name: workers
    description: Embedded Deno job workers
  - name: lib
    description: Shared worker library files
  - name: projects
    description: RAD project lifecycle
  - name: extensions
    description: Extension packs and marketplace
  - name: config
    description: Server and IDE configuration
  - name: server
    description: Nano server version and self-update
  - name: data
    description: Urban App datasources (DB Manager) — ADR 0024
  - name: triggers
    description: Urban App trigger runtime — the durable inbox + dispatcher (ADR 0025)
  - name: connectors
    description: Urban App connectors — the outbound I/O edge (element-template components + supervised workers, ADR 0050)

paths:
  /topology:
    get:
      operationId: getTopology
      tags: [cluster]
      summary: Cluster topology
      responses:
        '200':
          description: Cluster topology
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topology' }

  /cluster/health:
    get:
      operationId: getClusterHealth
      tags: [cluster]
      summary: Per-node liveness probe
      responses:
        '200':
          description: Cluster health
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClusterHealth' }

  /metrics:
    get:
      operationId: getMetrics
      tags: [cluster]
      summary: Point-in-time metrics snapshot for this node
      responses:
        '200':
          description: Metrics snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsSnapshot' }

  /cluster/metrics:
    get:
      operationId: getClusterMetrics
      tags: [cluster]
      summary: Per-node metrics plus cluster aggregate
      responses:
        '200':
          description: Cluster metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClusterMetrics' }

  /instances:
    get:
      operationId: listInstances
      tags: [instances]
      summary: List process instances (paged)
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, format: int32, default: 0 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, format: int32, default: 50 } }
        - name: state
          in: query
          required: false
          description: >-
            Restrict the list to instances in this lifecycle state. Omit for no
            state constraint (all states).
          schema: { type: string, enum: [Active, Suspended, Completed, Terminated] }
        - name: hasIncident
          in: query
          required: false
          description: >-
            Restrict the list by incident status. When `true`, only instances
            currently carrying an open incident; when `false`, only instances
            without one. Both values are real constraints. Omit the parameter
            entirely for no incident constraint (instances with and without
            incidents).
          schema: { type: boolean }
      responses:
        '200':
          description: One page of process instances
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstancePage' }

  /instances/{key}:
    get:
      operationId: getInstance
      tags: [instances]
      summary: Process-instance detail
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Instance detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /instances/{key}/incidents/{incidentKey}/resolution:
    post:
      operationId: resolveIncident
      tags: [instances]
      summary: Resolve an incident so the engine retries the failed element
      description: >
        Operator action from the Process Explorer. Clears the incident; for a
        job-incident the job returns to the activatable pool and is retried.
        Fix the offending data first (see setInstanceVariables) when the
        incident was caused by bad variables.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: incidentKey, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: The incident was resolved }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /instances/{key}/cancellation:
    post:
      operationId: cancelInstance
      tags: [instances]
      summary: Cancel a running process instance
      description: >
        Operator action from the Process Explorer. Discards every token
        (cancels pending jobs, disarms timers and message subscriptions, closes
        any active incident) and transitions the instance to TERMINATED. Reuses
        the same engine command and leader-forward core as the v2 REST endpoint
        POST /v2/process-instances/{key}/cancellation. An unknown or
        already-finished instance is a 404.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: The instance was cancelled }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /instances/{key}/suspension:
    post:
      operationId: suspendInstance
      tags: [instances]
      summary: Suspend a running process instance
      description: >
        Operator action from the Process Explorer. Pauses the instance: it stops
        making progress (no jobs are activated, no timers fire) while retaining
        all runtime state, and its state becomes Suspended. Reuses the same
        engine command and leader-forward core as the v2 REST endpoint POST
        /v2/process-instances/{key}/suspension. Only a running (Active) instance
        can be suspended; a terminal instance is a 400 and an unknown instance is
        a 404. Resume with the resumption endpoint.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: The instance was suspended }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /instances/{key}/resumption:
    post:
      operationId: resumeInstance
      tags: [instances]
      summary: Resume a suspended process instance
      description: >
        Operator action from the Process Explorer. Reverses a suspension: the
        instance resumes from exactly where it was paused (state back to Active),
        re-activating its jobs and re-arming its timers/subscriptions. Reuses the
        same engine command and leader-forward core as the v2 REST endpoint POST
        /v2/process-instances/{key}/resumption. Only a Suspended instance can be
        resumed; a terminal instance is a 400 and an unknown instance is a 404.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: The instance was resumed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /instances/{key}/variables:
    put:
      operationId: setInstanceVariables
      tags: [instances]
      summary: Merge variables into an instance scope
      description: >
        Operator action from the Process Explorer. Merges the given variables
        into the target scope (typically to correct the data behind an incident
        before resolving it).
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetInstanceVariablesRequest' }
      responses:
        '204': { description: The variables were merged }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /traces:
    get:
      operationId: listTraces
      tags: [traces]
      summary: Recent execution traces
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, format: int32, default: 100 } }
      responses:
        '200':
          description: Trace summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TraceSummary' }

  /traces/config:
    get:
      operationId: getTraceConfig
      tags: [traces]
      summary: Trace-capture configuration and in-memory ring state
      responses:
        '200':
          description: Trace configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TraceConfig' }
    put:
      operationId: setTraceConfig
      tags: [traces]
      summary: Toggle variable / stimulus capture at runtime (node-local, non-persistent)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TraceConfigUpdate' }
      responses:
        '200':
          description: Updated trace configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TraceConfig' }

  /traces/{key}:
    get:
      operationId: getTrace
      tags: [traces]
      summary: Full execution trace for one instance
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Instance trace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceTrace' }
        '404': { $ref: '#/components/responses/NotFound' }

  /traces/{key}/otel:
    get:
      operationId: getTraceOtel
      tags: [traces]
      summary: OpenTelemetry trace export for one instance
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Opaque OTLP/OpenTelemetry trace document
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /models:
    get:
      operationId: listModels
      tags: [models]
      summary: List BPMN models in the workspace
      responses:
        '200':
          description: Model summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ModelSummary' }
    post:
      operationId: createModel
      tags: [models]
      summary: Create a new BPMN model
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateModelRequest' }
      responses:
        '201':
          description: Model created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Model' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /models/{name}:
    get:
      operationId: getModel
      tags: [models]
      summary: Get one BPMN model
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Model' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveModel
      tags: [models]
      summary: Save (overwrite) a BPMN model's XML
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      requestBody:
        required: true
        content:
          text/xml:
            schema: { type: string }
      responses:
        '200':
          description: Saved model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Model' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      operationId: deleteModel
      tags: [models]
      summary: Delete a BPMN model
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /workers:
    get:
      operationId: listWorkers
      tags: [workers]
      summary: List embedded workers
      responses:
        '200':
          description: Workers plus runtime availability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkersResponse' }
    post:
      operationId: createWorker
      tags: [workers]
      summary: Scaffold a new worker
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkerRequest' }
      responses:
        '201':
          description: Worker created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /workers/{name}:
    get:
      operationId: getWorker
      tags: [workers]
      summary: Get one worker
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Worker summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteWorker
      tags: [workers]
      summary: Delete a worker
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /workers/{name}/file:
    get:
      operationId: getWorkerFile
      tags: [workers]
      summary: Read a worker source file
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/PathQuery' }
      responses:
        '200':
          description: File contents
          content:
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveWorkerFile
      tags: [workers]
      summary: Write a worker source file
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/PathQuery' }
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createWorkerFile
      tags: [workers]
      summary: Create an empty worker file
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFileRequest' }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteWorkerFile
      tags: [workers]
      summary: Delete a worker file
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/PathQuery' }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }

  /workers/{name}/start:
    post:
      operationId: startWorker
      tags: [workers]
      summary: Start a worker process
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Worker runtime state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerRuntime' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workers/{name}/stop:
    post:
      operationId: stopWorker
      tags: [workers]
      summary: Stop a worker process
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Worker runtime state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerRuntime' }
        '404': { $ref: '#/components/responses/NotFound' }

  /worker-sdk:
    get:
      operationId: getWorkerSdk
      tags: [workers]
      summary: Embedded worker SDK source (text)
      responses:
        '200':
          description: Worker SDK source
          content:
            text/plain:
              schema: { type: string }

  /deno-types:
    get:
      operationId: getDenoTypes
      tags: [workers]
      summary: Ambient Deno type declarations (text)
      responses:
        '200':
          description: Deno type declarations
          content:
            text/plain:
              schema: { type: string }

  /lib:
    get:
      operationId: listLibFiles
      tags: [lib]
      summary: List shared library files
      responses:
        '200':
          description: Library file paths
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibFilesResponse' }

  /lib/file:
    get:
      operationId: getLibFile
      tags: [lib]
      summary: Read a shared library file
      parameters: [ { $ref: '#/components/parameters/PathQuery' } ]
      responses:
        '200':
          description: File contents
          content:
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveLibFile
      tags: [lib]
      summary: Write a shared library file
      parameters: [ { $ref: '#/components/parameters/PathQuery' } ]
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createLibFile
      tags: [lib]
      summary: Create an empty shared library file
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFileRequest' }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteLibFile
      tags: [lib]
      summary: Delete a shared library file
      parameters: [ { $ref: '#/components/parameters/PathQuery' } ]
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }

  /config/server:
    get:
      operationId: getServerConfig
      tags: [config]
      summary: Server configuration (SLA mode + parameters)
      responses:
        '200':
          description: Server config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerConfig' }

  /config/server/sla:
    put:
      operationId: setSlaMode
      tags: [config]
      summary: Switch the runtime SLA mode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetSlaRequest' }
      responses:
        '200':
          description: Updated server config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /config/ide:
    get:
      operationId: getIdeConfig
      tags: [config]
      summary: IDE configuration (dependencies + language packs)
      responses:
        '200':
          description: IDE config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdeConfig' }

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List RAD projects
      responses:
        '200':
          description: Projects plus runtime availability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectsResponse' }
    post:
      operationId: createProject
      tags: [projects]
      summary: Scaffold a new project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/import:
    post:
      operationId: importProject
      tags: [projects]
      summary: Import an Urban app by reference (external project pointer)
      description: >-
        Register an external checked-out directory as a project pointer, read
        live, without copying it (ADR 0041). The path must resolve to a Nano
        app/project directory (containing nano.app.json or nanobpm.project.json)
        and the name must not shadow an existing workspace project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportProjectRequest' }
      responses:
        '200':
          description: Project reference registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectReference' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{name}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Project detail
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/config:
    get:
      operationId: getProjectConfig
      tags: [projects]
      summary: Project configuration
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Project config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectConfig' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveProjectConfig
      tags: [projects]
      summary: Save project configuration
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectConfig' }
      responses:
        '200':
          description: Saved project config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /projects/{name}/files:
    get:
      operationId: listProjectFiles
      tags: [projects]
      summary: Project file tree
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: File tree
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectFilesResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/file:
    put:
      operationId: saveProjectFile
      tags: [projects]
      summary: Write a project file
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/PathQuery' }
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createProjectPath
      tags: [projects]
      summary: Create an empty file or directory in a project
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectPathRequest' }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteProjectPath
      tags: [projects]
      summary: Delete a project file or directory
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/PathQuery' }
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }

  /projects/{name}/run:
    post:
      operationId: runProject
      tags: [projects]
      summary: Run a project's application
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Run state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunState' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/stop:
    post:
      operationId: stopProject
      tags: [projects]
      summary: Stop a running project
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Run state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunState' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/rename:
    post:
      operationId: renameProject
      tags: [projects]
      summary: Rename a project
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameProjectRequest' }
      responses:
        '200':
          description: Updated project config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectConfig' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /projects/{name}/compile:
    post:
      operationId: compileProject
      tags: [projects]
      summary: Compile a project (optionally cross-platform)
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompileRequest' }
      responses:
        '200':
          description: Whether a compile was started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompileStarted' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/update-from-template:
    post:
      operationId: updateProjectFromTemplate
      tags: [projects]
      summary: Update a project from a newer version of its scaffolding pack
      description: >-
        Overlays a newer version of the project's `scaffoldedFrom` pack onto the
        project, preserving the sqlite datasource (app.db + WAL/SHM), generated
        SDK (`nano-generated/`) and local VCS/deps (`.git/`, `node_modules/`).
        Uses the recorded `scaffoldedFrom.version` as a 3-way merge base so a
        user's edits to upstream-unchanged files survive and only genuine
        conflicts are surfaced. Dry-run by default (`apply: false`) — returns the
        plan without writing. With `apply: true` it writes the non-conflicting
        subset and bumps `scaffoldedFrom.version` on a clean update.


        Conflicts can be resolved *take-upstream* (discard the local changes and
        write the incoming pack file) via `takeTheirs` (a list of specific
        project-relative paths) and/or `resolveConflicts: theirs` (take upstream
        for every conflict). A take-upstream file is written from the pack and
        reported under `overwrite`, not `conflicts` — so once all conflicts are
        resolved the apply is treated as clean and `scaffoldedFrom.version`
        bumps.
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFromTemplateRequest' }
      responses:
        '200':
          description: The overlay plan (and, when applied, what was written)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdatePlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/run-configs:
    get:
      operationId: getRunConfigs
      tags: [projects]
      summary: List a project's run configurations
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Run configurations plus the active id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectRunConfigsResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/active-run-config:
    put:
      operationId: setActiveRunConfig
      tags: [projects]
      summary: Pin (or clear) the active run configuration
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActiveRunConfigRequest' }
      responses:
        '200':
          description: The active run-config id (or null)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveRunConfigResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/data/sources:
    get:
      operationId: getDataSources
      tags: [data]
      summary: List an App project's declared datasources
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Datasources plus the default source name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSourcesResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/data/{source}/schema:
    get:
      operationId: getDataSchema
      tags: [data]
      summary: Introspect a datasource's tables/columns/indexes
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/SourcePath' }
      responses:
        '200':
          description: Datasource schema
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataSchemaResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/data/{source}/query:
    post:
      operationId: queryData
      tags: [data]
      summary: Run a row-returning statement against a datasource
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/SourcePath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataQueryRequest' }
      responses:
        '200':
          description: Query result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataQueryResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/data/{source}/exec:
    post:
      operationId: execData
      tags: [data]
      summary: Run a non-row statement (INSERT/UPDATE/DELETE/DDL)
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/SourcePath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataQueryRequest' }
      responses:
        '200':
          description: Exec result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExecResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/data/{source}/script:
    post:
      operationId: execDataScript
      tags: [data]
      summary: Run several statements atomically in one transaction
      description: >
        Runs the supplied statements in a single transaction (the console
        structure editor's SQLite 12-step table rebuild: create → copy → drop →
        rename). A failure in any statement rolls the whole batch back, so the
        table is never left half-migrated. DDL only — no bind parameters.
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/SourcePath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataScriptRequest' }
      responses:
        '200':
          description: Script result (rows changed across the batch)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExecResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/data/{source}/migrations:
    get:
      operationId: getDataMigrations
      tags: [data]
      summary: List a datasource's migrations with applied status
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/SourcePath' }
      responses:
        '200':
          description: Migration status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataMigrationsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/data/{source}/migrate:
    post:
      operationId: migrateData
      tags: [data]
      summary: Apply a datasource's pending migrations
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/SourcePath' }
      responses:
        '200':
          description: Migrations applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataMigrateResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/data/{source}/domaintypes:
    post:
      operationId: regenerateDomainTypes
      tags: [data]
      summary: Regenerate the generated TypeScript domain types from the live schema
      description: >
        Reifies the datasource schema into `.nanobpm/domain.d.ts` (ADR 0029
        §4.1/§6): one `interface` per table plus a `DomainTables` lookup, so
        workers type against the current tables. Also runs automatically after a
        schema change (script/DDL exec/migrate) and at App boot; this endpoint is
        the maker's explicit "regenerate now" affordance. Types are erased at
        `deno compile` — this is an authoring-time convenience only.
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/SourcePath' }
      responses:
        '200':
          description: The emitted domain types (and where they were written)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainTypesResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/data/{source}/domaintypes/preview:
    post:
      operationId: previewDomainTypes
      tags: [data]
      summary: Resolve the in-editor composed shapes for a live preview (no domain-type output written)
      description: >
        The authoring-time counterpart to `regenerateDomainTypes` (ADR 0040
        §9/§10): resolve the composed motion-shapes the modeller is *currently
        editing* — sent in the request body, not scanned from the saved `.bpmn`
        — against the live datasource + manifest-type fuse, and return the
        emitted domain text plus the per-shape diagnostics. Runs with
        `write:false`, so it does not materialise the `domaintypes` outputs
        (`domain-rows.d.ts` and the worker/message bindings): it powers the shape
        composer's live field preview and inline diagnostics without regenerating
        the typed SDK the maker consumes. (Like every project op it does ensure the
        generated SDK *scaffolding* exists, so the first call may seed the
        `nano-generated/` helpers.)
      parameters:
        - { $ref: '#/components/parameters/NamePath' }
        - { $ref: '#/components/parameters/SourcePath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DomainTypesPreviewRequest' }
      responses:
        '200':
          description: The resolved domain text and per-shape diagnostics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainTypesResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /server/update:
    get:
      operationId: getServerUpdate
      tags: [server]
      summary: Nano server version and self-update availability
      description: >
        Reports the running server version, the latest available version for
        the channel this binary was launched from, and whether the launcher can
        self-update. Self-managed / dev binaries (a configured binary path, a
        --binary flag, or a repo build) report canSelfUpdate=false and suppress
        the update nag (updateAvailable=false) even when a newer version exists.
        Best-effort and offline-soft: version resolution failures degrade to a
        null latest rather than an error.
      responses:
        '200':
          description: Server update status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerUpdateStatus' }

  /extensions:
    get:
      operationId: getExtensions
      tags: [extensions]
      summary: Installed extensions overview
      responses:
        '200':
          description: Extensions overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionsOverview' }

  /extensions/marketplace:
    get:
      operationId: getMarketplace
      tags: [extensions]
      summary: Marketplace of installable extension packs
      responses:
        '200':
          description: Marketplace listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Marketplace' }

  /extensions/readme:
    get:
      operationId: getExtensionReadme
      tags: [extensions]
      summary: README (markdown) for an extension pack
      description: >
        Returns the pack's README as raw markdown. For an installed pack this is
        read from the bundled `README.md`; otherwise it is fetched from npm
        (`npm view <pkg> readme`). Used by the marketplace to show pack detail.
      parameters:
        - name: pkg
          in: query
          required: true
          description: The npm package name (e.g. `@nanobpm/nano-ide-trigger-mqtt`).
          schema: { type: string }
      responses:
        '200':
          description: Pack README
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionReadme' }
        '404': { $ref: '#/components/responses/NotFound' }

  /extensions/changelog:
    get:
      operationId: getExtensionChangelog
      tags: [extensions]
      summary: Changelog (markdown) for an extension pack
      description: >
        Returns the pack's changelog as raw markdown so the marketplace/update
        panel can show *what changed*. For an installed pack this is read from
        the bundled `CHANGELOG.md`; otherwise the published registry tarball is
        downloaded (`npm pack <pkg>@<to>`) and its changelog read — npm does not
        expose `changelog` via `npm view` the way it does `readme`. When `from`
        (the installed version) is supplied and the changelog's version headings
        parse, the result is scoped to the delta between `from` and the latest
        version, falling back to the full changelog otherwise.
      parameters:
        - name: pkg
          in: query
          required: true
          description: The npm package name (e.g. `@nanobpm/nano-workforce`).
          schema: { type: string }
        - name: from
          in: query
          required: false
          description: >-
            The installed version. When present (and the headings parse) the
            changelog is scoped to the entries newer than this version.
          schema: { type: string }
        - name: to
          in: query
          required: false
          description: >-
            The latest version to fetch when the pack is not installed locally
            (pins the registry tarball). Defaults to the `latest` tag.
          schema: { type: string }
      responses:
        '200':
          description: Pack changelog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionChangelog' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /extensions/install:
    post:
      operationId: installExtension
      tags: [extensions]
      summary: Install an extension pack from npm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtPkgRequest' }
      responses:
        '201':
          description: Installed extension
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Extension' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /extensions/remove:
    post:
      operationId: removeExtension
      tags: [extensions]
      summary: Remove an installed extension pack
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtPkgRequest' }
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/BadRequest' }

  /urban/install:
    post:
      operationId: installUrbanToolkit
      tags: [extensions]
      summary: Ensure the Urban toolkit (urban CLI + create-urban-app) is present
      description: >
        Install-before-create hook (issue #520). Idempotently ensures the
        first-party `nano-ide-app-urban` marketplace pack and its runtime
        dependencies (`@nanobpm/urban`, which provides the `urban` CLI, and
        `create-urban-app`, the scaffolder the console delegates to) are
        installed, so the Studio can scaffold an Urban app. Cheap no-op when the
        `urban` CLI already resolves. Returns whether it resolves after the call.
      responses:
        '200':
          description: Urban toolkit availability after ensuring installation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrbanToolkitStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /extensions/trust:
    post:
      operationId: trustExtension
      tags: [extensions]
      summary: Approve or revoke trust for extension toolchains
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrustRequest' }
      responses:
        '200':
          description: Updated extensions overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtensionsOverview' }

  /projects/{name}/triggers:
    get:
      operationId: getTriggers
      tags: [triggers]
      summary: Configured triggers + resolved source registry (ADR 0025 phase 2)
      description: >
        Lists the App manifest's declared triggers, each resolved against the
        source registry — the union of the compiled-in core kinds
        (cron/webhook/file/manual) and every installed pack's declared source
        kinds (`nano-ide-trigger-*`, ADR 0025 §6). `builtin` says whether the
        kind runs in-process (core) or is driven by a pack/ingress. Also returns
        the full registry so the console can offer a source picker, and any
        config errors (e.g. a malformed cron spec). This is the data the phase-3
        Triggers panel renders.
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Triggers + source registry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggersResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addTrigger
      tags: [triggers]
      summary: Append a trigger to the App manifest (the console "Add trigger" form)
      description: >
        Adds a trigger to `nano.app.json`'s `triggers[]` from the console's
        Add-trigger dialog, so a maker wires a source without hand-editing the
        manifest. The server places the supplied `config` fields into the shape
        each source kind expects (core kinds read some keys at the trigger's top
        level, e.g. cron's `spec` and file's `path`; pack kinds read a nested
        `config`), validates the id is unique and the kind is recognised, writes
        the manifest, and returns the refreshed triggers + registry.
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddTriggerRequest' }
      responses:
        '200':
          description: Trigger added; refreshed triggers + source registry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggersResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/triggers/enqueue:
    post:
      operationId: enqueueTriggerEvent
      tags: [triggers]
      summary: Enqueue a synthetic trigger event into the durable inbox
      description: >
        The manual/synthetic source of ADR 0025 phase 1 (and the Triggers
        panel's "run now"): persists an event for a declared trigger into the
        App's durable inbox with a deterministic idempotency key, so the
        dispatcher applies its `action` to the engine exactly once per key. A
        repeat of the same idempotency key is a no-op (`enqueued=false`),
        proving the §3 dedup boundary.
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerEnqueueRequest' }
      responses:
        '200':
          description: Enqueue outcome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggerEnqueueResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/triggers/inbox:
    get:
      operationId: getTriggerInbox
      tags: [triggers]
      summary: Trigger inbox status (row counts by state + most recent rows)
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Inbox status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggerInboxResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{name}/connectors:
    get:
      operationId: getConnectors
      tags: [connectors]
      summary: Enabled connectors + available connector registry (ADR 0050)
      description: >
        Lists the App manifest's enabled connector workers (`workers[]` entries
        supplied by an installed pack, ADR 0050 — the outbound edge), each
        resolved against the connector registry: the union of every installed
        pack's declared `workers[]`. `backed` says whether the pack still ships
        a launchable worker for the type; `recognized` whether the type is in
        the registry at all. Also returns the full registry so the console can
        offer an "Add connector" picker, and any coherence errors (e.g. an
        enabled connector whose pack was uninstalled). This is the data the
        Connectors panel renders — the outbound mirror of `getTriggers`.
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      responses:
        '200':
          description: Connectors + registry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addConnector
      tags: [connectors]
      summary: Enable a connector into the App manifest (the console "Add connector" form)
      description: >
        Enables a pack-supplied connector by appending a worker to
        `nano.app.json`'s `workers[]` (with `connector` naming the pack and
        `taskType` the job type — the design→runtime seam with the pack's
        element-template component, ADR 0050 §2). Optionally writes a named
        `connections[]` entry (env-pointer credentials, never inline secrets,
        ADR 0027 §5) referenced by the worker. Validates the type is a
        recognised connector and not already enabled, writes the manifest, and
        returns the refreshed connectors + registry. The outbound mirror of
        `addTrigger`.
      parameters: [ { $ref: '#/components/parameters/NamePath' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddConnectorRequest' }
      responses:
        '200':
          description: Connector enabled; refreshed connectors + registry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    NamePath:
      name: name
      in: path
      required: true
      schema: { type: string }
    PathQuery:
      name: path
      in: query
      required: true
      description: Project/worker-relative, forward-slash separated file path.
      schema: { type: string }
    SourcePath:
      name: source
      in: path
      required: true
      description: The datasource name from the App manifest's `data.sources`.
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid request
      content:
        text/plain:
          schema: { type: string }
    NotFound:
      description: Not found
      content:
        text/plain:
          schema: { type: string }
    Conflict:
      description: Already exists
      content:
        text/plain:
          schema: { type: string }
    InternalError:
      description: Internal error
      content:
        text/plain:
          schema: { type: string }
    ServiceUnavailable:
      description: >
        The service is currently unavailable — a transient, retryable Raft
        condition (a leader handoff pause or an in-progress election). The
        operator action can be retried once the cluster settles.
      content:
        text/plain:
          schema: { type: string }

  schemas:
    # ---- Cluster / topology (snake_case wire fields) ----------------------
    NodeInfo:
      type: object
      required: [node_id, address, is_self]
      properties:
        node_id: { type: integer, format: int64 }
        address: { type: string }
        is_self: { type: boolean }
    PartitionInfo:
      type: object
      required: [partition_id, replicas, owner, leader, raft_term, recovering]
      properties:
        partition_id: { type: integer, format: int64 }
        replicas:
          type: array
          items: { type: integer, format: int64 }
        owner: { type: integer, format: int64 }
        leader: { type: integer, format: int64, nullable: true }
        raft_term: { type: integer, format: int64, nullable: true }
        recovering: { type: boolean }
    Topology:
      type: object
      required: [node_id, num_nodes, num_partitions, replication_factor, raft_enabled, gateway_version, nodes, partitions]
      properties:
        node_id: { type: integer, format: int64 }
        num_nodes: { type: integer, format: int64 }
        num_partitions: { type: integer, format: int64 }
        replication_factor: { type: integer, format: int64 }
        raft_enabled: { type: boolean }
        gateway_version: { type: string }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/NodeInfo' }
        partitions:
          type: array
          items: { $ref: '#/components/schemas/PartitionInfo' }

    # ---- Cluster health (camelCase wire fields) --------------------------
    NodeHealth:
      type: object
      required: [nodeId, address, isSelf, reachable, version, latencyMs, error]
      properties:
        nodeId: { type: integer, format: int64 }
        address: { type: string }
        isSelf: { type: boolean }
        reachable: { type: boolean }
        version: { type: string, nullable: true }
        latencyMs: { type: number, format: double, nullable: true }
        error: { type: string, nullable: true }
    ClusterHealth:
      type: object
      required: [checkedAtMs, nodes]
      properties:
        checkedAtMs: { type: integer, format: int64 }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/NodeHealth' }

    # ---- Instances (snake_case wire fields, plus camelCase suspendedDate) ----
    Instance:
      type: object
      required: [key, process_id, process_definition_key, version, state, start_date_ms, has_incident, business_id, tags, parent_process_instance_key, parent_element_instance_key, suspendedDate]
      properties:
        key: { type: string }
        process_id: { type: string }
        process_definition_key: { type: string }
        version: { type: integer, format: int64 }
        state: { type: string }
        start_date_ms: { type: integer, format: int64 }
        has_incident: { type: boolean }
        business_id: { type: string, nullable: true }
        suspendedDate:
          type: string
          format: date-time
          nullable: true
          description: >
            ISO-8601 datetime of the most recent suspension while the instance is
            Suspended, else `null`. ALWAYS present (mirrors the gateway v2
            `ProcessInstanceResult.suspendedDate`): a non-null value implies
            `state == Suspended`, and resuming clears it back to `null`.
        tags:
          type: array
          items: { type: string }
        parent_process_instance_key:
          type: string
          nullable: true
          description: >
            C8 parent linkage for a call-activity **child** process instance:
            the key of the calling (parent) process instance. `null` for a
            top-level instance. Mirrors C8's `parentProcessInstanceKey`.
        parent_element_instance_key:
          type: string
          nullable: true
          description: >
            C8 parent linkage for a call-activity **child** process instance:
            the element-instance key of the call-activity that spawned this
            instance in the parent. `null` for a top-level instance. Mirrors
            C8's `parentElementInstanceKey`.
    Variable:
      type: object
      required: [name, value, scope_key]
      properties:
        name: { type: string }
        value: { type: string }
        scope_key: { type: string }
    SetInstanceVariablesRequest:
      type: object
      required: [scopeKey, variables]
      properties:
        scopeKey:
          type: string
          description: >
            Target variable scope key (e.g. a Variable's scope_key). The engine
            addresses both process-instance and element-instance scopes: pass the
            process-instance key to update instance-level variables, or an
            element-instance scope key to target a nested (activity/subprocess) scope.
        variables:
          type: object
          additionalProperties: true
          description: JSON object of variable name → value to merge into the scope.
        local:
          type: boolean
          default: false
          description: >
            Zeebe local semantics. When true, variables are written strictly into
            the addressed scopeKey. When false (the default), each variable is
            merged into the scope where it is already defined, propagating upward
            from the addressed scope (and created on the addressed scope if it is
            not found on any ancestor).
    Job:
      type: object
      required: [key, element_id, job_type, state, retries, worker, deadline_ms, activated_at_ms, timeout_ms]
      properties:
        key: { type: string }
        element_id: { type: string }
        job_type: { type: string }
        state: { type: string }
        retries: { type: integer, format: int32 }
        worker: { type: string, nullable: true }
        deadline_ms: { type: integer, format: int64, nullable: true }
        activated_at_ms:
          type: integer
          format: int64
          nullable: true
          description: >
            Logical instant (ms since epoch) the current activation lock was
            acquired. Populated only for a job the engine reports as Activated.
        timeout_ms:
          type: integer
          format: int64
          nullable: true
          description: >
            The current lock window (deadline_ms − activated_at_ms) the job is
            held for, derived from the live deadline. Reflects UpdateJobTimeout
            lock extensions that move the deadline out (or in). Null unless
            activated.
    Incident:
      type: object
      required: [key, element_id, kind, state, reason, created_at_ms]
      properties:
        key: { type: string }
        element_id: { type: string }
        kind: { type: string }
        state: { type: string }
        reason: { type: string }
        created_at_ms: { type: integer, format: int64 }
    InstancePage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Instance' }
        total: { type: integer, format: int64 }
        page: { type: integer, format: int32 }
        pageSize: { type: integer, format: int32 }
    InstanceDetail:
      type: object
      required: [instance, variables, jobs, incidents, active_elements, called_instances]
      properties:
        instance: { $ref: '#/components/schemas/Instance' }
        variables:
          type: array
          items: { $ref: '#/components/schemas/Variable' }
        jobs:
          type: array
          items: { $ref: '#/components/schemas/Job' }
        incidents:
          type: array
          items: { $ref: '#/components/schemas/Incident' }
        active_elements:
          description: >-
            Element instances currently in the Active state for this instance —
            the live token positions. Unlike jobs (service tasks only), this also
            covers wait states with no job: intermediate catch events, receive
            tasks, timers, event-based gateways and active (sub)process bodies.
            Drives the Process Explorer token overlay so a waiting instance still
            shows where it is parked.
          type: array
          items: { $ref: '#/components/schemas/ActiveElement' }
        called_instances:
          description: >-
            The child process instances this instance spawned via call
            activities (parent -> child navigation). Mirrors Operate's
            Details-tab "Called Process Instance" row — and "View all" for a
            multi-instance call activity, which yields one entry per spawned
            child, all sharing the same `calling_element_id`. Each entry names
            the call-activity cell (`calling_element_id`) that spawned the child,
            resolved from the child's `parent_element_instance_key`, so the
            Explorer can jump from a call-activity cell to its called instance.
            Empty when this instance has no call activities or none have spawned
            a child yet.
          type: array
          items: { $ref: '#/components/schemas/CalledInstance' }

    CalledInstance:
      type: object
      required: [key, process_id, version, state, has_incident, start_date_ms, calling_element_id, calling_element_name]
      properties:
        key:
          type: string
          description: The child process instance key.
        process_id: { type: string }
        version: { type: integer, format: int32 }
        state:
          type: string
          description: '`Active` | `Completed` | `Terminated`.'
        has_incident: { type: boolean }
        start_date_ms: { type: integer, format: int64 }
        calling_element_id:
          type: string
          nullable: true
          description: >-
            BPMN id of the call-activity cell in this (parent) instance that
            spawned the child, resolved from the child's
            `parent_element_instance_key` via the parent's element-instance rows.
            Resolution does not depend on the cell still being active — a
            COMPLETED call activity resolves too. `null` when the calling element
            instance is no longer resolvable (e.g. evicted).
        calling_element_name:
          type: string
          nullable: true
          description: The call-activity cell's BPMN name, when the model carries one.

    ActiveElement:
      type: object
      required: [element_id, element_type, element_name]
      properties:
        element_id: { type: string }
        element_type:
          description: Camunda element type spelling (e.g. INTERMEDIATE_CATCH_EVENT).
          type: string
        element_name: { type: string, nullable: true }

    # ---- Traces (camelCase wire fields) ----------------------------------
    TraceOutcome:
      type: string
      enum: [active, completed, terminated]
    TraceSummary:
      type: object
      required: [instanceKey, processId, version, businessId, outcome, startedAt, endedAt, durationMs, elementCount, incidentCount]
      properties:
        instanceKey: { type: string }
        processId: { type: string }
        version: { type: integer, format: int64, nullable: true }
        businessId: { type: string, nullable: true }
        outcome: { $ref: '#/components/schemas/TraceOutcome' }
        startedAt: { type: integer, format: int64 }
        endedAt: { type: integer, format: int64, nullable: true }
        durationMs: { type: integer, format: int64, nullable: true }
        elementCount: { type: integer, format: int32 }
        incidentCount: { type: integer, format: int32 }
    TraceJob:
      type: object
      required: [type, worker, createdAt, activatedAt, completedAt, waitMs, queueMs, serviceMs, attempts, failures]
      properties:
        type: { type: string }
        worker: { type: string, nullable: true }
        createdAt: { type: integer, format: int64 }
        activatedAt: { type: integer, format: int64, nullable: true }
        completedAt: { type: integer, format: int64, nullable: true }
        waitMs: { type: integer, format: int64, nullable: true }
        queueMs: { type: integer, format: int64, nullable: true }
        serviceMs: { type: integer, format: int64, nullable: true }
        attempts: { type: integer, format: int32 }
        failures: { type: integer, format: int32 }
    TraceElement:
      type: object
      required: [elementId, elementInstanceKey, scope, enteredAt, exitedAt, durationMs, incidents, job]
      properties:
        elementId: { type: string }
        elementInstanceKey: { type: string }
        scope: { type: string }
        enteredAt: { type: integer, format: int64 }
        exitedAt: { type: integer, format: int64, nullable: true }
        durationMs: { type: integer, format: int64, nullable: true }
        incidents: { type: integer, format: int32 }
        job:
          allOf: [ { $ref: '#/components/schemas/TraceJob' } ]
          nullable: true
    TraceIncident:
      type: object
      required: [elementId, elementInstanceKey, kind, reason, raisedAt, resolvedAt]
      properties:
        elementId: { type: string }
        elementInstanceKey: { type: string }
        kind: { type: string }
        reason: { type: string }
        raisedAt: { type: integer, format: int64 }
        resolvedAt: { type: integer, format: int64, nullable: true }
    InstanceTrace:
      type: object
      required: [instanceKey, processId, version, businessId, tags, startedAt, endedAt, durationMs, outcome, elements, incidents, path]
      properties:
        instanceKey: { type: string }
        processId: { type: string }
        version: { type: integer, format: int64, nullable: true }
        businessId: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        startedAt: { type: integer, format: int64 }
        endedAt: { type: integer, format: int64, nullable: true }
        durationMs: { type: integer, format: int64, nullable: true }
        outcome: { $ref: '#/components/schemas/TraceOutcome' }
        elements:
          type: array
          items: { $ref: '#/components/schemas/TraceElement' }
        incidents:
          type: array
          items: { $ref: '#/components/schemas/TraceIncident' }
        path:
          type: array
          items: { type: string }

    TraceConfig:
      type: object
      description: >-
        Trace-capture configuration and current in-memory ring state. Base
        traces are always collected in a console build but are held in a bounded
        in-memory ring (not persisted): they reset on restart and evict past
        `capacity`. Variable and stimulus capture are opt-in.
      required: [captureVariables, captureStimuli, capacity, varsMaxBytes, stimuliMax, tracedInstances]
      properties:
        captureVariables: { type: boolean }
        captureStimuli: { type: boolean }
        capacity: { type: integer, format: int32 }
        varsMaxBytes: { type: integer, format: int64 }
        stimuliMax: { type: integer, format: int32 }
        tracedInstances: { type: integer, format: int32 }
    TraceConfigUpdate:
      type: object
      description: >-
        Partial update of the runtime capture flags. Omitted fields are left
        unchanged. Stimulus capture implies variable capture; clearing variable
        capture also clears stimulus capture.
      properties:
        captureVariables: { type: boolean, nullable: true }
        captureStimuli: { type: boolean, nullable: true }

    # ---- Metrics (camelCase wire fields) ---------------------------------
    MetricsSnapshot:
      type: object
      required:
        - timestampMs
        - activeInstances
        - createsRest
        - createsStream
        - createsTotal
        - completionsRest
        - completionsStream
        - completionsTotal
        - connectionsActive
        - commitInflight
        - commitsTotal
        - writesTotal
        - bytesTotal
        - creditStallsTotal
        - fsyncMeanMs
        - commitWaitMeanMs
        - commitBatchMean
        - frameProcessingMeanMs
        - writerBusyRatio
        - residentBytes
        - ceilingThroughput
        - ceilingMemory
        - ceilingExporter
        - ceilingFlowControl
        - exporterFillPermille
        - slaMode
        - pendingCreateQueue
        - activeBacklog
        - admissionBacklogLimit
        - admissionCreateQueueLimit
        - admissionShedTotal
        - recovery
      properties:
        timestampMs: { type: integer, format: int64 }
        activeInstances: { type: integer, format: int64 }
        createsRest: { type: integer, format: int64 }
        createsStream: { type: integer, format: int64 }
        createsTotal: { type: integer, format: int64 }
        completionsRest: { type: integer, format: int64 }
        completionsStream: { type: integer, format: int64 }
        completionsTotal: { type: integer, format: int64 }
        connectionsActive: { type: integer, format: int64 }
        commitInflight: { type: integer, format: int64 }
        commitsTotal: { type: integer, format: int64 }
        writesTotal: { type: integer, format: int64 }
        bytesTotal: { type: integer, format: int64 }
        creditStallsTotal: { type: integer, format: int64 }
        fsyncMeanMs: { type: number, format: double }
        commitWaitMeanMs: { type: number, format: double }
        commitBatchMean: { type: number, format: double }
        frameProcessingMeanMs: { type: number, format: double }
        writerBusyRatio: { type: number, format: double }
        residentBytes: { type: integer, format: int64, nullable: true }
        ceilingThroughput: { type: boolean }
        ceilingMemory: { type: boolean }
        ceilingExporter: { type: boolean }
        ceilingFlowControl: { type: boolean }
        exporterFillPermille: { type: integer, format: int64 }
        slaMode: { type: string, enum: [latency, admission] }
        pendingCreateQueue: { type: integer, format: int64 }
        activeBacklog: { type: integer, format: int64 }
        admissionBacklogLimit: { type: integer, format: int64 }
        admissionCreateQueueLimit: { type: integer, format: int64 }
        admissionShedTotal: { type: integer, format: int64 }
        recovery: { $ref: '#/components/schemas/Recovery' }
    Recovery:
      type: object
      description: >-
        Per-node Raft recovery/leadership state so the cluster view can show
        "up but catching up" while a restarted owner reclaims its partitions
        (and the failover incumbent hands leadership back).
      required: [recovering, owned, reclaimed, catchingUp, handingOff, detail]
      properties:
        recovering: { type: boolean }
        owned: { type: integer, format: int64 }
        reclaimed: { type: integer, format: int64 }
        catchingUp: { type: integer, format: int64 }
        handingOff: { type: integer, format: int64 }
        handoffLagEntries: { type: integer, format: int64, nullable: true }
        detail: { type: string }
    NodeMetrics:
      type: object
      required: [nodeId, address, isSelf, reachable, error, metrics]
      properties:
        nodeId: { type: integer, format: int64 }
        address: { type: string }
        isSelf: { type: boolean }
        reachable: { type: boolean }
        error: { type: string, nullable: true }
        metrics:
          allOf: [ { $ref: '#/components/schemas/MetricsSnapshot' } ]
          nullable: true
    AggregateMetrics:
      type: object
      required: [reachableNodes, totalNodes, activeInstances, createsTotal, completionsTotal, connectionsActive, commitInflight, residentBytes]
      properties:
        reachableNodes: { type: integer, format: int64 }
        totalNodes: { type: integer, format: int64 }
        activeInstances: { type: integer, format: int64 }
        createsTotal: { type: integer, format: int64 }
        completionsTotal: { type: integer, format: int64 }
        connectionsActive: { type: integer, format: int64 }
        commitInflight: { type: integer, format: int64 }
        residentBytes: { type: integer, format: int64 }
    ClusterMetrics:
      type: object
      required: [checkedAtMs, nodes, aggregate]
      properties:
        checkedAtMs: { type: integer, format: int64 }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/NodeMetrics' }
        aggregate: { $ref: '#/components/schemas/AggregateMetrics' }

    # ---- Models (snake_case wire fields) ---------------------------------
    DeployStatus:
      type: string
      enum: [not_deployed, in_sync, modified, unparsable]
    ModelSummary:
      type: object
      required: [name, process_ids, deploy_status, deployed_version, deployed_key, updated_at_ms, size]
      properties:
        name: { type: string }
        process_ids:
          type: array
          items: { type: string }
        deploy_status: { $ref: '#/components/schemas/DeployStatus' }
        deployed_version: { type: integer, format: int64, nullable: true }
        deployed_key: { type: string, nullable: true }
        updated_at_ms: { type: integer, format: int64 }
        size: { type: integer, format: int64 }
    Model:
      type: object
      required: [name, xml, process_ids, deploy_status, deployed_version, deployed_key]
      properties:
        name: { type: string }
        xml: { type: string }
        process_ids:
          type: array
          items: { type: string }
        deploy_status: { $ref: '#/components/schemas/DeployStatus' }
        deployed_version: { type: integer, format: int64, nullable: true }
        deployed_key: { type: string, nullable: true }
    CreateModelRequest:
      type: object
      required: [name, xml]
      properties:
        name: { type: string }
        xml: { type: string }

    # ---- Workers (camelCase wire fields) ---------------------------------
    WorkerPhase:
      type: string
      enum: [stopped, starting, running, crashed]
    WorkerMetrics:
      type: object
      required: [completed, failed, inFlight, throughput, uptimeMs, connected]
      properties:
        completed: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        inFlight: { type: integer, format: int64 }
        throughput: { type: number, format: double }
        uptimeMs: { type: integer, format: int64 }
        connected: { type: boolean }
    WorkerRuntime:
      type: object
      required: [status, pid, startedAtMs, restarts, lastError, metrics]
      properties:
        status: { $ref: '#/components/schemas/WorkerPhase' }
        pid: { type: integer, format: int64, nullable: true }
        startedAtMs: { type: integer, format: int64, nullable: true }
        restarts: { type: integer, format: int32 }
        lastError: { type: string, nullable: true }
        metrics: { $ref: '#/components/schemas/WorkerMetrics' }
    WorkerSummary:
      type: object
      required: [name, files, updatedAtMs, runtime]
      properties:
        name: { type: string }
        files:
          type: array
          items: { type: string }
        updatedAtMs: { type: integer, format: int64 }
        runtime: { $ref: '#/components/schemas/WorkerRuntime' }
    WorkersResponse:
      type: object
      required: [workers, denoAvailable, nodeAvailable]
      properties:
        workers:
          type: array
          items: { $ref: '#/components/schemas/WorkerSummary' }
        # Deno present. Node-first (ADR 0038): Deno is optional, needed only to
        # compile a project to a standalone binary; workers RUN on Node.
        denoAvailable: { type: boolean }
        # Node >= 22.6 present — the primary runtime for running workers/projects.
        nodeAvailable: { type: boolean }
    CreateWorkerRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        jobType: { type: string, nullable: true }

    # ---- Shared library --------------------------------------------------
    LibFilesResponse:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: { type: string }

    # ---- Generic file-create bodies --------------------------------------
    CreateFileRequest:
      type: object
      required: [path]
      properties:
        path: { type: string }
    CreateProjectPathRequest:
      type: object
      required: [path]
      properties:
        path: { type: string }
        dir: { type: boolean, default: false }

    # ---- Config (camelCase wire fields) ----------------------------------
    SlaOption:
      type: object
      required: [id, label, tagline, description]
      properties:
        id: { type: string }
        label: { type: string }
        tagline: { type: string }
        description: { type: string }
    SlaModeConfig:
      type: object
      required: [current, description, source, options]
      properties:
        current: { type: string }
        description: { type: string }
        source: { type: string }
        switchable: { type: boolean }
        options:
          type: array
          items: { $ref: '#/components/schemas/SlaOption' }
    ServerParam:
      type: object
      required: [key, category, label, description, default, value]
      properties:
        key: { type: string }
        category: { type: string }
        label: { type: string }
        description: { type: string }
        default: { type: string }
        value: { type: string, nullable: true }
    ServerConfig:
      type: object
      required: [slaMode, readOnly, params]
      properties:
        slaMode: { $ref: '#/components/schemas/SlaModeConfig' }
        readOnly: { type: boolean }
        params:
          type: array
          items: { $ref: '#/components/schemas/ServerParam' }
    SetSlaRequest:
      type: object
      required: [mode]
      properties:
        mode: { type: string }
    ConfigDependency:
      type: object
      required: [id, name, purpose, bin, present, version, installUrl, hint]
      properties:
        id: { type: string }
        name: { type: string }
        purpose: { type: string }
        bin: { type: string }
        present: { type: boolean }
        version: { type: string, nullable: true }
        installUrl: { type: string }
        hint: { type: string }
    PackConfigField:
      type: object
      required: [key, label, description, env, default, value]
      properties:
        key: { type: string }
        label: { type: string }
        description: { type: string, nullable: true }
        env: { type: string, nullable: true }
        default: { type: string, nullable: true }
        value: { type: string, nullable: true }
    LangPackConfig:
      type: object
      required: [id, displayName, builtin, detect, available, configFields]
      properties:
        id: { type: string }
        displayName: { type: string }
        builtin: { type: boolean }
        detect:
          type: array
          items: { type: string }
        available: { type: boolean }
        configFields:
          type: array
          items: { $ref: '#/components/schemas/PackConfigField' }
    IdeConfig:
      type: object
      required: [dependencies, langPacks]
      properties:
        dependencies:
          type: array
          items: { $ref: '#/components/schemas/ConfigDependency' }
        langPacks:
          type: array
          items: { $ref: '#/components/schemas/LangPackConfig' }

    # ---- Projects (camelCase wire fields) --------------------------------
    ProjectSummary:
      type: object
      required: [name, description, deployTarget, updatedMs, processes, decisions, forms, workers, running, source, lang, updateAvailable]
      properties:
        name: { type: string }
        displayName:
          type: string
          description: >-
            Human-facing name (may contain spaces), present when it differs
            from the directory-safe `name`. The console shows this on the
            project card and falls back to `name`.
        description: { type: string }
        deployTarget: { type: string }
        updatedMs: { type: integer, format: int64 }
        processes: { type: integer, format: int32 }
        decisions: { type: integer, format: int32 }
        forms: { type: integer, format: int32 }
        workers: { type: integer, format: int32 }
        running: { type: boolean }
        source:
          type: string
          enum: [workspace, path]
          default: workspace
          description: >-
            Where the project lives: "workspace" (a directory under the projects
            root) or "path" (an external checked-out directory imported by
            reference, ADR 0041, read live).
        lang:
          type: string
          description: >-
            Language pack id driving the project (e.g. "deno", "rust", "java").
            The console resolves the card's language icon by matching this to an
            Extension of kind "lang".
        template:
          type: string
          description: >-
            Id of the scaffold template the project was created from (e.g.
            "starter", "throughput", "java-starter"), when known. Surfaced on the
            card so a bug can be traced back to the built-in template or pack.
        scaffoldedFrom:
          $ref: '#/components/schemas/ProjectScaffoldedFrom'
        updateAvailable:
          type: boolean
          description: >-
            True when the project was scaffolded from a pack whose currently
            installed version differs from the project's recorded
            `scaffoldedFrom.version` — i.e. a newer template is available to
            overlay via `updateProjectFromTemplate`. Offline signal (installed
            pack vs scaffold breadcrumb); always present as a boolean and
            `false` for built-in templates and projects not scaffolded from a
            pack.
        latestVersion:
          type: string
          description: >-
            The installed scaffolding pack's current version, when it differs
            from `scaffoldedFrom.version` (the target of an update). Absent when
            up to date or not scaffolded from a pack.
        appUi:
          allOf: [ { $ref: '#/components/schemas/AppUi' } ]
          description: >-
            Console-integrated app-view descriptor (ADR 0057, issue #638),
            present only for a running app so the left rail can render it as a
            running-app entry without a per-project detail fetch. Absent for
            stopped projects (the rail lists running apps only).
    ProjectRunConfig:
      type: object
      required: [id, label, run, compile]
      properties:
        id: { type: string }
        label: { type: string }
        default: { type: boolean }
        run:
          type: array
          items: { type: string }
        compile:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
    ProjectRunConfigsResponse:
      type: object
      required: [runConfigs, active]
      properties:
        runConfigs:
          type: array
          items: { $ref: '#/components/schemas/ProjectRunConfig' }
        active: { type: string, nullable: true }
    ProjectToolchain:
      type: object
      required: [run, compile]
      properties:
        run:
          type: array
          items: { type: string }
        compile:
          type: array
          items: { type: string }
        runConfigs:
          type: array
          items: { $ref: '#/components/schemas/ProjectRunConfig' }
        activeRunConfig: { type: string, nullable: true }
    ProjectScaffoldedFrom:
      type: object
      required: [pack]
      properties:
        pack: { type: string }
        version: { type: string }
    ProjectConfig:
      type: object
      required: [name, description, deployTarget, main, platforms, lang, app, createdMs, updatedMs]
      properties:
        name: { type: string }
        displayName:
          type: string
          description: >-
            Human-facing name (may contain spaces), present when it differs
            from the directory-safe `name` used for file naming and routes.
        description: { type: string }
        deployTarget: { type: string }
        main: { type: string }
        platforms:
          type: array
          items: { type: string }
        lang: { type: string }
        app: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        toolchain: { $ref: '#/components/schemas/ProjectToolchain' }
        scaffoldedFrom: { $ref: '#/components/schemas/ProjectScaffoldedFrom' }
        template:
          type: string
          description: >-
            Id of the scaffold template this project was created from, when known.
        createdMs: { type: integer, format: int64 }
        updatedMs: { type: integer, format: int64 }
    FileNode:
      type: object
      required: [name, path, kind]
      properties:
        name: { type: string }
        path: { type: string }
        kind:
          type: string
          enum: [dir, file]
        children:
          type: array
          items: { $ref: '#/components/schemas/FileNode' }
    ProjectFilesResponse:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/FileNode' }
    RunStatus:
      type: string
      enum: [stopped, starting, running, stopping, error]
    RunState:
      type: object
      required: [status, pid, startedAtMs, lastError, compiling]
      properties:
        status: { $ref: '#/components/schemas/RunStatus' }
        pid: { type: integer, format: int64, nullable: true }
        startedAtMs: { type: integer, format: int64, nullable: true }
        lastError: { type: string, nullable: true }
        compiling: { type: boolean }
    AppUi:
      type: object
      description: >-
        Console-integrated app-view descriptor (ADR 0057, issue #638), resolved
        from the optional `ui` block in the app manifest against the project's
        run env. The studio uses it to place a running app in the left rail and,
        for a UI app, to locate its embedded webview. An app with no resolvable
        UI port is headless: still listed, but shown as a control-only pane.
        Identity/label/icon are display hints only — apps scaffolded from the
        same template share an identical manifest — so callers key the nav entry
        on the project name, not on these fields.
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: >-
            Whether the app opts in to an embedded UI. false (or no resolvable
            port) means headless: still listed, but control-only.
        port:
          type: integer
          format: int32
          nullable: true
          description: >-
            The resolved integrated-UI port, when known. Absent/null means
            headless. Discovered from the ADR 0057 boot handshake (the port the
            app reports it actually bound), falling back to the run-config env
            (never allocated).
        path:
          type: string
          nullable: true
          description: Path the embedded webview should open (default "/").
        icon:
          type: string
          nullable: true
          description: >-
            Left-rail icon hint (bundled icon name). The console falls back to a
            default glyph when absent/invalid.
        label:
          type: string
          nullable: true
          description: >-
            Left-rail label hint. The console disambiguates on the project name.
    ProjectTemplate:
      type: object
      required: [id, label, description, lang, source]
      properties:
        id: { type: string }
        label:
          type: string
          description: Short human-facing title rendered on the template card.
        description:
          type: string
          description: >-
            One-line description rendered on the template card. May be empty
            for packs that predate the manifest `description` field.
        lang:
          type: string
          description: >-
            Language pack id the scaffolded project runs on (e.g. "deno",
            "rust", "java"). The console resolves the card's language icon by
            matching this to an Extension of kind "lang".
        source:
          type: string
          enum: [builtin, pack]
          description: >-
            Where the template comes from — an offline built-in scaffold or an
            installed extension pack.
        pack:
          type: string
          description: >-
            Contributing extension pack id; present only when source is
            "pack".
        options:
          type: array
          description: >-
            Per-template creation options the New Project picker renders as
            controls on the selected card (e.g. a Node/Deno runtime toggle).
            Generic: any built-in or pack template may declare options; the
            console renders each control and echoes the chosen values back in
            `CreateProjectRequest.options`. Absent or empty for templates with
            no options.
          items: { $ref: '#/components/schemas/TemplateOption' }
        needsUrban:
          type: boolean
          description: >-
            True when the scaffolded app relies on the `@nanobpm/urban` toolkit
            for its codegen/run lifecycle (Urban apps). The New Project picker
            uses this together with `urbanAvailable` to surface a non-blocking
            "the toolkit will be installed on first use" hint — creation itself
            does not require the toolkit. Absent/false for non-Urban templates.
    TemplateOption:
      type: object
      required: [id, label, choices]
      properties:
        id:
          type: string
          description: >-
            Stable option key echoed back in `CreateProjectRequest.options`
            (e.g. "runtime").
        label:
          type: string
          description: Human-facing control label rendered on the card.
        choices:
          type: array
          minItems: 1
          description: The selectable values for this option.
          items: { $ref: '#/components/schemas/TemplateOptionChoice' }
        default:
          type: string
          nullable: true
          description: >-
            Value pre-selected when the card opens. Falls back to the first
            choice when absent.
    TemplateOptionChoice:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }
        requires:
          type: string
          nullable: true
          description: >-
            Host capability this choice requires; the console disables the
            choice (with an install hint) when the capability is absent.
            Recognised: "deno" (gated on `denoAvailable`), "node" (gated on
            `nodeAvailable`). Absent = always selectable.
    ProjectDetail:
      type: object
      required: [config, files, runState, denoAvailable, nodeAvailable, urbanAvailable, runnable, platforms, rootPath]
      properties:
        config: { $ref: '#/components/schemas/ProjectConfig' }
        files:
          type: array
          items: { $ref: '#/components/schemas/FileNode' }
        runState: { $ref: '#/components/schemas/RunState' }
        appUi:
          allOf: [ { $ref: '#/components/schemas/AppUi' } ]
          description: >-
            The console-integrated app-view descriptor (ADR 0057, issue #638).
            Always present; `enabled: false` or a null `port` marks a headless
            app (listed in the running-apps rail, but control-only).
        rootPath:
          type: string
          description: >-
            Absolute path of the project directory on the host running the
            server. Surfaced so users can locate the project's files on disk
            (header display + "copy path" actions in the file tree). When the
            console talks to a remote/containerized gateway this is the server's
            path, not the client's, so treat it as informational.
        # Deno present (needed only for `deno compile`, ADR 0038).
        denoAvailable: { type: boolean }
        # Node >= 22.6 present — the primary Run runtime.
        nodeAvailable: { type: boolean }
        # `@nanobpm/urban` CLI present — gates urban-app affordances in the
        # Studio (epic #514 host dry-out). Delivered by the marketplace pack
        # (#520); resolved host-side via console::urban::find_urban.
        urbanAvailable: { type: boolean }
        runnable: { type: boolean }
        missingToolchain:
          allOf: [ { $ref: '#/components/schemas/MissingToolchain' } ]
          nullable: true
          description: >-
            Present only when `runnable` is false. Names exactly what the server
            probed for (and could not find) so the Console can tell the user
            which tool to install, instead of a generic "toolchain missing".
        platforms:
          type: array
          items: { type: string }
    MissingToolchain:
      type: object
      description: >-
        What the run/compile toolchain probe looked for and did not find. Used
        by the project workspace banner to give an actionable install hint.
      required: [probes]
      properties:
        displayName:
          type: string
          nullable: true
          description: Human name of the missing toolchain (e.g. "Rust", "Deno / Node").
        probes:
          type: array
          description: >-
            Executable names searched for on PATH; finding ANY one satisfies the
            probe (e.g. ["cargo"] for a Rust pack, ["deno", "node"] for Deno).
          items: { type: string }
        installHint:
          type: string
          nullable: true
          description: One-line, actionable install hint for the missing toolchain.
        installUrl:
          type: string
          nullable: true
          description: Official install page for the missing toolchain.
    ProjectsResponse:
      type: object
      required: [projects, denoAvailable, nodeAvailable, urbanAvailable, platforms]
      properties:
        projects:
          type: array
          items: { $ref: '#/components/schemas/ProjectSummary' }
        # Deno present (needed only for `deno compile`, ADR 0038).
        denoAvailable: { type: boolean }
        # Node >= 22.6 present — the primary Run runtime.
        nodeAvailable: { type: boolean }
        # `@nanobpm/urban` CLI present — gates Urban-app affordances (the New
        # Project picker offers to install the first-party pack when absent).
        urbanAvailable: { type: boolean }
        platforms:
          type: array
          items: { type: string }
        templates:
          type: array
          items: { $ref: '#/components/schemas/ProjectTemplate' }
        extensions: { $ref: '#/components/schemas/ExtensionsOverview' }
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: >-
            Human-facing project name; spaces are allowed. Files are created
            under its directory-safe slug (e.g. "Home Heating" →
            "home-heating"), returned as the created config's `name`; the
            original spelling is kept as `displayName` when it differs.
        description: { type: string }
        template: { type: string, nullable: true }
        options:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: >-
            Chosen values for the selected template's declared options, keyed by
            `TemplateOption.id` (e.g. {"runtime":"deno"}). Omitted keys fall back
            to each option's `default`. Ignored for templates that declare no
            options.
    ImportProjectRequest:
      type: object
      required: [name, path]
      properties:
        name: { type: string }
        path:
          type: string
          description: >-
            Absolute host filesystem path to a checked-out Urban app/project
            directory (containing nano.app.json or nanobpm.project.json).
    ProjectReference:
      type: object
      required: [source, path]
      properties:
        source:
          type: string
          enum: [path]
          description: Reference source kind (currently only "path").
        path:
          type: string
          description: Canonical absolute directory the project resolves to.
    RenameProjectRequest:
      type: object
      required: [newName]
      properties:
        newName: { type: string }
    CompileRequest:
      type: object
      properties:
        targets:
          type: array
          items: { type: string }
    CompileStarted:
      type: object
      required: [started]
      properties:
        started: { type: boolean }
    UpdateFromTemplateRequest:
      type: object
      properties:
        apply:
          type: boolean
          default: false
          description: >-
            When false (default) compute and return the plan without writing
            (dry run). When true, write the non-conflicting subset (create +
            safe overwrite + auto-merged) and bump `scaffoldedFrom.version` on a
            clean update; conflicted files are left untouched.
        version:
          type: string
          description: >-
            Optional npm version/dist-tag of the pack to overlay. Defaults to the
            currently installed pack version (the offline `updateAvailable`
            target).
        takeTheirs:
          type: array
          items: { type: string }
          description: >-
            Project-relative paths of conflicted files to resolve *take-upstream*:
            discard the local changes and write the incoming pack file verbatim.
            Each listed file is written (on `apply`) and reported under
            `overwrite` instead of `conflicts`. Paths that aren't conflicts (or
            aren't shipped by the pack) are ignored. Combine with `apply: true`
            to resolve and write in a single call.
        resolveConflicts:
          type: string
          enum: [theirs, mine]
          description: >-
            Bulk conflict resolution. `theirs` resolves *every* conflict
            take-upstream (equivalent to listing all conflicted paths in
            `takeTheirs`), so a fully-resolved apply advances
            `scaffoldedFrom.version`. `mine` keeps every local file (the default
            behaviour). Applies on top of any explicit `takeTheirs`.
    UpdatePlan:
      type: object
      required: [pack, applied, versionBumped, create, overwrite, merged, preserved, conflicts, orphans]
      properties:
        pack:
          type: string
          description: The scaffolding pack id (`scaffoldedFrom.pack`).
        fromVersion:
          type: string
          description: The project's recorded scaffold version (the 3-way merge base).
        toVersion:
          type: string
          description: The version being overlaid.
        applied:
          type: boolean
          description: False for a dry run; true when the plan was written.
        versionBumped:
          type: boolean
          description: >-
            True when `scaffoldedFrom.version` was advanced to `toVersion` — only
            on a clean apply with no remaining conflicts.
        create:
          type: array
          items: { type: string }
          description: New files the pack adds (written on apply).
        overwrite:
          type: array
          items: { type: string }
          description: >-
            Files the pack changed that the user had not modified — safe to
            overwrite (written on apply).
        merged:
          type: array
          items: { type: string }
          description: >-
            Files 3-way auto-merged (upstream + local edits combined without
            overlap; written on apply).
        preserved:
          type: array
          items: { type: string }
          description: >-
            Files/dirs kept as-is (datasource DB + sidecars, nano-generated/,
            .git/, node_modules/).
        conflicts:
          type: array
          items: { type: string }
          description: >-
            Files where upstream and local both changed and could not be
            auto-merged — NOT written; surfaced for manual resolution.
        orphans:
          type: array
          items: { type: string }
          description: >-
            Files present locally but absent from the new pack — kept (never
            deleted), listed for review.
        checkpoint:
          type: string
          description: >-
            Project-relative path of the snapshot taken before the overlay wrote
            anything (any apply, including a conflict-skipping one; absent on a
            dry run). Copying this
            directory's contents back over the project restores files the update
            modified or removed, but does not delete files the update newly
            created — remove those manually for a full revert. Snapshots exclude
            `.git/`, `node_modules/`, `nano-generated/` and `.nano/`, and the
            newest few are retained.
        checkpointWarning:
          type: string
          description: >-
            Present only when the pre-update snapshot could not be taken
            (best-effort): the update still proceeded, but no restore point was
            created.
        postUpdate:
          $ref: '#/components/schemas/PostUpdateOutcome'
    PostUpdateOutcome:
      type: object
      description: >-
        Outcome of the automatic refresh run after a clean template apply
        (`npm install` + `urban gen`), so the updated project is immediately
        runnable without those two manual steps. Present only on a clean apply
        (no conflicts); omitted for a dry run or when conflicts remain.
      required: [installedDeps, generated]
      properties:
        installedDeps:
          type: boolean
          description: >-
            True when `npm install` ran to materialise dependencies the update
            introduced or bumped out of the installed range.
        generated:
          type: boolean
          description: >-
            True when `urban gen` regenerated the project's `nano-generated/`
            artifacts from the updated manifest/models (Urban-shaped apps only).
        warnings:
          type: array
          items: { type: string }
          description: >-
            Non-fatal problems (npm/urban unavailable, an install or gen
            failure). The overlay itself still succeeded; these tell the maker
            what to re-run by hand.
    ActiveRunConfigRequest:
      type: object
      properties:
        id: { type: string, nullable: true }
    ActiveRunConfigResponse:
      type: object
      required: [active]
      properties:
        active: { type: string, nullable: true }

    # ---- Extensions (camelCase wire fields) ------------------------------
    ExtensionFileType:
      type: object
      required: [ext, monacoLang]
      properties:
        ext: { type: string }
        monacoLang: { type: string }
    ExtensionTheme:
      type: object
      required: [id, label, appearance, tokens]
      properties:
        id: { type: string }
        label: { type: string }
        appearance:
          type: string
          enum: [light, dark]
        tokens:
          type: object
          additionalProperties: { type: string }
    ExtensionTemplate:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
    Extension:
      type: object
      required: [id, kind, displayName, builtin, fileTypes, templates, toolchainAvailable, trusted]
      properties:
        id: { type: string }
        kind:
          type: string
          # `trigger` was contributed by ADR 0025 §6 but never added here, so the
          # generated client typed a trigger pack's kind as impossible.
          enum: [lang, app, example, theme, trigger]
        displayName: { type: string }
        icon:
          type: string
          description: >-
            Optional icon for the pack, as an inline SVG XML string (preferred)
            or a data:/http: URL. Lang packs supply this so the console can badge
            project cards with a language icon.
        builtin: { type: boolean }
        fileTypes:
          type: array
          items: { $ref: '#/components/schemas/ExtensionFileType' }
        templates:
          type: array
          items: { $ref: '#/components/schemas/ExtensionTemplate' }
        themes:
          type: array
          items: { $ref: '#/components/schemas/ExtensionTheme' }
        intellisense:
          type: array
          description: >-
            SDK-derived Monaco IntelliSense contributed by the pack, one entry per
            monacoLang. Optional; the console registers completion/hover/signature
            providers from these.
          items: { $ref: '#/components/schemas/ExtensionIntellisense' }
        components:
          type: array
          description: >-
            Zeebe element templates the pack contributes as installable BPMN
            components (ADR 0033 §4). The console merges these under a project's
            own components (project wins on an id collision) to drive the palette.
            Kept as free-form objects so the full element-template shape survives
            the response round-trip; the modeler validates them at registration.
          items:
            type: object
            additionalProperties: true
        tours:
          type: array
          description: >-
            Guided journeys the pack contributes (ADR 0049 §7) — the mechanism by
            which onboarding scales with the pack ecosystem instead of living in a
            hardcoded list in the console. Kept as free-form objects for the same
            reason as `components` above: the authoritative schema is the manifest
            contract (server/src/console/extensions.rs `TourSpec`, mirrored for
            pack authors in @nanobpm/nano-ide-ext-types), and structural validation
            happens in exactly one place — the console adapter that turns a spec
            into a runnable journey. Typing the full step union here as well would
            be a third copy to keep in sync.

            Already trust-filtered: `handoff` steps are stripped from untrusted
            packs server-side, and a journey left with no steps is omitted, so
            anything present here is safe to offer.
          items:
            type: object
            additionalProperties: true
        toolchainAvailable: { type: boolean }
        trusted: { type: boolean }
    ExtensionCompletion:
      type: object
      required: [label]
      properties:
        label: { type: string }
        kind: { type: string }
        insertText: { type: string }
        snippet: { type: boolean }
        detail: { type: string }
        documentation: { type: string }
    ExtensionHover:
      type: object
      required: [symbol, contents]
      properties:
        symbol: { type: string }
        contents: { type: string }
    ExtensionSignatureParam:
      type: object
      required: [label]
      properties:
        label: { type: string }
        documentation: { type: string }
    ExtensionSignature:
      type: object
      required: [trigger, label]
      properties:
        trigger: { type: string }
        label: { type: string }
        documentation: { type: string }
        parameters:
          type: array
          items: { $ref: '#/components/schemas/ExtensionSignatureParam' }
    ExtensionIntellisense:
      type: object
      required: [monacoLang]
      properties:
        monacoLang: { type: string }
        triggerCharacters:
          type: array
          items: { type: string }
        completions:
          type: array
          items: { $ref: '#/components/schemas/ExtensionCompletion' }
        hovers:
          type: array
          items: { $ref: '#/components/schemas/ExtensionHover' }
        signatures:
          type: array
          items: { $ref: '#/components/schemas/ExtensionSignature' }
    ExtensionsOverview:
      type: object
      required: [extensions, yolo]
      properties:
        extensions:
          type: array
          items: { $ref: '#/components/schemas/Extension' }
        yolo: { type: boolean }
    MarketEntry:
      type: object
      required: [name, version, description, category, official, installed, updateAvailable, changelogAvailable]
      properties:
        name: { type: string }
        version: { type: string }
        description: { type: string }
        category:
          type: string
          enum: [lang, app, example, theme, trigger, agentic-sdlc, other]
        official:
          type: boolean
          description: >-
            True when the package is first-party (npm name scoped `@nanobpm/`).
            Non-official packages carrying the marketplace keyword are grouped
            under the "Community extensions" section.
        installed: { type: boolean }
        installedVersion: { type: string }
        updateAvailable: { type: boolean }
        repository:
          type: string
          description: >-
            Browsable source-repository URL (normalized from the package's npm
            `repository` field, e.g. a GitHub URL), when published. Lets users
            read the source and report issues upstream.
        homepage:
          type: string
          description: Package homepage URL, when published.
        npmUrl:
          type: string
          description: The package's page on the npm registry.
        changelogAvailable:
          type: boolean
          description: >-
            True when the installed pack ships a `CHANGELOG.md`, so the console
            can offer a "What's changed" affordance only when there is something
            to show. A cheap offline probe of the installed copy — stays `false`
            for packs the user has not installed (their published changelog is
            resolved on demand via `/extensions/changelog`).
    Marketplace:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/MarketEntry' }
    ExtensionReadme:
      type: object
      required: [pkg, readme, installed]
      properties:
        pkg: { type: string }
        readme:
          type: string
          description: The pack's README as raw markdown.
        installed:
          type: boolean
          description: True when the README came from an installed pack (vs npm).
    ExtensionChangelog:
      type: object
      required: [pkg, changelog, installed, delta]
      properties:
        pkg: { type: string }
        changelog:
          type: string
          description: >-
            The pack's changelog as raw markdown. Scoped to the installed→latest
            delta when `delta` is true, else the full changelog.
        installed:
          type: boolean
          description: >-
            True when the changelog came from an installed pack (vs the
            downloaded registry tarball).
        delta:
          type: boolean
          description: >-
            True when `changelog` was narrowed to just the entries between the
            installed and latest versions (vs the full history).
    ServerUpdateStatus:
      type: object
      required: [current, updateAvailable, canSelfUpdate, installMethod]
      properties:
        current:
          type: string
          description: >
            Installed version in the update channel's version space — the basis
            for the update comparison and shown next to latest. For the npm
            channel this is the launcher/plugin version; otherwise the running
            server build.
        serverVersion:
          type: string
          description: >
            The actual running server binary build (NANOBPM_VERSION). Present
            (and distinct from current) when the update unit versions in a
            different space than the server build, e.g. an npm-managed install.
        latest:
          type: string
          description: >
            Latest available version for the launch channel, or absent if it
            could not be resolved (offline, unknown channel, self-managed).
        updateAvailable:
          type: boolean
          description: >
            True only when a self-updatable install has a newer latest than
            current. Always false for self-managed / dev binaries.
        canSelfUpdate:
          type: boolean
          description: >
            True when the launcher manages this binary (managed npm platform
            package or managed download) and can perform an in-place update.
        installMethod:
          type: string
          description: >
            How the running binary was provisioned, as reported by the
            launcher.
          enum: [managed-npm, managed-download, configured, flag, repo-release, repo-debug, unknown]
        channel:
          type: string
          description: Update channel the launcher resolves latest from (npm or download).
        launcher:
          type: string
          description: Identifier of the launcher that started the server (e.g. c8ctl-plugin-nano).
        updateHint:
          type: string
          description: Human-readable guidance for updating (method-specific).
    ExtPkgRequest:
      type: object
      required: [pkg]
      properties:
        pkg: { type: string }
    UrbanToolkitStatus:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
          description: >
            Whether the `urban` CLI resolves after the ensure call (already
            present or freshly installed). False means the install ran but the
            binary still did not resolve.
    TrustRequest:
      type: object
      properties:
        yolo: { type: boolean, nullable: true }
        approve: { type: string, nullable: true }
        revoke: { type: string, nullable: true }

    # ---- Data / datasources (ADR 0024, camelCase wire fields) -------------
    DataSourceInfo:
      type: object
      required: [name, driver, url]
      properties:
        name: { type: string }
        driver: { type: string }
        url: { type: string }
        migrations: { type: string, nullable: true }
    DataSourcesResponse:
      type: object
      required: [sources]
      properties:
        default: { type: string, nullable: true }
        sources:
          type: array
          items: { $ref: '#/components/schemas/DataSourceInfo' }
    DataColumnMeta:
      type: object
      required: [name, type, notNull, primaryKey]
      properties:
        name: { type: string }
        type: { type: string }
        notNull: { type: boolean }
        primaryKey: { type: boolean }
    DataForeignKey:
      type: object
      required: [column, refTable, refColumn, onDelete]
      description: >-
        A foreign-key constraint: `column` in this table references
        `refTable(refColumn)`. `refColumn` is empty when the FK targets the
        parent's primary key. `onDelete` is the referential action (e.g.
        `CASCADE`), empty when none was declared.
      properties:
        column: { type: string }
        refTable: { type: string }
        refColumn: { type: string }
        onDelete: { type: string }
    DataTableMeta:
      type: object
      required: [name, columns, indexes, foreignKeys]
      properties:
        name: { type: string }
        columns:
          type: array
          items: { $ref: '#/components/schemas/DataColumnMeta' }
        indexes:
          type: array
          items: { type: string }
        foreignKeys:
          type: array
          items: { $ref: '#/components/schemas/DataForeignKey' }
    DataSchemaResponse:
      type: object
      required: [tables]
      properties:
        tables:
          type: array
          items: { $ref: '#/components/schemas/DataTableMeta' }
    DataQueryRequest:
      type: object
      required: [sql]
      properties:
        sql: { type: string }
        params:
          type: array
          description: Positional bind values for the statement's `?` placeholders.
          items: {}
    DataQueryResult:
      type: object
      required: [columns, rows]
      properties:
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
    DataExecResult:
      type: object
      required: [changed]
      properties:
        changed: { type: integer, format: int64 }
        lastInsertId: { type: integer, format: int64, nullable: true }
    DataScriptRequest:
      type: object
      required: [statements]
      properties:
        statements:
          type: array
          description: >
            DDL statements to run atomically in one transaction, in order.
          items: { type: string }
    DataMigrationEntry:
      type: object
      required: [name, applied]
      properties:
        name: { type: string }
        applied: { type: boolean }
        appliedAt: { type: string, nullable: true }
    DataMigrationsResponse:
      type: object
      required: [dir, entries]
      properties:
        dir: { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/DataMigrationEntry' }
    DataMigrateResult:
      type: object
      required: [applied, pending]
      properties:
        applied:
          type: array
          items: { type: string }
        pending: { type: integer, format: int64 }
    DomainTypesResult:
      type: object
      required: [text, tables, shapeDiagnostics, migrated]
      properties:
        path:
          type: string
          nullable: true
          description: >
            The file written (relative to the project root), or null when the
            op only returned the text without writing (e.g. the preview
            endpoint, which resolves with `write:false`).
        text:
          type: string
          description: The emitted `domain.d.ts` contents.
        tables:
          type: integer
          format: int64
          description: Number of tables reified into interfaces.
        shapeDiagnostics:
          type: array
          description: >
            Resolve-time problems with the composed `nano:shape` declarations
            (ADR 0040 §10). Always present (empty when every shape resolved);
            the preview endpoint surfaces these live for the in-editor shapes.
          items: { $ref: '#/components/schemas/ShapeDiagnostic' }
        migrated:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: >
            Pending schema migrations applied *before* introspecting each
            datasource (ADR 0029 §4.1/§6), keyed by source name → the applied
            migration filenames in order. Always present; empty on the preview
            endpoint (`write:false` never mutates the DB) and whenever no
            migration was outstanding.
        metaPath:
          type: string
          nullable: true
          description: >
            The generated typed model-metadata accessor written
            (`nano-generated/meta.ts`, `@nanobpm/meta`, ADR 0040 §5), or null when
            the op ran with `write:false` (e.g. the preview endpoint).
        domainModelPath:
          type: string
          nullable: true
          description: >
            The structured Fused Domain Model cache written
            (`nano-generated/domain.json`, ADR 0040 §1), or null under
            `write:false`.
        meta:
          type: string
          nullable: true
          description: >
            The emitted typed model-metadata accessor (`meta.ts`, `@nanobpm/meta`,
            ADR 0040 §5) contents. Present whenever the op resolved (including the
            preview endpoint under `write:false`, which returns it without writing).
        domainModel:
          type: string
          nullable: true
          description: >
            The emitted structured Fused Domain Model (`domain.json`, ADR 0040 §1)
            contents. Present whenever the op resolved (including the preview
            endpoint under `write:false`, which returns it without writing).
    MetaDeclSpec:
      type: object
      required: [key, value]
      description: >
        One model-level metadata entry (`nano:meta`) the modeller is editing (ADR
        0040 §5), tagged with its defining process for `model:<processId>`
        provenance.
      properties:
        process: { type: string }
        key: { type: string }
        value: { type: string }
    ShapeOpSpec:
      type: object
      required: [op]
      description: >
        One composition operation of a composed motion-shape, in author order
        (ADR 0040 §9). Which fields apply depends on `op`: `carry`/`project`/
        `reference` name a source entity in `ref`; `project` adds the `fields`
        subset (and an optional `via` FK path); `extend`/`reference` add a `name`;
        `extend` adds a scalar/entity `type`.
      properties:
        op:
          type: string
          enum: [carry, project, extend, reference]
        ref: { type: string }
        fields:
          type: array
          items: { type: string }
        via: { type: string }
        name: { type: string }
        type: { type: string }
        optional: { type: boolean }
        list: { type: boolean }
        spread: { type: boolean }
    ShapeDeclSpec:
      type: object
      required: [id, ops]
      description: A composed motion-shape the modeller is editing (ADR 0040 §9).
      properties:
        id: { type: string }
        name: { type: string }
        ops:
          type: array
          items: { $ref: '#/components/schemas/ShapeOpSpec' }
    DomainTypesPreviewRequest:
      type: object
      required: [shapes]
      properties:
        shapes:
          type: array
          description: >
            The composed shapes currently in the editor, resolved instead of the
            saved-model scan so the preview reflects unsaved edits.
          items: { $ref: '#/components/schemas/ShapeDeclSpec' }
        meta:
          type: array
          description: >
            The model-level metadata (`nano:meta`) currently in the editor,
            previewed instead of the saved-model scan so the fuse/accessor reflect
            unsaved edits (ADR 0040 §5).
          items: { $ref: '#/components/schemas/MetaDeclSpec' }
    ShapeDiagnostic:
      type: object
      required: [shape, kind, severity, message]
      description: >
        A resolve-time problem with a composed shape, surfaced like the
        `workers[]` drift warning (ADR 0040 §10). A shape with any `error`
        diagnostic is omitted from the fuse; a `warning` still resolves.
      properties:
        shape: { type: string }
        kind:
          type: string
          enum:
            - unresolved-reference
            - reference-cycle
            - field-conflict
            - unknown-field
            - duplicate-id
            - ambiguous-reference
            - nominal-table-ref
            - same-id-collision
        severity:
          type: string
          enum: [error, warning]
        message: { type: string }
    TriggerEnqueueRequest:
      type: object
      required: [triggerId, body]
      properties:
        triggerId:
          type: string
          description: >
            Id of a `triggers[]` entry in the App manifest whose `action` this
            event drives.
        idempotencyKey:
          type: string
          nullable: true
          description: >
            Deterministic dedup key (ADR 0025 §3). Omit to have the server
            derive a content hash of the body — repeat submissions of the same
            body then collapse to one inbox row.
        body:
          type: object
          additionalProperties: true
          description: The event body; the action's FEEL evaluates over `body`.
    TriggerEnqueueResult:
      type: object
      required: [enqueued]
      properties:
        enqueued:
          type: boolean
          description: >
            true if a new inbox row was persisted; false if the idempotency key
            already existed (a no-op — the §3 dedup boundary).
        id:
          type: integer
          format: int64
          nullable: true
          description: Inbox row id when a new row was persisted.
    TriggerInboxRow:
      type: object
      required: [id, triggerId, status, attempts, createdAt]
      properties:
        id: { type: integer, format: int64 }
        triggerId: { type: string }
        status:
          type: string
          description: pending | done | failed (failed = dead-lettered after max attempts).
        attempts: { type: integer, format: int64 }
        lastError: { type: string, nullable: true }
        createdAt: { type: integer, format: int64 }
    TriggerInboxResponse:
      type: object
      required: [pending, done, failed, recent]
      properties:
        pending: { type: integer, format: int64 }
        done: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        recent:
          type: array
          description: The most recently updated inbox rows (newest first).
          items: { $ref: '#/components/schemas/TriggerInboxRow' }
    TriggersResponse:
      type: object
      required: [triggers, sources, errors]
      description: >
        The App's configured triggers resolved against the source registry
        (ADR 0025 phase 2).
      properties:
        triggers:
          type: array
          description: The manifest's declared triggers, resolved.
          items: { $ref: '#/components/schemas/TriggerInfo' }
        sources:
          type: array
          description: >
            The full source registry — core kinds plus every installed pack's
            declared kinds — for the console source picker.
          items: { $ref: '#/components/schemas/SourceKindInfo' }
        errors:
          type: array
          description: Per-trigger source config errors (e.g. a malformed cron spec).
          items: { type: string }
    TriggerInfo:
      type: object
      required: [id, type, builtin]
      properties:
        id: { type: string }
        type:
          type: string
          description: The trigger's source kind (its manifest `type`).
        builtin:
          type: boolean
          description: >
            true if the kind is a compiled-in core source (cron/webhook/file/
            manual); false if it is a pack/external source driven via the ingress.
        recognized:
          type: boolean
          description: >
            Whether the kind is in the source registry at all (a false value
            flags a typo or a not-yet-installed pack).
        action:
          type: object
          additionalProperties: true
          nullable: true
          description: The trigger's action block, verbatim from the manifest.
    SourceKindInfo:
      type: object
      required: [kind, builtin, configFields]
      properties:
        kind: { type: string }
        builtin:
          type: boolean
          description: true for a compiled-in core source; false for a pack source.
        displayName: { type: string, nullable: true }
        configFields:
          type: array
          description: >
            The fields the console's Add-trigger form renders for this kind — the
            core kinds' known keys (e.g. cron `spec`, file `path`) or a pack's
            declared `triggerSources[].configFields`.
          items: { $ref: '#/components/schemas/TriggerConfigField' }
    TriggerConfigField:
      type: object
      required: [key, label, required]
      properties:
        key: { type: string }
        label: { type: string }
        description: { type: string, nullable: true }
        default: { type: string, nullable: true }
        required:
          type: boolean
          description: Whether the Add-trigger form must have a value for this field.
    AddTriggerRequest:
      type: object
      required: [id, type, action]
      description: A new trigger to append to the App manifest's triggers[].
      properties:
        id:
          type: string
          description: Unique trigger id within the App (also the ingress path segment).
        type:
          type: string
          description: The source kind (a recognised core or pack `type`).
        config:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: >
            Flat map of the kind's config field values (keyed by
            TriggerConfigField.key). The server places each into the manifest
            shape the kind expects.
        connection:
          type: string
          nullable: true
          description: Optional named connection reference (for pack sources that use one).
        action:
          type: object
          additionalProperties: true
          description: >
            The action to apply on each event, e.g. `{ "start": "processId" }` or
            `{ "message": "messageName" }`.
    ConnectorsResponse:
      type: object
      required: [connectors, available, errors]
      description: >
        The App's enabled connectors resolved against the connector registry
        (ADR 0050 — the outbound edge, the mirror of TriggersResponse).
      properties:
        connectors:
          type: array
          description: The manifest's enabled connector workers, resolved.
          items: { $ref: '#/components/schemas/ConnectorInfo' }
        available:
          type: array
          description: >
            The full connector registry — every installed pack's declared
            worker types — for the console "Add connector" picker.
          items: { $ref: '#/components/schemas/ConnectorKindInfo' }
        errors:
          type: array
          description: >
            Per-connector coherence errors (e.g. an enabled connector whose pack
            was uninstalled, or whose seam component is missing).
          items: { type: string }
    ConnectorInfo:
      type: object
      required: [taskType, backed]
      properties:
        taskType:
          type: string
          description: The job type this connector's worker serves (the manifest `workers[].taskType`).
        connector:
          type: string
          nullable: true
          description: Id of the installed pack that supplies the worker (the manifest `workers[].connector`).
        displayName:
          type: string
          nullable: true
          description: Human label from the pack's worker declaration.
        connection:
          type: string
          nullable: true
          description: The named `connections[]` entry this worker references, if any.
        backed:
          type: boolean
          description: >
            true if an installed pack still ships a launchable worker `entry` for
            this `taskType` (the seam resolves); false flags an uninstalled or
            declaration-only pack.
        recognized:
          type: boolean
          description: >
            Whether the `taskType` is in the connector registry at all (a false
            value flags a stale enablement or a not-yet-installed pack).
    ConnectorKindInfo:
      type: object
      required: [taskType, connector, hasComponent, configFields]
      properties:
        taskType:
          type: string
          description: The job type the pack's worker serves.
        connector:
          type: string
          description: Id of the pack contributing this worker (the enablement writes it to `workers[].connector`).
        displayName: { type: string, nullable: true }
        hasComponent:
          type: boolean
          description: >
            true if the same pack also contributes an element-template component
            whose `zeebe:taskDefinition:type` equals this `taskType` (the design→
            runtime seam, ADR 0050 §2). A registry entry with no component is a
            worker the maker wires to a hand-authored task.
        configFields:
          type: array
          description: >
            The fields the console's Add-connector form renders — the pack's
            declared `workers[].configFields` (env-pointer credentials/config).
          items: { $ref: '#/components/schemas/TriggerConfigField' }
    AddConnectorRequest:
      type: object
      required: [type]
      description: A connector to enable — appended to the App manifest's workers[] (ADR 0050).
      properties:
        type:
          type: string
          description: The connector's `taskType` (a recognised pack worker type).
        connection:
          type: string
          nullable: true
          description: >
            Optional name for a `connections[]` entry to create/reference for
            this connector's shared credentials (env pointers, ADR 0027 §5).
        config:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: >
            Flat map of the connector's config field values (keyed by
            TriggerConfigField.key) — env-pointer defaults written into the named
            `connection`. Never inline secrets.
