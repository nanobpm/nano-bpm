[package]
name = "processos"
version = "0.1.1"
edition = "2021"
description = "ProcessOS — the runtime process-optimization plane for Nano BPM. Stage T1: ingest Nano's trace/metrics export and serve an Insights report. Talks to Nano only over its public contracts; Nano never depends on this crate."

# Independent crate, sibling to engine-core / server / engine-wasm (no root
# workspace, per repo convention). The dependency edge is one-way: ProcessOS may
# read Nano's public HTTP surfaces; Nano never links ProcessOS.
[[bin]]
name = "processos"
path = "src/main.rs"

# `duckdb-bundled` (on by default) compiles DuckDB from source so normal and
# release builds produce a self-contained binary. CI's clippy+test job builds
# with `--no-default-features` + `DUCKDB_DOWNLOAD_LIB=1` to link a prebuilt
# DuckDB and skip the multi-minute C++ compile; nothing else toggles off.
[features]
default = ["duckdb-bundled"]
duckdb-bundled = ["duckdb/bundled"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP client for the read/control contracts and the LLM hypothesis providers.
# Localhost gateway + local llama.cpp are plain HTTP, but Anthropic (and most
# hosted model APIs) require HTTPS — so we enable the pure-Rust rustls backend
# (no system OpenSSL; still builds offline from the crate cache).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
# Stream combinators for consuming the LLM's token stream (reqwest bytes_stream) and
# bridging the agent's event channel into an axum SSE response.
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
# The MVP optimization harness (SimRunner) embeds the REAL engine for
# trustworthy native replay — exactly as production runs it. engine-core is
# lean/zero-dependency and std-only; this is a one-way `path` dependency (Nano's
# engine never links ProcessOS). `serde` enables natural JSON variable I/O.
nanobpmn-engine-core = { path = "../engine-core", features = ["serde"] }
# Worker-scaling / provisioning advisor — the single source of truth for the
# per-job-type classification (starved / under-provisioned / server-bound) and
# the Little's-Law worker sizing. Lives on the Nano side (a `server/crates/*`
# leaf) so the gateway's `/console/api/provisioning` endpoint reuses the *same*
# logic without Nano ever linking ProcessOS; ProcessOS (which may link Nano
# crates) re-exports it in `src/advisor.rs`. See #1294.
nano-provisioning-advisor = { path = "../server/crates/nano-provisioning-advisor" }
# Embedded analytic SQL engine for the LLM-driven data-analysis tools (querying
# the trace corpus). The default `duckdb-bundled` feature compiles DuckDB from
# source (one-time C++ build) so shipped binaries are self-contained with no
# system DuckDB needed. CI's clippy+test job instead builds `--no-default-features`
# with `DUCKDB_DOWNLOAD_LIB=1`, which links a prebuilt DuckDB and skips the ~20-min
# C++ compile (see `.github/workflows/ci.yml`); release builds keep the default.
duckdb = { version = "1", default-features = false }
# Psychological-trace export/import: bundle the investigation transcript, the LLM
# profiles used (api keys redacted), and a manifest into a single shareable zip.
# Pinned to the already-locked offline build; `deflate` keeps the archive compact.
zip = { version = "6", default-features = false, features = ["deflate"] }

# Build-time docs processor: the User Guide site at `/guide` is generated from
# the repository `README.md` (single source of truth) by `build.rs`, which chunks
# it on H2 headings and renders each section to HTML. Pinned to the offline-cached
# release; `html` is the only feature we need (no getopts/simd).
# Content-addressable revision keys for the annotations sidecar
# (`workspaces/<ws>/processes/<proc>/annotations.json`) so accepted
# semantic annotations survive across model revisions without a manual
# version counter. sha2 is a small, well-vetted pure-Rust crate.
sha2 = "0.10"

[build-dependencies]
pulldown-cmark = { version = "=0.13.3", default-features = false, features = ["html"] }

[profile.release]
opt-level = "s"
lto = true

[lints.rust]
# Project policy: warnings are banned. `cargo build`/`check` fail on any rustc
# warning (unused code, deprecations, future-incompat lints, linker_messages,
# etc.). See .cargo/config.toml for the macOS `__eh_frame` linker-warning fix.
warnings = "deny"
