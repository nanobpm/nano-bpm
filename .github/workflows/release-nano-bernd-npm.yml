name: release-nano-bernd-npm

# Triggered by tags of the form `nano-bernd-npm-v0.2.0`. Builds & publishes
# @nanobpm/nano-bernd to the npm registry.
#
# Authentication is npm OIDC trusted publishing — NO NPM_TOKEN. The package must
# have a Trusted Publisher configured on npmjs.com pointing at this repo + this
# workflow file (see clients/nano-bernd/RELEASING.md).
#
# Note: npm provenance is intentionally disabled (NPM_CONFIG_PROVENANCE=false) —
# it requires a public source repository, and nano-bpm is private by design.

on:
  push:
    tags:
      - 'nano-bernd-npm-v*'
  workflow_dispatch: {}

jobs:
  publish:
    name: Publish @nanobpm/nano-bernd
    runs-on: ubuntu-24.04
    permissions:
      # id-token: write lets npm exchange the GitHub OIDC token for a
      # short-lived publish token (trusted publishing).
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm OIDC trusted publishing needs npm CLI >= 11.5.1; pin a known-good
      # version (explicit, not @latest) so the publish pipeline is reproducible.
      - name: Upgrade npm (OIDC-capable)
        run: npm install -g npm@11.5.1

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      # Build the wasm from source in the release job so the published tarball
      # is provably built from the tag, not lifted from a CI run.
      - name: Build engine-wasm-ffi dist
        run: make engine-wasm-ffi-dist

      - name: Install
        working-directory: clients/nano-bernd
        run: npm ci

      - name: Sync wasm into package
        working-directory: clients/nano-bernd
        run: npm run sync-wasm

      - name: Verify tag matches package version
        working-directory: clients/nano-bernd
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#nano-bernd-npm-v}"
          if [[ "$pkg_version" != "$tag_version" ]]; then
            echo "::error::tag $tag_version does not match package.json version $pkg_version"
            exit 1
          fi
          echo "releasing @nanobpm/nano-bernd $pkg_version"

      - name: Build
        working-directory: clients/nano-bernd
        run: npm run build

      - name: Test
        working-directory: clients/nano-bernd
        run: npm test

      - name: Publish
        working-directory: clients/nano-bernd
        env:
          NPM_CONFIG_PROVENANCE: 'false'
        run: npm publish --access public
