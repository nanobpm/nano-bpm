# Nightly Zeebe exporter-trace validation against ZeebeTokenFlow.tla (#1962).
#
# Link A of the parity-proof chain (Zeebe Java -> ZeebeTokenFlow.tla): every
# graph of the hand-written corpus (formal/corpus/graphs) and of the bounded-
# exhaustive enumeration (formal/corpus/enumerate.mjs, bound from
# formal/corpus/bounds.json) runs on the PINNED Zeebe engine
# (formal/parity/zeebe-pin.json, in-JVM EngineRule via formal/traces/capture.sh)
# for every completion order and routing. Each exporter record stream is
# validated by TLC as a behaviour of ZeebeTokenFlow
# (formal/tla/conformance/ZeebeTokenFlowTrace.tla — soundness), and every join
# decision the model allows must be observed on Zeebe for some completion order
# (coverage). See formal/traces/conformance/README.md.
#
# NOT a PR gate. A divergence means the hand-transcribed reference model is
# wrong: each new divergence class is filed as an issue (deduplicated by
# signature: a known one gets a comment). No retries.
#
# Bumping the Zeebe pin, or editing the reference model, re-runs it on the PR
# (the `ci` bound) so a behaviour change in Zeebe is caught at the bump.
#
# Repro locally: paste the `repro:` line a finding prints (complete: bound,
# options, graph and the Zeebe --pin), or run e.g.
#   node formal/traces/conformance/zeebe-conformance.mjs --bound ci [--graph <id>]

name: Zeebe conformance (exporter traces vs ZeebeTokenFlow.tla, nightly)

on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      bound:
        description: 'Enumeration bound from formal/corpus/bounds.json (ci | nightly)'
        required: false
        default: 'nightly'
  # Non-required (not in branch protection / .mergify.yml).
  pull_request:
    paths:
      - '.github/workflows/zeebe-conformance-nightly.yml'
      - 'formal/parity/zeebe-pin.json'
      - 'formal/tla/ZeebeTokenFlow.tla'
      - 'formal/tla/conformance/**'
      - 'formal/traces/conformance/**'
      - 'formal/traces/capture.sh'
      - 'formal/traces/capture/**'
      - 'formal/traces/normaliser.json'
      - 'formal/corpus/**'
      - 'formal/tla/check.sh'

permissions:
  contents: read
  issues: write

concurrency:
  group: zeebe-conformance-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  conformance:
    name: zeebe-conformance (pinned Zeebe traces vs ZeebeTokenFlow.tla)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      BOUND: ${{ github.event_name == 'pull_request' && 'ci' || github.event.inputs.bound || 'nightly' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Resolve pinned TLC version
        id: tla
        run: echo "version=$(sed -n 's/^TLA_VERSION="\(.*\)"$/\1/p' formal/tla/check.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/nanobpm-formal
          key: tla2tools-${{ steps.tla.outputs.version }}
      # The pinned camunda checkout + engine build, cached together with the
      # Maven repository its saved classpath points into (see
      # zeebe-fuzz-nightly.yml for why both).
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nano-zeebe-traces
            ~/.m2/repository
          key: zeebe-traces-m2-${{ hashFiles('formal/parity/zeebe-pin.json') }}
      - name: Fetch the pinned TLC (and model-check the hand-written corpus)
        run: formal/tla/check.sh
      - name: Runner unit tests
        run: node --test formal/traces/conformance/*.test.mjs
      - name: Validate Zeebe traces against ZeebeTokenFlow.tla
        env:
          ZEEBE_TRACES_JAVA_HOME: ${{ env.JAVA_HOME }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::notice::bound $BOUND (each finding prints its complete repro: command)"
          file=""
          if [ "${{ github.event_name }}" = "schedule" ]; then file="--file"; fi
          node formal/traces/conformance/zeebe-conformance.mjs --bound "$BOUND" \
            --work "$RUNNER_TEMP/conformance" $file
      - name: Upload the divergences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeebe-conformance
          path: |
            ${{ runner.temp }}/conformance/divergences.json
            ${{ runner.temp }}/conformance/capture.log
            ${{ runner.temp }}/conformance/tlc-*/*.error.log
