# Daily live Camunda 8 differential for the runtime parity runner (#1408).
#
# Starts a dedicated, throwaway Camunda 8 container on the runner — its version
# derived from the Zeebe pin in formal/parity/zeebe-surface.json — and runs the
# same scenario driver against nano and Camunda, failing on any difference in
# the fields both expose. The container is per-job, so runs cannot interfere.
#
# Not a PR gate: a scheduled run reports on main's current state; a red run is
# a parity defect (or a runner defect) to root-cause. No retries.

name: Parity (live Camunda 8, daily)

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
  # Validate changes to this harness before they reach the nightly run.
  # Non-required (not in branch protection / .mergify.yml).
  pull_request:
    paths:
      - '.github/workflows/parity-camunda-daily.yml'
      # Everything the differential consumes: the runner, driver, backends and
      # corpus, the sources the nano read-model wasm is built from (#668: the
      # wasm is built per run, not committed), and the Zeebe pin.
      - 'formal/parity/runtime/**'
      - 'formal/parity/extensions.json'
      - 'formal/parity/extensions.mjs'
      - 'engine-core/**'
      - 'engine-wasm/**'
      - 'read-model/**'
      - 'Makefile'
      - 'scripts/wasm-cc-env.sh'
      - '.github/actions/engine-wasm-pkg/**'
      - '.github/actions/wasm-pack-cache/**'
      - 'formal/parity/zeebe-surface.json'
      # The JaCoCo coverage job (#1247): report, ratchet, matrix it tags against.
      - 'formal/parity/coverage/**'
      - 'formal/parity/coverage.json'
      # The exhaustive corpus generator + bounds the Zeebe measurement replays.
      - 'formal/corpus/**'

permissions:
  contents: read

concurrency:
  group: parity-camunda-daily-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  differential:
    name: parity-runtime (nano vs live Camunda 8)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Build engine-wasm/pkg (the nano backend's read-model wasm)
        uses: ./.github/actions/engine-wasm-pkg
      - name: Start Camunda 8 (version derived from the Zeebe pin)
        run: formal/parity/runtime/start-camunda.sh "" 8080
      - name: Two-backend differential
        env:
          CAMUNDA_REST_ADDRESS: http://localhost:8080
        run: node formal/parity/runtime/run.mjs --backend both --require-camunda
      - name: Extension-acceptance probe (#1261)
        # Every registered Nano-only extension must be REJECTED (or honoured only
        # as inert metadata) by Camunda. A registered extension Camunda ACCEPTS
        # as executable surface is not an extension — fail. --require-camunda so
        # a green run has probed every entry.
        env:
          CAMUNDA_REST_ADDRESS: http://localhost:8080
        run: node formal/parity/runtime/extension-acceptance.mjs --require-camunda
      - name: Camunda logs
        if: failure()
        run: docker logs parity-camunda 2>&1 | tail -300

  # Camunda half of the dual-engine parity-corpus coverage (#1247): the same
  # corpus on a live Camunda 8 with the JaCoCo agent attached to the broker,
  # zeebe/engine branch coverage tagged against the coverage matrix, and the
  # ratchet (formal/parity/coverage/baseline.json) failing on a drop.
  zeebe-coverage:
    name: parity-coverage (zeebe JaCoCo)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build engine-wasm/pkg (the runner's nano reference backend)
        uses: ./.github/actions/engine-wasm-pkg
      - name: Report + ratchet unit tests
        run: node --test formal/parity/coverage/*.test.mjs
      - name: Resolve pinned JaCoCo version
        id: jacoco
        run: echo "version=$(sed -n 's/^JACOCO_VERSION="\(.*\)"$/\1/p' formal/parity/coverage/zeebe-coverage.sh)" >> "$GITHUB_OUTPUT"
      # Restore / fetch / save as separate steps (#2079): the combined
      # actions/cache only saves when the whole job succeeds, so one red
      # measurement left no cache and every later run hit Maven Central (429).
      # Saving right after the fetch means the scheduled run on main seeds a
      # cache every PR run can restore. SHA-256-verified on every use (#1770).
      - name: Restore JaCoCo jars
        id: jacoco-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/nanobpm-jacoco
          key: jacoco-${{ steps.jacoco.outputs.version }}
      - name: Fetch JaCoCo jars (no-op on a verified cache hit)
        run: JACOCO_FETCH_ONLY=1 formal/parity/coverage/zeebe-coverage.sh
      - name: Save JaCoCo jars
        if: steps.jacoco-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/nanobpm-jacoco
          key: jacoco-${{ steps.jacoco.outputs.version }}
      - name: Measure zeebe/engine coverage while the corpus runs
        run: formal/parity/coverage/zeebe-coverage.sh "$RUNNER_TEMP/zeebe-jacoco.xml" ci
      - name: Report (tagged against the coverage matrix) + ratchet
        # --self-test 3 (#1707): re-parses the identical JaCoCo XML 3× and fails
        # loudly with the differing branches if the measurement is not
        # byte-identical — the gate must never flip on a nondeterministic
        # measurement. The timing-dependent surface is excluded via
        # coverage/zeebe-excludes.json, so identical inputs measure identically.
        run: node formal/parity/coverage/report.mjs --zeebe "$RUNNER_TEMP/zeebe-jacoco.xml" --out "$RUNNER_TEMP/zeebe-coverage-report.json" --self-test 3 --check
      - name: Upload the tagged uncovered-branch report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: parity-coverage-zeebe
          path: |
            ${{ runner.temp }}/zeebe-coverage-report.json
            ${{ runner.temp }}/zeebe-jacoco.xml
          if-no-files-found: ignore
