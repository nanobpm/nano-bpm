# Cross-compiles the gateway server for all five targets, uploads them as assets
# on the rolling `binaries` release of the PUBLIC plugin repo
# (jwulf/c8ctl-plugin-nano), and then bumps a marker file in the plugin repo so
# semantic-release cuts a new npm version that ships the fresh binaries.
# This repo's name never appears in the plugin repo; only the assets do.
#
# Prerequisites
# -------------
# 1. Secret C8CTL_PLUGIN_REPO_TOKEN: a fine-grained PAT (or GitHub App token)
#    with "Contents: read & write" AND "Pull requests: read & write" on
#    jwulf/c8ctl-plugin-nano ONLY. The PR scope is required because the plugin's
#    `main` ruleset rejects direct pushes, so the marker bump is landed via a
#    pull request that the workflow opens and merges (see the `publish` job).
# 2. Codegen needs Java (JDK 17) + uv (Python); the web console needs Node.
#    Both run ONCE in the `prepare` job (Linux) and are shared with every build
#    leg as an artifact, so the cross-compile legs only need Rust.
#
# Why the binaries are built with `--features console`
# ----------------------------------------------------
# The c8ctl plugin reads recorded traces back via `GET /console/api/traces/{key}`
# and surfaces the embedded web console, both of which only exist when the server
# is compiled with the `console` feature. A console-less binary would ship a
# plugin missing its documented trace-readback surface, so the feature is on.

name: Publish c8ctl binaries

on:
  push:
    tags: ['v*']          # cut binaries on each tagged nanobpmn release
  workflow_dispatch:

concurrency:
  group: publish-c8ctl-binaries
  cancel-in-progress: false

permissions:
  contents: read

env:
  PLUGIN_REPO: jwulf/c8ctl-plugin-nano
  BIN_NAME: nanobpm-gateway-rest-server

jobs:
  # ---------------------------------------------------------------------------
  # Produce the codegen output (generated/ + server/src/stub_impls.rs) and the
  # built web console (console/dist) ONCE. These are platform-independent — the
  # generated Rust is identical for every target and the embedded console assets
  # are architecture-agnostic — so the matrix build legs just consume them and
  # never need Java/uv/Node/make. This also keeps the codegen off the Windows
  # runner (which has no reliable `make`/bash codegen toolchain).
  # ---------------------------------------------------------------------------
  prepare:
    name: Generate REST layer + build console
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Fail fast if the pushed tag and the gateway crate version disagree. The
      # tag is the source of truth for the stamped binary (NANOBPM_VERSION in
      # server/build.rs), but Cargo.toml is the local/dev fallback + crate
      # metadata; they must be bumped together so a release can't ship a manifest
      # that contradicts its own tag. Only enforced on tag pushes.
      - name: Assert tag matches server/Cargo.toml version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version' server/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$tag  server/Cargo.toml=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag v$tag does not match server/Cargo.toml version $crate. Bump server/Cargo.toml (+ Cargo.lock) to $tag in the tagged commit." >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: console/package-lock.json

      # Needed to regenerate the in-browser μ-nano test-run engine from source
      # (engine-wasm -> console/src/wasm) so the distribution ships a freshly
      # release-built wasm rather than whatever artifact happens to be committed.
      - name: Install Rust toolchain (wasm32)
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - uses: Swatinem/rust-cache@v2
        with:
          key: console-wasm
          workspaces: engine-wasm

      - name: Install wasm-pack
        shell: bash
        # Pinned install from crates.io. The old rustwasm.github.io installer is
        # permanently stuck on v0.13.1 (the project moved to wasm-bindgen/wasm-pack),
        # so installing a fixed version here keeps the build deterministic and
        # silences wasm-pack's "newer version available" self-update warning.
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Generate REST layer + stubs
        shell: bash
        run: |
          set -euo pipefail
          uv sync
          make generate
          # Fail fast HERE (not 6 confusing cross-compile legs later) if a
          # git-ignored generated source the gateway bin `include_str!`s is
          # missing from prepare's output — the exact failure mode that shipped a
          # broken v0.0.17 (issue #1083: response_contract_schema.json was
          # generated but never uploaded). Each file listed here must also be in
          # the prebuilt-sources `path:` below. A per-file check (not
          # upload-artifact's `if-no-files-found`, whose aggregate semantics pass
          # as long as *any* listed path matches) is what actually catches a
          # single missing sibling.
          for f in server/src/stub_impls.rs server/src/response_contract_schema.json; do
            test -f "$f" || { echo "::error::'make generate' did not produce $f (required git-ignored gateway bin input)"; exit 1; }
          done

      # Rebuild μ-nano (wasm-pack --release) BEFORE the SPA build so the fresh
      # wasm is bundled into console/dist. `make console-wasm` fails the job if
      # wasm-pack is missing rather than silently falling back to the committed
      # artifact, because here we always want a freshly built release wasm.
      - name: Rebuild μ-nano wasm (release)
        shell: bash
        run: |
          set -euo pipefail
          command -v wasm-pack >/dev/null || { echo "wasm-pack not found" >&2; exit 1; }
          make console-wasm

      - name: Build web console
        shell: bash
        working-directory: console
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Upload prebuilt sources
        uses: actions/upload-artifact@v6
        with:
          name: prebuilt-sources
          include-hidden-files: true
          retention-days: 1
          # `make generate` (above) produces these git-ignored sources; list each
          # one the gateway bin needs so the cross-compile legs restore them.
          # server/src/response_contract_schema.json is `include_str!`d by the bin
          # (issue #1011) exactly like stub_impls.rs — omitting it fails every
          # build leg with "couldn't read response_contract_schema.json".
          path: |
            generated/
            generated-console/
            server/src/stub_impls.rs
            server/src/response_contract_schema.json
            console/dist/

  build:
    name: Build ${{ matrix.asset }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    # Defensive cap so a future build wedge (see issue #634) fails fast instead of
    # burning up to GitHub's 6h default and silently blocking the publish job.
    # Sized with headroom over the slowest leg: the x86_64-apple-darwin cross
    # build on macos-14 with a cold cache took 44.7 min at v0.0.25 (vs ~25 min at
    # v0.0.24), so a 45-min cap killed it and skipped the publish (#1309).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            asset: nanobpm-gateway-rest-server-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            asset: nanobpm-gateway-rest-server-darwin-x64
          # Linux legs cross-compile with cargo-zigbuild, pinning a glibc floor
          # (`.2.31` = Ubuntu 20.04) so the dynamically-linked `-gnu` binaries run
          # on older distros. Building natively on ubuntu-24.04 (glibc 2.39) would
          # bake in GLIBC_2.39 symbol refs that fail on anything older with
          # "version `GLIBC_2.39' not found". zig also provides the cross C
          # compiler/linker for the bundled C deps (rusqlite, jemalloc-sys), so no
          # per-target gcc/mold plumbing is needed.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            asset: nanobpm-gateway-rest-server-linux-x64
            zig: true
            glibc: '2.31'
          - target: aarch64-unknown-linux-gnu
            # Cross-compiled from x64 with cargo-zigbuild (like the other Linux
            # legs), NOT a native `ubuntu-24.04-arm` runner. The native-arm
            # experiment (#635) intermittently SIGTERM-killed this leg (exit 143 at
            # ~20 min, the hosted arm runner being preempted/OOM'd), wedging the
            # publish job on v0.0.13. The x64 zigbuild path shipped arm64 cleanly
            # for every release v0.0.5–v0.0.11, so it's the reliable default. zig
            # cross-compiles the target regardless of host arch and pins the 2.31
            # glibc floor.
            #
            # `lto_fast` (thin LTO + 16 codegen-units, see the build steps and
            # #634): since v0.0.11 the `console` feature grew (portable-pty #496,
            # reqwest `stream`), and the enlarged final crate pushed fat LTO's
            # single-threaded, whole-graph codegen past this leg's time/memory
            # budget — the exact wedge that hung v0.0.13 (stuck on the final crate,
            # not `dunce`). Thin LTO parallelizes the final stage and caps peak
            # memory; the arm64 gateway plugin binary tolerates the ~2–8% size
            # bump. Mirrors the armv6/armv7 legs below.
            os: ubuntu-24.04
            asset: nanobpm-gateway-rest-server-linux-arm64
            zig: true
            glibc: '2.31'
            lto_fast: true
          # 32-bit ARM legs relax the release profile's fat LTO (see `lto_fast`
          # handling in the build steps). `[profile.release]` uses `lto = true` +
          # `codegen-units = 1`, which collapses every crate into one LLVM module
          # optimized single-threaded — tolerable on 64-bit but pathological when
          # cross-compiling to 32-bit ARM (armv7 wedged for 60+ min in run
          # 31142202870, blocking the whole `publish` job). These are the least
          # performance-critical binaries, so thin LTO + 16 codegen-units is an
          # acceptable trade for builds that finish in minutes. See issue #634.
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-24.04
            asset: nanobpm-gateway-rest-server-linux-armv7
            zig: true
            glibc: '2.31'
            lto_fast: true
          - target: arm-unknown-linux-gnueabihf
            os: ubuntu-24.04
            asset: nanobpm-gateway-rest-server-linux-armv6
            zig: true
            glibc: '2.31'
            lto_fast: true
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            asset: nanobpm-gateway-rest-server-win32-x64.exe
    steps:
      - uses: actions/checkout@v5

      # Restore generated/, generated-console/, server/src/stub_impls.rs,
      # server/src/response_contract_schema.json and console/dist into the
      # workspace (all git-ignored, so no conflict with the checkout).
      - name: Download prebuilt sources
        uses: actions/download-artifact@v7
        with:
          name: prebuilt-sources
          path: .

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: server

      - name: Install zig (cross C compiler/linker)
        if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          # Pinned to 0.23.2 — the version compatible with the pinned zig 0.13.0
          # across ALL our targets. The compatible window is a single release:
          #   * aarch64 needs the `-Wl,--fix-cortex-a53-843419` linker-arg filter.
          #     Recent stable rustc emits that arg (rust-lang/rust#155453) when
          #     linking the engine-core cdylib; cargo-zigbuild only allow-lists it
          #     from 0.23.0 onward, so <0.23.0 (e.g. 0.19.x/0.20.x) fails the
          #     aarch64 link with `unsupported linker arg: --fix-cortex-a53-843419`.
          #   * 32-bit ARM (armv6/armv7) broke in 0.23.3 (still broken in 0.23.4,
          #     re-verified with zig 0.13 and 0.16 for #1322): its jemalloc-sys C build
          #     fails with `aeabi_unaligned.c: FileNotFound` plus a zig-0.14+
          #     `-mcpu` string (`generic+v7a+vfp3-d32+thumb2-neon`) that zig 0.13.0
          #     rejects. The unpinned/latest install pulls 0.23.3 and hits this.
          # 0.23.2 has the cortex-arg filter but predates the 32-bit ARM
          # regression. Verified locally (zig 0.13.0, cdylib crate) that x86_64,
          # aarch64 and armv7 all cross-compile cleanly. Bump this and `setup-zig`
          # above together so the pair stays compatible.
          tool: cargo-zigbuild@0.23.2

      - name: Build gateway (release, zig cross-compile, glibc floor)
        if: matrix.zig
        shell: bash
        working-directory: server
        env:
          # Stamp the binary's reported version from the tag (build.rs strips the
          # leading `v`). Empty on manual runs -> build.rs falls back to git/Cargo.
          NANOBPM_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          # 32-bit ARM legs relax fat LTO (see the matrix `lto_fast` comment) via
          # cargo's profile env vars: thin LTO + 16 codegen-units keeps the final
          # stage parallel so the build finishes in minutes instead of wedging.
          if [ "${{ matrix.lto_fast }}" = "true" ]; then
            export CARGO_PROFILE_RELEASE_LTO=thin
            export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          fi
          # armv6: link the ARM-RTABI unaligned-access shim that Rust >= 1.99's
          # strict-align libstd needs but zig's compiler-rt lacks (#1322). Shared
          # with scripts/cross-build.sh; a no-op for every other target.
          . ../scripts/zig-arm-shim-env.sh
          # The `.<glibc>` suffix pins the minimum glibc; zigbuild writes to the
          # unsuffixed target dir (server/target/<triple>/release/).
          cargo zigbuild --release --target "${{ matrix.target }}.${{ matrix.glibc }}" \
            --features console --bin "$BIN_NAME"

      - name: Build gateway (release, native)
        if: ${{ !matrix.zig }}
        shell: bash
        working-directory: server
        env:
          # Stamp the binary's reported version from the tag (build.rs strips the
          # leading `v`). Empty on manual runs -> build.rs falls back to git/Cargo.
          NANOBPM_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.lto_fast }}" = "true" ]; then
            export CARGO_PROFILE_RELEASE_LTO=thin
            export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          fi
          cargo build --release --target "${{ matrix.target }}" \
            --features console --bin "$BIN_NAME"

      - name: Stage asset
        shell: bash
        run: |
          set -euo pipefail
          src="server/target/${{ matrix.target }}/release/${BIN_NAME}"
          if [ -f "${src}.exe" ]; then
            src="${src}.exe"
          fi
          mkdir -p dist
          cp "$src" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 1

  publish:
    name: Upload binaries + trigger plugin release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: nanobpm-gateway-rest-server-*
          merge-multiple: true

      - name: Upload assets to the `binaries` release
        env:
          GH_TOKEN: ${{ secrets.C8CTL_PLUGIN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release view binaries --repo "$PLUGIN_REPO" >/dev/null 2>&1 || \
            gh release create binaries \
              --repo "$PLUGIN_REPO" \
              --title "nanobpmn binaries (rolling)" \
              --notes "Prebuilt gateway binaries consumed by the release workflow. Auto-updated." \
              --latest=false \
              --prerelease
          gh release upload binaries dist/* --repo "$PLUGIN_REPO" --clobber

      # Bump the bundled-binary marker in the plugin repo. Because the plugin's
      # npm version is decoupled from the nanobpmn version, landing this commit on
      # main is what makes semantic-release cut a release that ships the binaries
      # just uploaded above. The plugin's `main` ruleset requires a PR, so the
      # commit is landed via an auto-merged pull request (see the step body)
      # rather than a direct push. The conventional-commit TYPE is chosen from the
      # server SemVer delta so the plugin's bump magnitude reflects how much the
      # bundled server changed (issue #1):
      #   * server minor-or-higher bump -> feat(binary):  -> plugin MINOR
      #   * server patch bump (or commit-only)-> fix(binary): -> plugin PATCH
      # A server MAJOR is deliberately NOT mapped to a plugin major (that would
      # imply the plugin's own CLI surface broke); it maps to feat like a minor.
      # No `!`/`BREAKING CHANGE:` is ever emitted. No-ops (skips the PR) if
      # unchanged. semantic-release still takes the MAX bump across all commits,
      # so a bigger plugin-own change in the same window wins.
      - name: Bump bundled-binary marker (triggers npm release)
        env:
          GH_TOKEN: ${{ secrets.C8CTL_PLUGIN_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # This job downloads artifacts only (no checkout), so derive the
          # version/sha from GitHub-provided env vars rather than `git` in the
          # workspace (which has no .git and would fail under `set -e`).
          ver="${GITHUB_REF_NAME:-${GITHUB_SHA:0:7}}"
          ver="${ver#v}"
          sha="${GITHUB_SHA:0:7}"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          tmp="$(mktemp -d)"
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${PLUGIN_REPO}.git" "$tmp"

          # Previous bundled server version + commit, read BEFORE we overwrite
          # the marker.
          prev="$(jq -r '.version // empty' "$tmp/nanobpmn-binary.json" 2>/dev/null || true)"
          prev_sha="$(jq -r '.commit // empty' "$tmp/nanobpmn-binary.json" 2>/dev/null || true)"

          # Idempotency guard: skip when the marker already records this exact
          # version+commit. We compare the persisted fields rather than a
          # post-write `git diff`, because the `updated` timestamp is rewritten
          # on every run and would always leave the file dirty — defeating any
          # no-op detection and causing redundant plugin releases on re-runs.
          if [ "$prev" = "$ver" ] && [ "$prev_sha" = "$sha" ]; then
            echo "marker already at ${ver} (${sha}); nothing to release."
            exit 0
          fi

          # Pick the conventional-commit type from the server SemVer delta.
          # "feat" when the significant field (pre-1.0: minor; else major/minor)
          # changed, otherwise "fix". Unparseable/absent prev -> fix (safe).
          commit_type() {
            local p="${1%%-*}" n="${2%%-*}"
            p="${p%%+*}"; n="${n%%+*}"
            [ -z "$p" ] && { echo fix; return; }
            local pa pb pc na nb nc
            IFS=. read -r pa pb pc <<<"$p"
            IFS=. read -r na nb nc <<<"$n"
            pa=${pa:-0}; pb=${pb:-0}; na=${na:-0}; nb=${nb:-0}
            if [ "$pa" = 0 ] && [ "$na" = 0 ]; then
              # pre-1.0: the minor field carries "new capability" significance.
              [ "$nb" != "$pb" ] && echo feat || echo fix
            else
              { [ "$na" != "$pa" ] || [ "$nb" != "$pb" ]; } && echo feat || echo fix
            fi
          }
          type="$(commit_type "$prev" "$ver")"

          cat > "$tmp/nanobpmn-binary.json" <<JSON
          {
            "version": "${ver}",
            "commit": "${sha}",
            "updated": "${now}"
          }
          JSON
          cd "$tmp"
          msg="${type}(binary): bundle nanobpmn ${ver} (${sha})"
          body="Bundled nano server ${prev:-unknown} -> ${ver}."
          # The plugin repo's `main` ruleset requires every change to arrive via a
          # pull request (a direct `git push origin HEAD:main` is rejected with
          # GH013, and a ruleset bypass actor cannot be added on a personal repo
          # — see jwulf/c8ctl-plugin-nano#29). So land the marker bump on a
          # short-lived branch, open a PR, and merge it via the API. The ruleset
          # requires 0 approvals and its Copilot review is non-blocking, so the
          # squash-merge is immediate and — landing a commit on `main` — triggers
          # the plugin's semantic-release exactly as the old direct push did.
          # The squash commit subject IS the conventional-commit message that
          # semantic-release parses, so it must carry `$msg`.
          branch="release/bundle-nanobpmn-${ver}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "nanobpmn-ci"
          git config user.email "nanobpmn-ci@users.noreply.github.com"
          git switch -c "$branch"
          git add nanobpmn-binary.json
          git commit -m "$msg" -m "$body"
          git push origin "$branch"
          # gh authenticates via GH_TOKEN (C8CTL_PLUGIN_REPO_TOKEN); needs
          # `Pull requests: write` in addition to `Contents: write`.
          pr_url="$(gh pr create --repo "$PLUGIN_REPO" --base main --head "$branch" \
            --title "$msg" --body "$body")"
          echo "opened marker PR: $pr_url"
          gh pr merge "$pr_url" --repo "$PLUGIN_REPO" --squash --delete-branch \
            --subject "$msg" --body "$body"
