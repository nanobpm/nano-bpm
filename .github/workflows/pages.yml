# Publishes the schema/namespace site to https://nanobpm.io on merge to main.
#
# The site is *generated from the in-repo sources of truth* by website/build.mjs
# (the schema $id and the moddle descriptor uri), so a deploy can never ship a
# URL that drifts from the artifact it names. PR-time validation of the same
# build (drift guard + identity asserts) lives in ci.yml (the `schemas` job).
#
# One-time setup: Settings -> Pages -> Source = "GitHub Actions", and point the
# nanobpm.io DNS at GitHub Pages (see website/README.md).

name: Publish schemas (nanobpm.io)

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'USERGUIDE.md'
      - 'docs/**'
      - 'console/scripts/build-docs.mjs'
      - 'console/scripts/build-whitepaper.mjs'
      - 'spec-app/nano-app.schema.json'
      - 'console/src/moddle/nanoShapes.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # The blessed one-liner (https://nanobpm.io/install.sh) is mirrored from the
  # sibling nano-workforce repo's install.sh on every deploy (see the "Mirror the
  # blessed install script" step). That source lives in ANOTHER repo, so a change
  # to it never matches the push `paths` above — nano-workforce CI fires this
  # event on merge-to-main touching install.sh so the mirror refreshes promptly.
  repository_dispatch:
    types: [install-sh-updated]
  # Backstop for the cross-repo mirror: refresh nightly even if no dispatch fired
  # (e.g. the dispatch token lapsed), so nanobpm.io/install.sh can't silently rot.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys; never cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build _site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # build.mjs imports the .ts moddle descriptor directly, so it needs a
          # Node with TypeScript type-stripping on by default (>= 23.6). Matches
          # the spec-app / console CI jobs.
          node-version: '24'
      - name: Build live demo (website/demo)
        # The ADR 0043 Bojtos in-browser demo, served at /demo/ (linked from the
        # marketing landing page at /). It consumes the published npm
        # `@nanobpm/bojtos-*` packages (extracted to the nanobpm/bojtos repo) and
        # the published npm `@nanobpm/engine-wasm` (website/demo/package.json),
        # so this job does not build the wasm.
        working-directory: website/demo
        run: |
          npm ci
          npm run build
      - name: Build bundled docs (served at /docs on nanobpm.io)
        # The same generator the gateway uses to embed /docs in the app. It
        # renders USERGUIDE.md + docs/*.md into console/public/docs/*.html, which
        # website/build.mjs then copies into _site/docs. One generator, two
        # surfaces (the app at :8080 and nanobpm.io) — no docs fragmentation.
        working-directory: console
        run: |
          npm ci
          DOCS_SITE_BUILD=1 node scripts/build-docs.mjs
      - name: Build whitepaper (served at /whitepaper on nanobpm.io)
        # docs/whitepaper.md is the single source of truth; this generator renders
        # it into console/public/whitepaper/index.html (git-ignored), which
        # website/build.mjs then copies into _site/whitepaper. Same source powers
        # the in-app /whitepaper page — one generator, two surfaces. Reuses the
        # console node_modules installed by the docs step above.
        working-directory: console
        run: node scripts/build-whitepaper.mjs
      - name: Build site
        run: node website/build.mjs
      - name: Mirror the blessed install script (nano-workforce/install.sh)
        # Serve https://nanobpm.io/install.sh as the ACTUAL script bytes: GitHub
        # Pages can't 301-redirect a `curl … | sh` URL (a meta-refresh/JS redirect
        # would pipe HTML into sh). Fetch the source of truth — nano-workforce's
        # install.sh on main — on every deploy and write it into the artifact, so
        # the served file is DERIVED from source, never a vendored/drifting copy
        # (matches build.mjs's "generated from source on every deploy" contract).
        # Kept OUT of build.mjs so that stays network-free for the offline `schemas`
        # CI drift check. Fail the deploy rather than publish a broken/empty script.
        run: |
          set -euo pipefail
          src="https://raw.githubusercontent.com/nanobpm/nano-workforce/main/install.sh"
          out="website/_site/install.sh"
          curl -fsSL --retry 3 --retry-delay 2 -o "$out" "$src"
          head -n1 "$out" | grep -q '^#!/bin/sh' || { echo "::error::mirrored install.sh has no #!/bin/sh shebang"; exit 1; }
          bytes=$(wc -c < "$out")
          [ "$bytes" -ge 2000 ] || { echo "::error::mirrored install.sh implausibly small (${bytes} bytes)"; exit 1; }
          echo "mirrored install.sh (${bytes} bytes) from ${src}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
