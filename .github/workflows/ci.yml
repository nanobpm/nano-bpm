# Test + clippy gate. Runs on every push to main and once when a PR is opened so
# a red build is caught early. Follow-up pushes to an open PR do NOT re-run CI
# (see the `on:` block) — instead, at convergence a fresh `pull_request` run is
# produced on the head (mark a draft PR ready, or close+reopen) to satisfy the
# branch-protection required checks before merge. Each crate is independent (no
# root workspace), so it gets its own job with a scoped cache.
#
# Scope: clippy (-D warnings) + cargo test per crate, plus a formatting gate.
# Formatting uses a PINNED NIGHTLY rustfmt (see the `fmt` job and rustfmt.toml):
# the canonical style relies on unstable rustfmt options (group_imports) that
# stable `cargo fmt` silently ignores, so only the pinned nightly reproduces it.

name: CI

on:
  push:
    branches: [main]
  # Frugal PR triggers: run CI ONCE when a PR is opened (catch gross breakage
  # early, before review cycles are spent), but NOT on every follow-up push
  # (`synchronize`). Review-convergence loops push a commit per Copilot comment;
  # re-running the full per-crate suite on each round is the dominant CI-minutes
  # cost. Recommended flow: open the PR as a DRAFT (fires `opened` → one early CI
  # run), converge Copilot review (review pushes are `synchronize` → no CI), then
  # mark it READY at convergence (`gh pr ready <n>`) — `ready_for_review` fires a
  # fresh `pull_request` run on the head, and THAT is what GitHub branch
  # protection counts to allow the merge. (A close+reopen `reopened` run works
  # equally.) `opened` runs even on draft PRs (no draft guard on the jobs).
  #
  # IMPORTANT: `workflow_dispatch` runs do NOT satisfy branch-protection required
  # status checks at merge time — GitHub only counts checks produced by the PR's
  # own push/pull_request check suite. So `workflow_dispatch` (below) is only a
  # manual smoke-test lever, NOT the merge finalizer; use `ready_for_review` /
  # `reopened` to produce the head checks that actually unblock the merge.
  pull_request:
    types: [opened, reopened, ready_for_review]
  # This repo merges via Mergify (Team plan can't use GitHub's native merge queue
  # — zero `merge_group` runs in history). Mergify validates a batch on a throwaway
  # `mergify/merge-queue/*` draft PR, but the final GitHub merge of THIS PR still
  # requires the canonical branch-protection checks on this PR's head via a
  # pull_request run (see the finalizer note above) — otherwise GitHub reports
  # "N of N required status checks are expected" and Mergify dequeues after
  # retrying. `merge_group` fires only under GitHub's *native* merge queue (unused
  # here); it is retained solely to keep this workflow correct if the repo ever
  # upgrades to native — it is a no-op today.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap change-detection so the expensive per-crate jobs only run when their
  # sources actually change. A skipped required check is treated as success by
  # branch protection, so gating a job with `if:` still lets a docs/scripts-only
  # PR merge without burning a full crate build.
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      processos: ${{ steps.filter.outputs.processos }}
      console: ${{ steps.filter.outputs.console }}
      specapp: ${{ steps.filter.outputs.specapp }}
      docs: ${{ steps.filter.outputs.docs }}
      dapadapter: ${{ steps.filter.outputs.dapadapter }}
      formal: ${{ steps.filter.outputs.formal }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          # On a merge_group event the checkout HEAD is the batch branch; diff it
          # against the SHA the group was based on so detection reflects the
          # combined batch. push/PR events auto-detect their base (empty string).
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          # `some-with-excludes`: a file matches a filter only when it matches at
          # least one positive pattern AND none of the negated (`!`) patterns. The
          # other filters have no negations, so this is a no-op for them; it exists
          # for the `code` filter's exclude patterns. Requires paths-filter >= v4
          # (the v3 line only supports every/some) — pinned explicitly because the
          # floating `dorny/paths-filter@v3` tag resolves to a pre-feature SHA.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            processos:
              - 'processos/**'
              - 'engine-core/**'
              - '.github/workflows/ci.yml'
            console:
              - 'console/**'
              - 'spec-console/**'
              # The merge-gate tests compare these with CI job names.
              - 'AGENTS.md'
              - '.mergify.yml'
              # The console SPA imports spec-app's committed `dist/` (the Urban
              # App manifest types), so a spec-app change can alter the console
              # typecheck surface — re-run the console job to validate against it.
              - 'spec-app/**'
              - '.github/workflows/ci.yml'
            # The Urban App manifest schema/types package (@nanobpm/nano-app-schema).
            # Owns its own job (`spec-app`) and is deliberately excluded from the
            # `code` filter below: no Rust crate compiles against it (no Cargo dep,
            # no include_str! of the schema, no build.rs codegen), so the heavy
            # Rust/engine suite need not re-run on a spec-app-only change. The
            # `console` filter above still picks it up because the SPA imports its
            # built `dist/`.
            specapp:
              - 'spec-app/**'
              - '.github/workflows/ci.yml'
            # Documentation prose consumed only by the console docs/whitepaper
            # build (scripts/build-docs.mjs reads USERGUIDE.md + docs/*.md;
            # scripts/build-whitepaper.mjs reads docs/whitepaper.md) — NOT by any
            # Rust crate. Drives the cheap `console` job's doc-build guard so a
            # docs edit is still validated, without paying for the Rust suite.
            # Note: only `*.md` (+ USERGUIDE.md); `docs/falcon.asyncapi.yaml` is
            # `include_str!`d by server/src/falcon.rs, so it deliberately stays in
            # the `code` filter (below) to keep triggering the server build.
            docs:
              - 'docs/**/*.md'
              - 'USERGUIDE.md'
              - '.github/workflows/ci.yml'
            dapadapter:
              - 'dap-adapter/**'
              - '.github/workflows/ci.yml'
            # TLA+ models of engine semantics and the Zeebe parity coverage
            # matrix (formal/README.md). TLC needs only a JVM, and the whole suite
            # checks in seconds. The matrix cites engine-core tests and corpus
            # fixtures as evidence, so renaming one must re-run the guard.
            formal:
              - 'formal/**'
              - 'engine-core/src/**'
              - 'engine-core/tests/**'
              - 'engine-core/examples/**'
              - 'engine-core/Cargo.toml'
              - 'engine-core/Cargo.lock'
              - '.github/workflows/ci.yml'
            # True unless EVERY changed file is pure presentation/frontend — the
            # marketing website (`website/**`), the console landing page HTML
            # (embedded via `include_str!`, so its content can't break clippy or
            # any test), the console SPA (`console/**`; its built bundle is
            # rust-embedded but CI stubs `console/dist`, so the SPA source never
            # affects the Rust build/tests — the `console`/`console-e2e` jobs own
            # it), the Urban App manifest schema package (`spec-app/**`; no Rust
            # crate compiles against it — owned by the `spec-app` job, and picked
            # up by `console` for the SPA typecheck), or documentation markdown
            # (`docs/**/*.md` + `USERGUIDE.md`; owned by the `docs` filter). The
            # heavy Rust/engine/npm jobs gate on this so a website-, SPA-,
            # spec-app-, or docs-only PR skips them (a skipped required check
            # counts as success for branch protection) and still merges.
            # `spec-console/**` is intentionally NOT excluded: an API spec change
            # alters the generated Rust axum traits, so the server build must
            # re-validate that `console_api.rs` still satisfies them.
            code:
              - '**'
              - '!website/**'
              - '!server/crates/nano-server-console/src/landing.html'
              - '!console/**'
              - '!spec-app/**'
              - '!docs/**/*.md'
              - '!USERGUIDE.md'
      - name: Guard landing.html removal while still referenced by include_str!
        run: |
          set -euo pipefail
          if [ ! -f server/crates/nano-server-console/src/landing.html ] && grep -q 'include_str!("landing.html")' server/crates/nano-server-console/src/lib.rs; then
            echo '::error file=server/crates/nano-server-console/src/lib.rs::server/crates/nano-server-console/src/landing.html is missing but server/crates/nano-server-console/src/lib.rs still include_str!("landing.html").'
            exit 1
          fi
  fmt:
    name: rustfmt (pinned nightly)
    runs-on: ubuntu-24.04
    # Heavy Rust/engine/npm jobs skip when a PR only touches the marketing
    # website or the console landing page (see the `code` filter above). Manual
    # dispatch and the merge queue always run the full suite.
    needs: changes
    if: &code_gate ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v5
      # Keep this version in lockstep with FMT_TOOLCHAIN in the Makefile. The
      # canonical style uses unstable rustfmt options, so a specific nightly is
      # pinned; bump it deliberately in a single style commit.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-26
          components: rustfmt
      # server/src/stub_impls.rs is codegen (gitignored) but is a `mod` of the
      # server crate, so rustfmt needs *a* file there to resolve the module tree;
      # the generated/ + generated-console/ path-dep manifests must also exist
      # because `cargo fmt` runs `cargo metadata` over the server workspace
      # (ADR 0064). Canonical stubs suffice for a parse-only format check — no
      # need for the full Java/uv codegen the build jobs run. Shared with
      # .githooks/pre-push so the local gate and this job stay in lockstep.
      - name: Stub codegen inputs
        run: ./scripts/fmt-stub-codegen.sh
      - name: Format check
        run: make fmt-check

  engine-core:
    name: engine-core (clippy + test)
    runs-on: ubuntu-24.04
    needs: changes
    if: *code_gate
    # sccache gives a content-addressed rustc cache shared across CI runs (and
    # across the engine-core/server/processos jobs that all compile this crate as
    # a path dep). Unlike Swatinem's all-or-nothing target restore, sccache still
    # hits per-crate when a cache key is busted (e.g. the mold rustflag), so a
    # flag change no longer forces a full cold rebuild. CARGO_INCREMENTAL=0 is
    # required — incremental is incompatible with a compiler cache.
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-core
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: taiki-e/install-action@nextest
      - name: Clippy
        working-directory: engine-core
        # `--features serde` is REQUIRED, not optional: the snapshot/event serde
        # derives (`cfg_attr(feature = "serde", ...)`) — and therefore the
        # `golden_serde_drift` CI drift guard (#1069) that fingerprints them — only
        # exist under this feature. Without it the guard test compiles to nothing
        # and silently passes, letting an incompatible on-disk format ship
        # unnoticed (incident #1065). Linting `--all-targets --features serde` also
        # keeps the guard test itself under `-D warnings`. Downstream tasks
        # (#1070/#1071) reuse this job; they do not re-add the flag.
        run: cargo clippy --all-targets --features serde -- -D warnings
      - name: Test
        working-directory: engine-core
        # nextest for the unit/integration suite (process isolation,
        # consistent with the server job). nextest CANNOT run doctests, so the
        # crate's `///` examples (ProcessBuilder, parse_bpmn) run separately.
        # `--features serde` runs the snapshot/event drift guard (#1069) and the
        # serde-gated snapshot round-trip tests; see the Clippy step above for why
        # it must not be dropped.
        run: cargo nextest run --features serde
      - name: Doctests
        working-directory: engine-core
        run: cargo test --doc --features serde

  engine-wasm-ffi-dist:
    name: engine-wasm-ffi (dist + verify)
    runs-on: ubuntu-24.04
    needs: changes
    if: *code_gate
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Release-tagging script (one tag per push, derived tags, workflow drift)
        # scripts/release-tags.mjs is the canonical way to cut release tags
        # (RELEASE.md, #1289). Its tests pin the one-tag-per-push rule (GitHub
        # drops tag push events when >3 tags share one push, which silently
        # skipped every workflow at v0.0.24) and fail if a release workflow's tag
        # trigger drifts from the train table. Lives in this REQUIRED job so a
        # regression in the release tooling blocks the merge.
        run: node --test scripts/release-tags.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-core
          # Cache-key rider so this job doesn't fight the engine-core job's cache
          # (they build the same crate for different targets).
          key: wasm32
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build + verify + emit dist
        run: make engine-wasm-ffi-dist
      - name: Type-check console engine-wasm crate (wasm32)
        run: make engine-wasm-check
      - name: Bundle-split test (each subpath emits only its own _bg.wasm)
        # Guards the dual-publish acceptance criterion (#825): bundles the lean
        # (`.`) and `/readmodel` entrypoints of the committed engine-wasm/pkg and
        # asserts each module graph reaches exactly one variant's glue directory.
        # Catches regressions in pkg.package.json's `exports` map / pkg layout
        # that wasm32 type-checks can't see.
        run: npm install && npm test
        working-directory: engine-wasm/tests/bundle-split
      - name: Use-after-free DX guard (friendly "used after free()" message)
        # Freezes the DX contract (#968): a method call on a freed TestEngine
        # handle throws a self-describing "TestEngine used after free()" — not the
        # opaque wasm-bindgen "null pointer passed to rust" — for both the lean
        # (`.`) and read-model (`/readmodel`) entrypoints of the committed
        # engine-wasm/pkg. Guards the guard injected by scripts/inject-free-guard.mjs.
        run: npm install && npm test
        working-directory: engine-wasm/tests/use-after-free
      - name: Test-Studio record loop (embedded-engine isolation example)
        # Worked example + guard (nanobpm/nano-bpm example): drives a
        # Test-Studio-style recording session entirely through the committed
        # engine-wasm/pkg TestEngine, proving the embedded engine gives Camunda's
        # per-instance recording isolation (RESERVE_JOBS + stubCallActivities) for
        # free — jobs wait unraced and the debug stepper is the call-activity wait
        # state — on both the lean (`.`) and read-model (`/readmodel`) entrypoints.
        run: npm install && npm test
        working-directory: engine-wasm/tests/test-studio-record-loop
      - name: Read-model DTO types are derived, not hand-written (drift guard)
        # `@nanobpm/engine-wasm/readmodel-types` ships DTO types for the engine's
        # read-model query results (searchUserTasks, …). They are DERIVED from the
        # single source of truth — the Camunda-parity REST OpenAPI in spec/ — via
        # `@hey-api/openapi-ts`, not hand-mirrored. Regenerate and fail if the
        # committed artifact is stale (mirrors the console `src/gen` drift guard).
        run: npm ci && npm run check
        working-directory: engine-wasm/readmodel-types
      - name: Show manifest
        run: cat dist/engine-wasm-ffi/manifest.json
      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: engine-wasm-ffi
          path: dist/engine-wasm-ffi/
          if-no-files-found: error
          retention-days: 14

  engine-wasm-read-model:
    name: engine-wasm (read-model wasm32 type-check)
    runs-on: ubuntu-24.04
    needs: changes
    if: *code_gate
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-wasm
          # Cache-key rider so this job doesn't fight the feature-off wasm caches
          # (same crate, different feature set + a C toolchain build).
          key: wasm32-read-model
      - name: Install LLVM clang (wasm backend) + point cc at it
        # The off-by-default `read-model` feature compiles a trimmed SQLite C
        # amalgamation (via the `cc` crate + read-model/build.rs) to wasm32. GCC
        # and Apple clang have no wasm backend; upstream LLVM clang does. The `cc`
        # crate reads these per-target knobs to pick the compiler + archiver.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y llvm clang
          cc_bin=""
          for c in "$(command -v clang-18 || true)" "$(command -v clang || true)"; do
            if [ -n "$c" ] && "$c" --print-targets 2>/dev/null | grep -q wasm32; then cc_bin="$c"; break; fi
          done
          ar_bin="$(command -v llvm-ar-18 || command -v llvm-ar || true)"
          if [ -z "$cc_bin" ]; then
            echo "::error::no LLVM clang with a wasm32 backend found after 'apt-get install llvm clang'"; exit 1
          fi
          if [ -z "$ar_bin" ]; then
            echo "::error::could not locate llvm-ar after 'apt-get install llvm clang'"; exit 1
          fi
          echo "CC_wasm32_unknown_unknown=$cc_bin" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$ar_bin" >> "$GITHUB_ENV"
      - name: Type-check engine-wasm --features read-model (wasm32)
        run: make engine-wasm-check-read-model

  nano-bernd-npm:
    # Leading @ is reserved for Mergify's @github-app/check syntax.
    name: 'nano-bernd (build + test)'
    runs-on: ubuntu-24.04
    needs: [engine-wasm-ffi-dist, changes]
    if: *code_gate
    defaults:
      run:
        working-directory: clients/nano-bernd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Download engine-wasm-ffi artifact
        uses: actions/download-artifact@v7
        with:
          name: engine-wasm-ffi
          path: dist/engine-wasm-ffi/
      - name: Install
        run: npm install
      - name: Sync wasm from dist
        run: npm run sync-wasm
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  engine-testkit-npm:
    name: '@nanobpm/engine-testkit (build + test)'
    runs-on: ubuntu-24.04
    needs: [changes]
    if: *code_gate
    defaults:
      run:
        working-directory: clients/engine-testkit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  nano-bernd-jvm:
    name: 'io.github.jwulf:nano-bernd (JVM, Chicory)'
    runs-on: ubuntu-24.04
    needs: [engine-wasm-ffi-dist, changes]
    if: *code_gate
    defaults:
      run:
        working-directory: clients/nano-bernd-jvm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Download engine-wasm-ffi artifact
        uses: actions/download-artifact@v7
        with:
          name: engine-wasm-ffi
          path: dist/engine-wasm-ffi/
      - name: Sync wasm into resources
        run: bash scripts/sync-wasm.sh
      - name: Verify + test
        run: mvn --batch-mode --no-transfer-progress verify

  ai-assert-npm:
    name: '@nanobpm/ai-assert (build + test)'
    runs-on: ubuntu-24.04
    needs: [changes]
    if: *code_gate
    defaults:
      run:
        working-directory: clients/ai-assert
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  spec-app:
    name: spec-app (Urban App manifest)
    runs-on: ubuntu-24.04
    needs: changes
    # Gated on its own `specapp` filter, not `*code_gate`: no Rust crate compiles
    # against this package, so a spec-app-only change runs this job (which owns
    # its validation) without the heavy Rust suite, and a Rust-only change no
    # longer spins up this Node lane.
    if: ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.specapp == 'true' }}
    defaults:
      run:
        working-directory: spec-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # test:unit runs `node --test` importing the `.ts` source directly, so
          # this job needs a Node with TypeScript type-stripping on by default
          # (>= 23.6 / current LTS). The other jobs stay on 20 (they use built JS).
          node-version: '24'
      - name: Install (locked)
        # `npm ci` pins the exact dep versions from package-lock.json so the
        # esbuild bundle CI rebuilds is byte-identical to the committed one.
        run: npm ci
      - name: Test (validate + gen --check + typecheck + unit)
        run: npm test
      - name: Rebuild committed dist/ artifact
        # spec-app/dist (bundled ESM + flattened .d.ts) is committed and imported
        # by the web console. It is a build artifact, so it can drift if src/ is
        # edited without a rebuild. Rebuild it here...
        run: npm run build
      - name: Fail if dist/ is stale
        # ...and fail the build if the committed artifact doesn't match a fresh
        # build (the maker forgot `npm run build` / `make generate-app-manifest`).
        run: git diff --exit-code -- dist

  schemas:
    name: schemas (nanobpm.io publish build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # website/build.mjs imports the .ts moddle descriptor directly, so it
          # needs a Node with TypeScript type-stripping on by default (>= 23.6).
          node-version: '24'
      - name: Build publish site and test install copy controls
        # Zero-dep build: fails if any tracked file still references the legacy
        # schema domain, or if a published $id/uri no longer resolves to
        # nanobpm.io. This is the same build pages.yml deploys on merge, so a
        # green PR here guarantees the site publishes cleanly. The integration
        # test runs that build once before checking the published controls.
        run: node --test website/install-copy.test.mjs
      - name: Fail if the console landscape artifact is stale
        # website/build.mjs also renders the shared landscape table into
        # server/crates/nano-server-console/src/landscape.gen.html (single source of truth for both
        # /architecture#landscape and the console /stack page). Fail if the
        # committed artifact doesn't match a fresh render (the maker edited
        # website/data/landscape.json but forgot `node website/build.mjs`).
        run: git diff --exit-code -- server/crates/nano-server-console/src/landscape.gen.html

  website-snippet:
    name: website snippet (typecheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Typecheck landing-hero snippet against published @nanobpm/workflow
        # The landing hero (website/build.mjs) renders the `hero` region of
        # website/snippets/hero-pr-review.ts VERBATIM. This job compiles that
        # snippet against the published @nanobpm/workflow so the marketing
        # example can never drift from the real defineFlow API.
        run: npm ci && npm run typecheck
        working-directory: website/snippets

  dap-adapter:
    name: dap-adapter (typecheck + test)
    runs-on: ubuntu-24.04
    # Change-gated: only run when the adapter (or this workflow) changes. A
    # skipped required check counts as success for branch protection (see the
    # `changes` job), so unrelated PRs don't pay for a Node install + wasm run.
    needs: changes
    if: ${{ github.event_name == 'merge_group' || needs.changes.outputs.dapadapter == 'true' }}
    defaults:
      run:
        working-directory: dap-adapter
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install (locked)
        # The adapter depends on @nanobpm/engine-wasm via a committed file: path
        # (engine-wasm/pkg), so no artifact download is needed — npm ci resolves
        # it from the tree.
        run: npm ci
      - name: Typecheck (src + tests)
        run: npm run typecheck
      - name: 'Test (vitest: source map unit + headless DAP e2e)'
        run: npm test

  formal:
    name: formal (tlc)
    runs-on: ubuntu-24.04
    # Model-checks the TLA+ specs in formal/tla against the expected outcome per
    # model recorded in formal/tla/check.sh. That includes known-defect
    # ratchets, which fail once the defect stops reproducing. Also guards the
    # Zeebe parity coverage matrix in formal/parity (#1245).
    needs: changes
    if: ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.formal == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve pinned TLC version
        id: tla
        run: echo "version=$(sed -n 's/^TLA_VERSION="\(.*\)"$/\1/p' formal/tla/check.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/nanobpm-formal
          key: tla2tools-${{ steps.tla.outputs.version }}
      - name: Model-check
        run: formal/tla/check.sh
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/nanobpm-parity
          key: zeebe-${{ hashFiles('formal/parity/zeebe-pin.json') }}
      - name: Parity matrix is derived from the pinned Zeebe
        run: |
          # The derived artifacts must be committed: extraction would recreate a
          # deleted surface as an untracked file, which `git diff` cannot see.
          git ls-files --error-unmatch formal/parity/zeebe-surface.json formal/parity/gaps.json
          node formal/parity/extract.mjs "$(formal/parity/fetch-zeebe.sh)"
          git diff --exit-code -- formal/parity/zeebe-surface.json
      - name: Parity matrix tests
        run: node --test formal/parity/*.test.mjs
      - name: Trace parser tests
        run: node --test formal/tla/trace/*.test.mjs
      - name: Parity coverage guard
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          # The gap baseline may only shrink: compare it with the target
          # branch's copy (absent until the matrix first lands there).
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git cat-file -e FETCH_HEAD:formal/parity/gaps.json 2>/dev/null; then
            git show FETCH_HEAD:formal/parity/gaps.json > "$RUNNER_TEMP/base-gaps.json"
            node formal/parity/check.mjs --base-gaps "$RUNNER_TEMP/base-gaps.json"
          else
            echo "::notice::no formal/parity/gaps.json on $BASE_REF yet; baseline growth not checked"
            node formal/parity/check.mjs
          fi

      # Lean 4 formal layer (formal/lean): builds every Lean target and runs the
      # FEEL differential fuzz — the Lean reference semantics (formal/lean/Feel)
      # vs. the Rust evaluator (engine-core/src/feel). A divergence fails hard;
      # there is no tolerated mismatch and no retry.
      - name: Install Lean (elan)
        run: |
          # Pin the elan installer to a specific commit (v4.2.4) and verify its
          # SHA-256 before executing it — never pipe an unpinned `master` script
          # straight into a shell on CI.
          ELAN_INIT_SHA256=a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          echo "${ELAN_INIT_SHA256}  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          # elan installs the toolchain pinned in formal/lean/lean-toolchain on
          # first `lake` invocation; cache it plus the Lake build outputs. Key on
          # lake-manifest.json too so a resolved-dependency change busts the cache.
          path: |
            ~/.elan
            formal/lean/.lake
          key: lean-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/lakefile.lean', 'formal/lean/lake-manifest.json') }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Lean build + FEEL differential fuzz
        run: formal/lean/feel-diff.sh

  processos:
    name: processos (clippy + test)
    runs-on: ubuntu-24.04
    # processos compiles engine-core as a path dep, so it must re-run when either
    # crate changes (or when this workflow changes). It still pulls a large Rust
    # dep tree (DuckDB/arrow), so skipping it on unrelated PRs — docs, scripts,
    # other crates — remains a worthwhile CI-minute saver.
    needs: changes
    # In the merge queue, ALWAYS run (a batch may combine PRs touching processos
    # even when change-detection's per-event base misses it): a skipped required
    # check counts as passing, which must never hide an unvalidated change at the
    # final gate. PR/push runs keep the change-detection minute-saving, which is
    # where the bulk of runs happen.
    if: ${{ github.event_name == 'merge_group' || needs.changes.outputs.processos == 'true' }}
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
      CARGO_INCREMENTAL: '0'
      # Link a PREBUILT DuckDB instead of compiling the bundled C++ amalgamation
      # from source (~20 min cold, ~590 translation units). libduckdb-sys downloads
      # the DuckDB release matching its crate version and uses pregenerated bindings
      # (no libclang needed), so this job no longer needs the disk-reclaim + bespoke
      # sccache-for-DuckDB machinery it used to. The clippy/test steps build
      # `--no-default-features` so `duckdb/bundled` is off; release binaries keep the
      # default `duckdb-bundled` feature and stay self-contained (see
      # publish-processos-binaries.yml + processos/Cargo.toml).
      DUCKDB_DOWNLOAD_LIB: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: processos
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: taiki-e/install-action@nextest
      # rust-cache prunes the prebuilt DuckDB that libduckdb-sys downloads into
      # target/duckdb-download/ (it is not a recognised cargo artifact) but keeps
      # the build-script fingerprint + its cached rustc-link-search output. On a
      # cache hit cargo then skips build.rs, never re-downloads the lib, and the
      # recorded -L path is empty => `mold: library not found: duckdb` at link
      # time (Clippy passes since it doesn't link; the Test step is the first to
      # link, so it's where it fails). Invalidate just the libduckdb-sys
      # build-script fingerprint so it re-runs and re-materialises the lib during
      # Clippy; the heavy compiled rlibs stay cached.
      - name: Re-materialise the prebuilt DuckDB lib (rust-cache prunes it)
        working-directory: processos
        run: rm -rf target/*/.fingerprint/libduckdb-sys-* target/*/build/libduckdb-sys-*
      - name: Clippy
        working-directory: processos
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: Test
        working-directory: processos
        # processos is a binary crate (no lib target) => no doctests, so nextest
        # loses no coverage and gains process isolation.
        run: cargo nextest run --no-default-features

  server:
    name: server (clippy + test)
    runs-on: ubuntu-24.04
    needs: changes
    if: *code_gate
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: 'sccache'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: astral-sh/setup-uv@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: taiki-e/install-action@nextest
      - name: Generate REST layer + stub impls
        # The server depends on the path crate ../generated and on
        # server/src/stub_impls.rs, both produced by codegen (gitignored). Mirror
        # the release `prepare` job's codegen (Java + uv); no Node/wasm needed.
        run: |
          set -euo pipefail
          uv sync
          make generate
      - name: Stub console assets
        # The `console` feature embeds ../console/dist via rust-embed, but that
        # built frontend is gitignored. A stub satisfies the proc-macro so the
        # gate can clippy/test the console code without a full npm build.
        run: mkdir -p console/dist && printf '<!doctype html>\n' > console/dist/index.html
      - name: Clippy
        working-directory: server
        # `--workspace` covers the extracted member crates (ADR 0064: e.g.
        # crates/nano-server-storage); `console` is a feature of the bin
        # package, so with `--workspace` it must be package-scoped.
        run: cargo clippy --workspace --all-targets --features nanobpm-gateway-rest-server/console -- -D warnings
      - name: Test
        working-directory: server
        # Run with nextest so the heavy, timing-sensitive integration tests
        # (`clustered_startup_tests` spin up multi-node Raft clusters on a
        # worker_threads=4 runtime; `seglog::tests` — now in the
        # nano-server-storage lib test binary — drive snapshot+tail recovery)
        # run in a single-threaded group that reserves the whole test-thread
        # pool — see .config/nextest.toml. This eliminates the cross-test CPU
        # oversubscription that starved these timing-sensitive tests, so they run
        # under the same uncontended conditions as locally. No retries: tests
        # must pass on the first run; the whole suite stays strict and, apart
        # from these serial-heavy tests, parallel.
        # (The moved modules carry no doctests, so nextest — which cannot run
        # doctests — covers the whole workspace suite.)
        run: cargo nextest run --workspace --features nanobpm-gateway-rest-server/console
  console:
    name: console (typecheck + test)
    runs-on: ubuntu-24.04
    needs: changes
    # Runs on SPA/spec changes (`console` filter) and on documentation-prose
    # changes (`docs` filter) so the doc-build guard still validates a docs edit.
    # NOT on `*code_gate`: a Rust-only change no longer needs the Node console
    # lane, and a pure SPA/docs change no longer needs the Rust suite.
    if: ${{ github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.console == 'true' || needs.changes.outputs.docs == 'true' }}
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # `npm test` runs `node --test` over the `.ts` unit tests directly, so
          # this job needs a Node with TypeScript type-stripping on by default
          # (>= 23.6). Matches the spec-app job.
          node-version: '24'
      - name: Install (locked)
        run: npm ci
      - name: Format check (prettier)
        # Fails if any app source (src/**/*.{ts,tsx,css}) isn't Prettier-clean.
        # Fix locally with `npm run format`. Generated code (src/gen, src/wasm)
        # and build output are excluded via .prettierignore.
        run: npm run format:check
      - name: Typecheck (regen API client + app + tests)
        # `typecheck` runs `gen:api` (regenerating src/gen from the console spec),
        # then type-checks the browser app (tsconfig.json) and the node-runtime
        # unit tests (tsconfig.test.json) separately.
        run: npm run typecheck
      - name: Fail if generated API client is stale
        # `typecheck` regenerated src/gen in place; fail if the committed client
        # drifted from spec-console/console-api.yaml (the maker forgot `npm run
        # gen:api`). src/gen is committed and imported directly by the SPA.
        run: git diff --exit-code -- src/gen
      - name: Test (node:test unit tests)
        run: npm test
      - name: Build bundled docs (guard)
        # Fail PR-time if USERGUIDE.md, any docs/*.md guide, or docs/whitepaper.md
        # breaks the generators that feed both the in-app pages and nanobpm.io,
        # rather than discovering it only at Pages-deploy time. Exercise BOTH docs
        # variants: the default in-app build and the DOCS_SITE_BUILD=1 path
        # pages.yml uses to publish (it omits app-only top-bar links), so neither
        # can silently break the deploy after merge. The whitepaper build is the
        # only PR-time guard on docs/whitepaper.md (these docs-prose changes now
        # gate this job via the `docs` filter, not the Rust suite).
        run: |
          node scripts/build-docs.mjs
          DOCS_SITE_BUILD=1 node scripts/build-docs.mjs
          node scripts/build-whitepaper.mjs

  console-e2e:
    name: console (journey e2e)
    # Browser guards for the guided journeys (ADR 0049, #417): they catch anchor
    # rot, which no other gate can see — nothing in a build or unit test fails when
    # a `data-tour` attribute is renamed. Change-gated on the console so unrelated
    # PRs never pay for a browser download; a skipped required check counts as
    # success for branch protection (see the `changes` job).
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install (locked)
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the resolved @playwright/test version so a bump refetches.
          key: playwright-${{ runner.os }}-${{ hashFiles('console/package-lock.json') }}
      - name: Install Chromium
        # Only chromium: the suite asserts DOM structure and app behaviour, not
        # cross-browser rendering, so more engines would triple the run for nothing.
        run: npx playwright install --with-deps chromium
      - name: Journey e2e
        run: npm run test:e2e
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: console/test-results/
          retention-days: 7

  console-deno:
    name: console (deno typecheck + test)
    runs-on: ubuntu-24.04
    needs: changes
    if: *code_gate
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck + unit-test the server console TS (ADR 0040)
        # server/crates/nano-server-console/src/*.ts is the JS half of the console gateway — the fuse
        # composition algebra (`resolveShapes`), the typed model-metadata accessor
        # (`emitMeta`), and the structured Fused Domain Model emitter
        # (`emitDomainModelJson`) — embedded into the Rust binary via `include_str!`
        # and run under Deno/Node at runtime. The `server` job only exercises it
        # end-to-end through slow integration tests; this gate type-checks it and
        # runs the fast pure-function unit tests directly. `deno test` type-checks
        # its whole import graph by default, so this also guards `domain_types.ts`
        # (imported by the `*_test.ts` files). The materialisation entrypoint
        # `data_cli.ts` is intentionally excluded: it imports the SDK's hyphenated
        # emit-time filenames (`./domain-types.ts`) that only exist post-render, so
        # it is not type-checkable in-tree and no test imports it.
        run: deno test --allow-read --allow-write --allow-env server/crates/nano-server-console/src/


  engine-wasm-release-guard:
    name: engine-wasm (release drift guard)
    runs-on: ubuntu-24.04
    needs: changes
    if: *code_gate
    steps:
      # Full history + tags: the guard compares the current tree against the last
      # published engine-wasm release tag (`bojtos-npm-v*`).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Pin Node so the `node -p` version reads below don't depend on whatever the
      # runner happens to preinstall — matches the rest of this workflow.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Require a pending engine-wasm bump when the engine has changed
        # Mode-1 (staleness) guard. @nanobpm/engine-wasm is a wasm build of
        # engine-core, published only on a hand-pushed `bojtos-npm-v*` tag — so an
        # engine-core change can silently ship without the wasm ever being
        # rebuilt/republished (exactly what happened at v0.0.12: engine moved
        # across 5 PRs but @nanobpm/engine-wasm stayed at 0.3.0). This fails the
        # build if `engine-core/**`, `engine-wasm/src/**` or the version template
        # changed since the last release tag but the version wasn't bumped past it
        # — i.e. an UNRELEASED bump must always be pending once the engine moves.
        # The Mode-2 (surface-gap) guard is separate and structural: an exhaustive
        # `match` in engine-wasm/src/surface_parity.rs that fails the wasm32
        # type-check (engine-wasm-ffi job) when a new engine `Command` lands
        # without a decision about surfacing it.
        run: |
          set -euo pipefail
          last_tag=$(git tag -l 'bojtos-npm-v*' --sort=-v:refname | head -1)
          if [ -z "$last_tag" ]; then
            echo "no bojtos-npm-v* tag yet — nothing to compare against"; exit 0
          fi
          last_ver=${last_tag#bojtos-npm-v}
          tmpl_ver=$(node -p "require('./engine-wasm/pkg.package.json').version")
          pkg_ver=$(node -p "require('./engine-wasm/pkg/package.json').version")

          # The committed artifact version must track the template (source of truth).
          if [ "$tmpl_ver" != "$pkg_ver" ]; then
            echo "::error file=engine-wasm/pkg/package.json::engine-wasm/pkg.package.json is $tmpl_ver but engine-wasm/pkg/package.json is $pkg_ver — run 'make console-wasm' to resync the built artifact."
            exit 1
          fi

          # Has the wasm-relevant source moved since the last release? Cargo.toml
          # / Cargo.lock are inputs too: a dependency or feature change alters the
          # produced wasm without touching engine-core or engine-wasm/src.
          if git diff --quiet "$last_tag" -- engine-core engine-wasm/src engine-wasm/Cargo.toml engine-wasm/Cargo.lock engine-wasm/pkg.package.json; then
            echo "engine-wasm inputs unchanged since $last_tag (v$last_ver) — ok"
            exit 0
          fi

          # It moved → require an unreleased bump: pkg_ver must be strictly > last_ver.
          if [ "$pkg_ver" = "$last_ver" ] || \
             [ "$(printf '%s\n%s\n' "$last_ver" "$pkg_ver" | sort -V | tail -1)" != "$pkg_ver" ]; then
            echo "::error file=engine-wasm/pkg.package.json::engine-core/engine-wasm changed since $last_tag but @nanobpm/engine-wasm is still $pkg_ver. Bump engine-wasm/pkg.package.json (then 'make console-wasm') so a new release is pending; it publishes when you push bojtos-npm-v<version> ('make release-engine-wasm')."
            exit 1
          fi
          echo "pending engine-wasm release $pkg_ver > last published $last_ver — ok"
