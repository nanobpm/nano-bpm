name: release-bojtos-npm

# Triggered by tags of the form `bojtos-npm-v0.1.0`. Builds & publishes the
# @nanobpm/engine-wasm package (the wasm-pack build of the Rust in-browser
# engine) to the npm registry.
#
# The Bojtos framework packages that consume it — @nanobpm/bojtos-kit and
# @nanobpm/bojtos-react — were extracted to their own repo (nanobpm/bojtos) and
# are published from there; only engine-wasm, whose source lives here, is
# published by this workflow.
#
# Authentication is npm OIDC trusted publishing — NO NPM_TOKEN. engine-wasm
# must have a Trusted Publisher configured on npmjs.com pointing at this repo +
# this workflow file (see docs/releasing-bojtos-npm.md). The very first publish
# was done locally by a maintainer (it created the package so the Trusted
# Publisher could be configured); thereafter this workflow publishes on tag.
#
# Note: npm provenance is intentionally disabled (NPM_CONFIG_PROVENANCE=false) —
# provenance requires a public source repository, and nano-bpm is private.

on:
  push:
    tags:
      - 'bojtos-npm-v*'
  workflow_dispatch: {}

jobs:
  publish:
    name: Publish engine-wasm
    runs-on: ubuntu-24.04
    permissions:
      # id-token: write is what lets npm exchange the GitHub OIDC token for a
      # short-lived publish token (trusted publishing).
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm OIDC trusted publishing needs npm CLI >= 11.5.1; the bundled npm may
      # be older, so pin a known-good version (kept explicit for reproducible
      # release builds rather than tracking @latest).
      - name: Upgrade npm (OIDC-capable)
        run: npm install -g npm@11.5.1

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      # Build the in-browser engine wasm from source so the published
      # @nanobpm/engine-wasm tarball is provably built from the tag. The same
      # composite action CI uses (pinned toolchain, LLVM via
      # scripts/wasm-cc-env.sh, pinned wasm-pack, `make console-wasm`).
      - name: Build engine-wasm (make console-wasm)
        uses: ./.github/actions/engine-wasm-pkg
        with:
          # A release build starts cold rather than from a PR-populated cache.
          rust-cache: 'false'

      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#bojtos-npm-v}"
          pkg_version=$(node -p "require('./engine-wasm/pkg/package.json').version")
          if [[ "$pkg_version" != "$tag_version" ]]; then
            echo "::error::tag $tag_version does not match engine-wasm/pkg version $pkg_version"
            exit 1
          fi
          echo "releasing @nanobpm/engine-wasm $tag_version"

      - name: Publish (OIDC)
        env:
          NPM_CONFIG_PROVENANCE: 'false'
        run: node scripts/bojtos-release.mjs
