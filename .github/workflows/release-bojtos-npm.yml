name: release-bojtos-npm

# Publishes @nanobpm/engine-wasm (the wasm-pack build of the Rust in-browser
# engine) to the npm registry from every gateway release tag `vX.Y.Z` (#1871).
#
# One engine version: `server vX.Y.Z` <=> `@nanobpm/engine-wasm X.Y.Z`. The
# package version is not kept anywhere of its own — `make console-wasm`
# stamps it from server/Cargo.toml (engine-wasm/scripts/stamp-pkg.mjs), the
# same source scripts/release-tags.mjs derives the `v*` tag from, and records
# the build commit in build-info.json. So the engine a server runs, the engine
# its console embeds, and the npm package downstream apps test against are the
# same commit and the same version. (The separate `bojtos-npm-v*` train is
# retired; its last tag was bojtos-npm-v0.11.2.)
#
# The filename is kept: it is the Trusted Publisher configured on npmjs.com.
#
# The Bojtos framework packages that consume it — @nanobpm/bojtos-kit and
# @nanobpm/bojtos-react — were extracted to their own repo (nanobpm/bojtos) and
# are published from there; only engine-wasm, whose source lives here, is
# published by this workflow.
#
# Authentication is npm OIDC trusted publishing — NO NPM_TOKEN. engine-wasm
# must have a Trusted Publisher configured on npmjs.com pointing at this repo +
# this workflow file (see docs/releasing-bojtos-npm.md).
#
# Note: npm provenance is intentionally disabled (NPM_CONFIG_PROVENANCE=false) —
# provenance requires a public source repository, and nano-bpm is private.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish engine-wasm
    runs-on: ubuntu-24.04
    permissions:
      # id-token: write is what lets npm exchange the GitHub OIDC token for a
      # short-lived publish token (trusted publishing).
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Only a main-reachable release tag may publish (#1830).
      - uses: ./.github/actions/assert-release-ref
        with:
          tag-pattern: '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm OIDC trusted publishing needs npm CLI >= 11.5.1; the bundled npm may
      # be older, so pin a known-good version (kept explicit for reproducible
      # release builds rather than tracking @latest).
      - name: Upgrade npm (OIDC-capable)
        run: npm install -g npm@11.5.1

      - name: Install binaryen (wasm-opt)
        uses: ./.github/actions/build-tools
        with:
          binaryen: 'true'

      # Build the in-browser engine wasm from source so the published
      # @nanobpm/engine-wasm tarball is provably built from the tag. The same
      # composite action CI uses (pinned toolchain, LLVM via
      # scripts/wasm-cc-env.sh, pinned wasm-pack, `make console-wasm`).
      - name: Build engine-wasm (make console-wasm)
        uses: ./.github/actions/engine-wasm-pkg
        with:
          # A release build starts cold rather than from a PR-populated cache.
          rust-cache: 'false'

      - name: Verify tag, package version and build commit match the server
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./engine-wasm/pkg/package.json').version")
          if [[ "$pkg_version" != "$tag_version" ]]; then
            echo "::error::tag $tag_version does not match engine-wasm/pkg version $pkg_version"
            exit 1
          fi
          # Same version AND same commit as the server this tag releases (#1871).
          node scripts/engine-parity.mjs engine-wasm/pkg/build-info.json --commit "$GITHUB_SHA"
          echo "releasing @nanobpm/engine-wasm $tag_version"

      - name: Publish (OIDC)
        env:
          NPM_CONFIG_PROVENANCE: 'false'
        # Explicit `--tag latest`: the gateway-versioned scheme (#1871) resets
        # the version below the old independent 0.11.x line, and npm >= 11
        # refuses an *implicit* `latest` on a lower version.
        run: node scripts/bojtos-release.mjs --tag latest
