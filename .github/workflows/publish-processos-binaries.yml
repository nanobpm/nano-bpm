# Cross-compiles ProcessOS for all five targets and attaches them to the GitHub
# Release for the pushed tag IN THIS (private) repo — so ProcessOS binaries are
# distributed to people with access to jwulf/nano-bpm and are NEVER exposed on
# the public plugin repo (jwulf/c8ctl-plugin-nano) the gateway publishes to.
#
# Why a separate workflow from publish-c8ctl-binaries.yml
# -------------------------------------------------------
# * Different artifact (`processos`, not the gateway server) and different
#   destination (this private repo's releases, not the public plugin repo).
# * ProcessOS needs no codegen/console `prepare` step: it depends only on the
#   in-tree `engine-core` path crate and single-sources its User Guide from its
#   own committed `processos/USERGUIDE.md` at build time. So the matrix legs
#   only need Rust (plus a C/C++ cross toolchain for the bundled DuckDB).
#
# Why a C++ cross toolchain
# -------------------------
# ProcessOS embeds DuckDB with the `bundled` feature, which compiles DuckDB's
# C++ amalgamation. Native legs use the host compiler; the linux arm64 cross leg
# needs `g++-aarch64-linux-gnu` and links through it so libstdc++ resolves.
#
# Auth: uses the default GITHUB_TOKEN (contents: write on this repo) — no PAT.
#
# S3 mirror
# ---------
# The `publish` job also mirrors the binaries to a public S3 bucket so they can
# be fetched over plain HTTPS without a GitHub token. Set two repo secrets:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  (an IAM key that can s3:PutObject
#   on the bucket). Tag pushes upload an immutable per-version copy to
# s3://sitapati-storage/processos/<tag>/ AND refresh the rolling
# s3://sitapati-storage/processos/latest/ pointer; manual runs refresh `latest/`
# only. The step is skipped (not failed) when the credentials are absent.
#
# The bucket is "Bucket owner enforced" (ACLs disabled), so objects are NOT
# uploaded with a per-object ACL — public read is granted by the bucket policy
# instead. Do not re-add `--acl public-read` or it fails AccessControlListNotSupported.

name: Publish ProcessOS binaries

on:
  push:
    tags: ['v*']          # cut ProcessOS binaries on each tagged nanobpmn release
  workflow_dispatch:

concurrency:
  group: publish-processos-binaries
  cancel-in-progress: false

permissions:
  contents: write          # create/upload releases on this private repo

env:
  BIN_NAME: processos

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            asset: processos-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            asset: processos-darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            asset: processos-linux-x64
          # The linux-arm64 leg cross-compiles, so it needs a matching C++
          # toolchain for the bundled DuckDB amalgamation (apt) and links
          # through it (linker) so libstdc++ resolves.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            asset: processos-linux-arm64
            apt: g++-aarch64-linux-gnu
            linker: aarch64-linux-gnu-g++
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            asset: processos-win32-x64.exe
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: processos

      - name: Install cross C/C++ toolchain (linux arm64)
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Install mold linker (linux x64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y mold

      # DuckDB (libduckdb-sys) compiles a large amount of C++; a cold build can
      # exhaust the runner's root disk. Reclaim space on the Linux legs.
      - name: Free disk space (linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Build ProcessOS (release, cross-target)
        shell: bash
        working-directory: processos
        env:
          # Link through the matching cross g++ so the bundled DuckDB's C++
          # runtime (libstdc++) resolves; ignored when unset (native legs).
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
          # Stamp the binary's reported version from the tag (build.rs strips the
          # leading `v`). Empty on manual runs -> build.rs falls back to git/Cargo.
          PROCESSOS_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          cargo build --release --target "${{ matrix.target }}" --bin "$BIN_NAME"

      - name: Stage asset
        shell: bash
        run: |
          set -euo pipefail
          src="processos/target/${{ matrix.target }}/release/${BIN_NAME}"
          if [ -f "${src}.exe" ]; then
            src="${src}.exe"
          fi
          mkdir -p dist
          cp "$src" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 1

  publish:
    name: Attach binaries to the release
    needs: build
    runs-on: ubuntu-24.04
    # Job-level so the S3 step's `if:` skip-guard can see whether the credential
    # is configured (step-level env is NOT in scope for that step's own `if:`).
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: sitapati-storage
    steps:
      - uses: actions/checkout@v5

      - name: Download built binaries
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: processos-*
          merge-multiple: true

      # Attach to the release for the pushed tag (created if absent) in THIS
      # private repo. A manual `workflow_dispatch` run (no tag) falls back to a
      # rolling `processos-binaries` prerelease so the build is still useful.
      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            rel="${GITHUB_REF_NAME}"
            gh release view "$rel" >/dev/null 2>&1 || \
              gh release create "$rel" \
                --title "$rel" \
                --notes "ProcessOS binaries for $rel (private — Nano BPM access only)." \
                --verify-tag
          else
            rel="processos-binaries"
            gh release view "$rel" >/dev/null 2>&1 || \
              gh release create "$rel" \
                --title "ProcessOS binaries (rolling)" \
                --notes "Prebuilt ProcessOS binaries from manual runs. Auto-updated." \
                --latest=false \
                --prerelease
          fi
          gh release upload "$rel" dist/* --clobber

      # Mirror the same binaries to S3 so they're fetchable without a GitHub
      # token. Tag pushes publish an immutable per-version copy under
      # `processos/<tag>/` AND refresh the rolling `processos/latest/` pointer;
      # a manual `workflow_dispatch` run only refreshes `latest/`. The bucket is
      # ACL-disabled (Bucket owner enforced); public read comes from the bucket
      # policy, so no per-object ACL is set here. The step is skipped (not
      # failed) when the AWS credentials are absent so credential-less runs pass.
      - name: Mirror binaries to S3
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        run: |
          set -euo pipefail
          upload_to() {
            # $1 = s3 key prefix (e.g. processos/v0.0.2 or processos/latest)
            for f in dist/*; do
              name="$(basename "$f")"
              echo "↑ s3://${S3_BUCKET}/$1/${name}"
              aws s3 cp "$f" "s3://${S3_BUCKET}/$1/${name}" \
                --no-progress \
                --content-type application/octet-stream \
                --cache-control "public, max-age=300"
            done
          }
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            upload_to "processos/${GITHUB_REF_NAME}"
          fi
          upload_to "processos/latest"

      # Publish a small version.json next to the binaries so clients (the
      # c8ctl-plugin-nano update notifier) can learn the latest published
      # version without a GitHub token. Only tag pushes carry a real version, so
      # this writes the per-tag copy AND refreshes processos/latest/version.json;
      # manual runs (no tag) skip it and leave the existing pointer untouched.
      - name: Publish version.json to S3
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          assets="$(cd dist && ls | sed 's/.*/"&"/' | paste -sd, -)"
          cat > version.json <<JSON
          {
            "version": "${version}",
            "tag": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "updated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "assets": [${assets}]
          }
          JSON
          echo "version.json:"; cat version.json
          for prefix in "processos/${GITHUB_REF_NAME}" "processos/latest"; do
            echo "↑ s3://${S3_BUCKET}/${prefix}/version.json"
            aws s3 cp version.json "s3://${S3_BUCKET}/${prefix}/version.json" \
              --no-progress \
              --content-type application/json \
              --cache-control "public, max-age=300"
          done
