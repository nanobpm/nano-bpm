name: openapi-generator JAR (pinned, cached)
description: >-
  Restore the pinned openapi-generator-cli JAR into build/tools from the
  actions cache. An uncached Maven Central download (404 for ~100 s) failed
  `server (clippy + test)` on a PR whose code was fine (#1684). The key hashes
  scripts/lib-openapi-generator.sh, which carries the pinned version and its
  SHA-256, so a pin bump busts the cache; the script re-verifies the SHA-256 on
  every cache hit. Every job that runs `make generate`, `scripts/generate.sh`
  or `scripts/generate-console.sh` must use this action
  (scripts/release-download-cache.test.mjs).
runs:
  using: composite
  steps:
    - name: Cache the openapi-generator-cli JAR
      uses: actions/cache@v4
      with:
        path: build/tools/openapi-generator-cli-*.jar
        key: openapi-generator-jar-v1-${{ hashFiles('scripts/lib-openapi-generator.sh') }}
