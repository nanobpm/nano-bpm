name: sccache (fail-open)
description: >-
  Install sccache and enable it as RUSTC_WRAPPER only if its server starts.
  A cache-backend outage degrades to an uncached build with a warning instead
  of failing the job (#1325). The single place CI wires sccache; guarded by
  scripts/sccache-fail-open.test.mjs.
runs:
  using: composite
  steps:
    # Fail-open install: a download/API failure here must not fail the job;
    # start.sh then finds no sccache and falls back to plain rustc.
    # disable_annotations skips the upstream post step, whose `sccache
    # --show-stats` would hit an unavailable backend again and could fail the
    # job after start.sh already fell back. start.sh is the sole fail-open
    # boundary.
    - uses: mozilla-actions/sccache-action@v0.0.10
      continue-on-error: true
      with:
        disable_annotations: 'true'
    - name: Start sccache (fall back to plain rustc if unavailable)
      shell: bash
      run: '"$GITHUB_ACTION_PATH/start.sh"'
