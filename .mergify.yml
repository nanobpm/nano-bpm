# Mergify merge queue for `main`.
#
# Why Mergify instead of GitHub's native merge queue: native merge queue is
# Enterprise-Cloud-only for private repos, so this Team-plan repo can't require
# it. Mergify is a GitHub App that gives us the same "always-green main" queue
# plus BATCHING — the CI-minutes lever native Team can't offer.
#
# Behaviour: AUTO-MERGE IS OFF. PRs are NOT merged automatically when their
# checks go green. Merging is a deliberate act — a human or agent either clicks
# "Merge" in the GitHub UI (allowed once the required CI checks pass) or, to get
# the always-green rebase-and-retest guarantee, explicitly enqueues the PR with
# a `@mergifyio queue` comment. The queue itself is unchanged (serial, batched,
# squash, rebases each PR on the real up-to-date `main` and validates it there);
# it just no longer auto-enqueues every green PR. See the note above
# `merge_protections` below (there is deliberately no `auto_merge_conditions`).
#
# CI-minutes posture (deliberately frugal):
#   * mode: serial + max_parallel_checks: 1  -> NO speculative parallel checks
#     (speculative checks trade CI minutes for latency; we don't want that).
#   * batch_size 1..5                          -> when PRs land together they're
#     combined into ONE CI run; when traffic is light each batch is just 1 PR
#     (low latency). This is the win over the old one-PR-at-a-time flow.
#   * batch_max_wait_time 5 min                -> wait briefly to fill a batch.
#
# SETUP (out-of-band, cannot be done from the repo):
#   1. Install the Mergify GitHub App on nanobpm/nano-bpm:
#        https://github.com/apps/mergify/installations/new
#   2. Confirm the plan (free for open source / <=5 active contributors on
#      private, then per-active-contributor). Dashboard: https://dashboard.mergify.com
#   3. Keep `main` branch protection's required status checks as-is; keep
#      "require branches up to date" (strict) OFF — the queue handles freshness.
#   4. This PR removes .github/workflows/automerge.yml so native auto-merge and
#      Mergify don't both try to merge. Merge this PR only AFTER the app is
#      installed, for an atomic cutover.

merge_queue:
  # Serial + single check stream = fewest CI runs. Speculative parallel checks
  # (max_parallel_checks > 1) would spend more CI to cut latency; we opt out.
  mode: serial
  max_parallel_checks: 1
  # If a human merges something outside the queue, re-evaluate the queue.
  reset_on_external_merge: always

queue_rules:
  - name: default
    merge_method: squash
    # Dynamic batching: 1 PR when the queue is light (fast), up to 5 combined
    # into a single CI run when PRs pile up (cheap). Failures are auto-bisected.
    batch_size:
      min: 1
      max: 5
    batch_max_wait_time: 5 min
    # Explicit checks timeout. Without this, Mergify AUTO-DERIVES the timeout
    # from the queue's *recent* CI runtime — and because CI is aggressively
    # change-gated (see `.github/workflows/ci.yml`), most recent batches only run
    # the cheap fast checks (or skip nearly everything), so the derived value
    # collapsed to ~1 minute. A batch that actually triggers the slow gates —
    # `formal (tlc)` plus the full per-crate Rust builds, where `server (clippy +
    # test)` alone runs ~6+ min on the speculative draft — then never finishes
    # inside that learned 1-minute window and is evicted with "Checks timed out"
    # even though every required check ultimately passes (evicted #1273
    # repeatedly this way). Pin a generous fixed ceiling well above the slowest
    # realistic batch so the adaptive value can never undercut real CI duration;
    # set to `null` to disable entirely.
    checks_timeout: 30 min

# The gate mirrors the canonical requiredChecks in AGENTS.md. The console
# merge-gate tests enforce parity with that protocol and CI job names.
# Use console/scripts/merge-gates.mjs to derive/check live branch protection;
# see AGENTS.md for the coordinated update procedure.
# Every required job is change-gated by the
# `changes` job's paths-filter in `.github/workflows/ci.yml`: the six code checks
# share the `code` filter (`*code_gate`), `processos (clippy + test)` has its own
# `processos` filter (skipped for PRs that don't touch `processos/**`,
# `engine-core/**`, or `.github/workflows/ci.yml`), `formal (tlc)` has its own
# `formal` filter (`formal/**`, `engine-core/src/**`, `engine-core/tests/**`,
# `engine-core/examples/**`, `engine-core/Cargo.toml` or `.github/workflows/ci.yml`), and the two console jobs
# (`console (typecheck + test)` and `console (journey e2e)`) are gated by the
# `console` filter (inputs `console/**`, `spec-console/**`, `spec-app/**`,
# `.github/workflows/ci.yml`, AGENTS.md and .mergify.yml for the merge-gate guard;
# the typecheck job additionally runs on the `docs` filter), so each is
# SKIPPED for PRs that don't touch its inputs (e.g. a console-/website-/docs-only
# PR skips all six code checks; a Rust-only PR skips both console jobs). A skipped
# check never reports `success`, so — matching the authoritative merge-protocol
# in AGENTS.md ("required-when-run, skip-tolerant": acceptedConclusions
# `["success", "skipped"]` for all ten) — each is accepted as success OR
# skipped. Required job names must not start with @: Mergify interprets
# @scope/name as an app-qualified check, so an npm-scoped job name matches the
# wrong publisher even when its actual GitHub Actions result is successful
# (#1138). Skip tolerance alone (#1130) cannot resolve that name collision.
merge_protections:
  - name: required CI checks
    description: All required CI jobs must be green (or skipped) before merge.
    if:
      - base=main
    success_conditions:
      - or:
          - check-success=rustfmt (pinned nightly)
          - check-skipped=rustfmt (pinned nightly)
      - or:
          - check-success=engine-core (clippy + test)
          - check-skipped=engine-core (clippy + test)
      - or:
          - check-success=engine-wasm-ffi (dist + verify)
          - check-skipped=engine-wasm-ffi (dist + verify)
      - or:
          - check-success=server (clippy + test)
          - check-skipped=server (clippy + test)
      - or:
          - check-success=nano-bernd (build + test)
          - check-skipped=nano-bernd (build + test)
      - or:
          - check-success=io.github.jwulf:nano-bernd (JVM, Chicory)
          - check-skipped=io.github.jwulf:nano-bernd (JVM, Chicory)
      - or:
          - check-success=processos (clippy + test)
          - check-skipped=processos (clippy + test)
      # The TLA+ model checks (formal/README.md), including the known-defect
      # ratchets and the Zeebe parity coverage guard (formal/parity). Change-gated
      # on the `formal` filter, so accept skipped too.
      - or:
          - check-success=formal (tlc)
          - check-skipped=formal (tlc)
      # Promoted to a required gate by #1127: the guided-journey browser guards
      # (incl. the modeler agent-task regression guard) were previously
      # non-required, which is how the #1127 properties-panel crash regressed
      # unnoticed. Change-gated, so accept skipped too.
      - or:
          - check-success=console (journey e2e)
          - check-skipped=console (journey e2e)
      # Promoted to a required gate by the epic #1119 retro: this is the only
      # merge gate on the console `tsc -p tsconfig.test.json` type surface and
      # the `git diff --exit-code -- src/gen` client-drift guard. It was
      # non-required, so a foundation slice that added a REQUIRED field to a
      # console generated type without updating the e2e fixture defaults
      # (console/e2e/fixtures.ts) landed on main red repeatedly — each following
      # slice had to repair the prior slice's break. Change-gated, so accept
      # skipped too.
      - or:
          - check-success=console (typecheck + test)
          - check-skipped=console (typecheck + test)

# AUTO-MERGE OFF. There is deliberately NO `merge_protections_settings.
# auto_merge_conditions` key here: omitting it is Mergify's documented way to
# disable auto-merge, so no PR is ever auto-enqueued/auto-merged on green.
# Merging is a manual act — click "Merge" in the GitHub UI once the required CI
# checks pass, or `@mergifyio queue` to use the queue on demand. (Note: the key
# does NOT accept `false`; a boolean there fails config validation. To re-enable
# auto-merge, set `auto_merge_conditions: true` — a list, not a bool — and update
# AGENTS.md "## Merging PRs".)
